- name: 地下异能者黑市
  category: social
  description: 公开社会秩序之下存在针对异能者、样本和幸存者的地下城与黑市。富人、资本和更高层组织会购买、囚禁、下注、观赏、借用甚至处置异能者，把人当作资源和娱乐品。
  constraints:
  - 高中阶段只通过旧编号、失踪者、样本流转、幸存者伤痕、拍卖术语和零碎记录暗示，不要整章百科式明牌。
  - 顾夜舟前世势力与这条地下链直接相关，但当前时间线里不能太早让整支势力登场。
  introduced_chapter: null
- name: 强者至上极端派
  category: social
  description: 更高层的极端异能者势力认为普通人类是劣质资源消耗者，世界秩序与资源应由强者支配，必要时可以清洗普通人。这是后续世界级冲突的核心思想来源之一。
  constraints:
  - 高中阶段只露理念碎片、执行痕迹、筛选标准和资源物化口吻，不直接抛完整宣言。
  - 陆闻川不是这一层博弈的最终核心，只是校园阶段伸进来的执行之手。
  introduced_chapter: null
- name: 回线分工与代价
  category: magic_system
  description: 发现可回溯后，不同人不能无代价地一起回来。更合理的方式是分工：一部分留在原时间线保存资料、善后或拖住敌人，另一部分以自杀或极端方式回到关键节点，但要付出记忆、身体或能力代价。
  constraints:
  - 当前时间线只通过碎片记忆、错位行动、人物缺口和状态损耗表现，不要用设定说明书一次讲清。
  - 回来的人越多、层级越高，代价越重；不存在无损回线。
  introduced_chapter: null
- name: 顾夜舟前世势力来源
  category: social
  description: 顾启明倒台后没有留下能让顾夜舟依靠的有效遗产。顾夜舟上一条线的力量来自他亲手救下的一批强异能者与幸存者；他给了这些人第二次活着的机会，所以他们愿意追随他，也愿意参与回线布局。
  constraints:
  - 这股力量不能写成廉价黑帮或突然冒出的万能部队，成员应各自带着代价、旧伤和与顾夜舟的救命因果。
  - 高中阶段先埋代号、名单残影、旧部痕迹和别人对07的忌惮，大学线再逐步实装。
  introduced_chapter: null
- name: 认门人与门
  category: magic_system
  description: 沈清辞是“认门的人”，能识别、接触并在极端情况下毁掉“门”。门内是类似混沌的起源之力，既能诱发异能链路，也会试图吞噬认门人、借她闯入现实世界。
  constraints:
  - 门设定只能通过闪回、旧记录、术语残片、系统警告和物证慢慢露出，不能写成角色长篇科普。
  - 沈清辞当前线还不能完整理解自己是认门人，只能先听见“认门”“门没坏完”“回收本线S-QC”等碎片。
  introduced_chapter: 46
- name: 门毁与异能消失
  category: magic_system
  description: 门是异能者能力链路的源头之一。门若彻底消失，所有异能者的异能都会随之衰退或消失；上一条线里沈清辞曾以鱼死网破方式毁门，但门并未彻底损坏。
  constraints:
  - 这条规则会抬高世界级冲突，前期只能作为危险暗线和敌我目标差异出现。
  - 不能让角色马上掌握“毁门=所有异能消失”的完整操作方法，防止过早终局化。
  introduced_chapter: 46
- name: 许知衡非回线者
  category: magic_system
  description: 许知衡不是重生者，也不是完整回线人员。他对旧线关键词、07编号和沈清辞反应的精准踩点，来自实验者投喂、旧线记录、门源力残留、信任诱导能力和当前线布局。
  constraints:
  - 后续正文不得把许知衡写成亲历上一条线的人。
  - 他可以像知道很多事，但要表现为“被喂过资料、被训练过、被门源力污染或被安排到精准位置”，而不是自己回忆前世。
  introduced_chapter: 46
- name: 跨线回收认门人
  category: conflict
  description: 实验者和更高层势力需要找到当前线的沈清辞，把她带回旧时空或门相关场域，继续利用认门人身份。顾夜舟上一条线从顾澜/异控局线得知门没有彻底损坏，沈清辞太虚弱，世界末日迟早会被重新推开，因此布线后以死亡回到当前关键节点找她。
  constraints:
  - 高中阶段先写“回收对象”“本线S-QC”“旧线信号”“门没坏完”等碎片，不让顾夜舟和沈清辞一次性知道全部。
  - 顾夜舟的回线真相应伴随更多旧部、顾澜和异控局线逐步揭开，不能在一章里完全明牌。
  introduced_chapter: 46
- name: 沈清辞散打防身
  category: social
  description: 沈清辞从小被沈父安排学习散打和防身，原因是沈父虽然只在局中外层，却真心疼女儿，希望她遇到危险时至少能保护自己并拖到救援。这解释她前文遇事时的从容和反应速度。
  constraints:
  - 她的散打是现实防身能力，不是超规格战斗外挂。
  - 可对普通执行者或低阶威胁形成短暂压制，遇到强异能者仍需要顾夜舟、系统、环境或队友配合。
  introduced_chapter: 47
- name: 认门人与钥匙接触保护
  category: magic_system
  description: 认门人沈清辞和钥匙顾夜舟在一起且存在身体接触时，致死伤害无法真正落成。规则表现为判定失败、攻击偏移、器械失灵、伤害降级或世界规则短暂卡顿。 第54章后补充：接触保护只是命线互锁的可见强化表现，底层绑定从沈清辞与顾夜舟当前线相遇时已经开始。
  constraints:
  - 当前阶段只能用异常现象和系统碎片提示表现，不能让角色完全掌握机制。
  - 这条规则只抵消致死结局，不等于免疫疼痛、控制、绑架、失忆、削弱或非致命伤害。
  - 敌方若要绕过命线互锁，更可能选择精神诱导、污染判断或逼迫自愿死亡，而非单纯致死攻击。
  introduced_chapter: 47
- name: 顾澜时空机器与旧部苏醒
  category: technology
  description: 顾澜在顾夜舟死后想出过类似时空穿越机器的办法，把自愿回溯的旧部带着原身送到当前时空线追顾夜舟。多数旧部保留完整记忆，但会受到世界规则削弱，出现异能衰减、定位偏差、苏醒延迟和身体损耗。
  constraints:
  - 旧部不能一口气全员登场，先一个一个苏醒和找来。
  - 旧部应带着上一条线的伤、代价、旧称呼和对顾夜舟的忠诚，不要写成万能援军。
  introduced_chapter: 47
- name: 反派跨线法器与统一削弱
  category: magic_system
  description: 反派也有自己的跨线方式，方向是由大量时空之力共同锻造的异能法器或类似工具。无论我方机器还是反派法器，跨时空都违反世界规则，所以所有来到当前线的人都会被削弱。
  constraints:
  - 反派不能无损携带全部实力碾压高中线。
  - 法器和机器的机制后续通过残片、波动、旧部描述和敌方失败痕迹慢慢露出。
  introduced_chapter: null
- name: 顾夜舟救世界动机
  category: emotional_logic
  description: 顾夜舟对世界本身没有天然救世执念。他在乎的是沈清辞必须好好活着；如果她要活着就必须救这个倒霉世界，他会把世界一起救下来。
  constraints:
  - 这个动机要写成偏执深情和行动逻辑，不写成空泛救世宣言。
  - 当前少年版顾夜舟气场尚未达到上一条线的阴郁大佬形态，旧部见到他时可以形成轻喜剧反差。
  introduced_chapter: 47
- name: 契约者共生协议
  category: magic_system
  description: 上一条线里，沈清辞和顾夜舟分别以自己为中心建立过可信阵营网络。自愿者签下共生协议后成为契约者，协议代价压在自愿者自己的命上；违反协议会反噬本人，协议他方不受伤害。
  constraints:
  - 契约者不是无脑忠诚，必须有被救、被保护、共同选择或亲眼见证真相的理由。
  - 当前线遇到契约者时可以触发本能信任、记忆回流或标记共振，但不能让所有设定一次性明牌。
  introduced_chapter: 48
- name: 双网与系统暗线
  category: magic_system
  description: 顾夜舟和沈清辞在上一条线各自埋下一张网，可信者被打上标记；当前线再遇见这些人时，男女主接受得快是旧线布置在生效。系统是沈清辞单人专属的另一条线路，第49章后沈清辞已主动向顾夜舟披露其存在，但系统来源仍未知。
  constraints:
  - 顾夜舟不能直接接收系统面板，只能通过沈清辞转述、写下提示和行为验证来确认系统存在。
  - 系统不能被旧部、顾夜舟或敌方直接解释，后期再揭示来源。
  introduced_chapter: 48
- name: 单方协议与灵魂烙印
  category: magic_system
  description: 上一条线最后时刻，沈清辞曾给顾夜舟下过单方协议，把自己当前线的命压在顾夜舟身上，自己则去完成毁门。顾夜舟后续才会知道灵魂已被烙上印记。
  constraints:
  - 当前阶段只能以痛感、烙印闪回、残缺誓词和顾夜舟对沈清辞无法放手的本能表现，不要立刻让两人完整理解。
  - 单方协议应加深情感重量，不要变成万能免死外挂。
  introduced_chapter: 48
- name: 短时记忆裁剪
  category: magic_system
  description: 第49章起，沈清辞可短暂裁剪低阶目标近期可见事件记忆。首次使用对象是伪装维修工的低阶执行者，她剪掉对方最近十五分钟内关于楼梯间攻击、旧部和顾夜舟的记忆，并替换成水管检修、地滑摔倒、学生问路等合理现场。
  constraints:
  - 当前能力只能小范围、短时间、低阶目标使用，且最好在目标已被制服或精神失衡时发动。
  - 不能变成万能洗脑、长期人格改写或随意删除关键人物核心记忆的外挂。
  - 使用后沈清辞会有指尖发麻、头痛或精神漏电感，后续高阶使用必须付出更明显代价。
  introduced_chapter: 49
- name: 系统披露与单人专属
  category: magic_system
  description: 沈清辞在第49章旧部饭局上主动向顾夜舟说明系统存在，并把系统提示写给他看。她知道系统能给任务、提示和技能，但不知道它是机器、协议残响、门源力副产物还是别的存在。
  constraints:
  - 系统仍然只对沈清辞直接显示和发声，顾夜舟只能通过沈清辞同步转述确认。
  - 顾夜舟知道系统存在后，不能立刻破解或解释系统，也不能让系统变成两人共同外挂。
  - 系统可以继续吐槽和提示，但不要在关键情绪场景里刷屏替角色表达。
  introduced_chapter: 49
- name: 单向共感链路
  category: magic_system
  description: 契约记忆恢复后，沈清辞上一条线给顾夜舟下的单方协议开始在当前线生效。初期表现为顾夜舟到沈清辞的单向共感：顾夜舟的疼痛和心动都会同步到沈清辞身上，当前能量不足时无法屏蔽。
  constraints:
  - 共感链路应兼顾情感刀点和番茄轻喜剧，疼痛共享用于体现协议重量，心动共享用于制造地下恋拉扯。
  - 这不是万能读心术，沈清辞只能感到强烈身体感受或情绪冲击，不能因此读取顾夜舟全部想法。
  - 后续可让两人尝试训练屏蔽或反向稳定，但必须循序渐进。
  introduced_chapter: 49
- name: 旧部弱状态重聚
  category: social
  description: 荒川、钟塔、旧港第49章刚苏醒时身体坐标不稳，力量控制、肢体协调和通讯感知都出现偏差。旧部第一顿饭发生在学校后街砂锅粥店，用酸梅汤代替酒，象征上一条线没来得及完整坐齐的队伍在当前线重新集合。
  constraints:
  - 旧部不是满血援军，当前阶段只能提供碎片信息、情感支撑和有限协助。
  - 旧部对少年版顾夜舟可以有轻喜剧反差和磕CP倾向，但不能削弱他们上一条线的代价和忠诚。
  - 旧部线后续要一边推进组织重组，一边服务男女主感情和校园日常烟火气。
  introduced_chapter: 49
- name: 清舟私下正式关系
  category: emotional_logic
  description: 第50章起，沈清辞和顾夜舟已经私下确认正式恋爱关系，但仍是高中阶段地下恋，不公开官宣、不越过克制边界。关系升级由单向共感暴露顾夜舟想要名分推动，沈清辞主动给出“正式男友”身份。
  constraints:
  - 当前阶段亲密描写以牵手、额头吻、管睡觉、共感心跳和日常照顾为主，不要写过界成人向内容。
  - 学校里可继续用CP楼、同学起哄和李佳佳吐槽制造轻喜剧，但正式关系主要在私下成立，不能让校园公开场马上失控。
  introduced_chapter: 50
- name: 顾夜舟老公寓临时基地
  category: social
  description: 顾夜舟有一套从顾启明手里抢回来的顾澜婚前老公寓。顾启明曾将其转入空壳公司准备脱手，顾夜舟用非法转移资产、伪造监护费用、挪用顾澜遗产和录音材料逼顾启明签返还协议。第50章后，这里成为青鲤、荒川、钟塔和旧港第一阶段临时落脚点。
  constraints:
  - 这套房不能写成顾启明善意遗产，而是顾夜舟靠证据和反制手段硬抢回来的安全地盘。
  - 老公寓可作为旧部临时基地、资料存放点和清舟私下见面点，但防护能力有限，不能当绝对安全堡垒。
  introduced_chapter: 50
- name: 许知衡旧线片段投喂
  category: conflict
  description: 许知衡不是重生者，也不是完整回线者。第50章陆闻川向他投喂少量旧线片段，确认他曾在上一条线演着演着对沈清辞产生过一点真实喜欢，但情感争夺窗口在当前线已经关闭，后续功能转向回收任务。
  constraints:
  - 后续不得把许知衡写成完整拥有前世记忆的人，他拿到的是被筛选、压缩、投喂的片段。
  - 他的感情可以复杂，但力量、任务和门相关布局压过感情；他不再承担主要恋爱竞争功能，而是承担错误路径残影和回收执行位功能。
  introduced_chapter: 50
- name: 李佳佳沈家临时保护
  category: social
  description: 李佳佳父母长期在外地照顾身体不好的弟弟，她独自在学校附近租房读书。第50章因得罪许知衡且沈网资料袋印记太亮，沈清辞把她带回沈家临时保护，也让她第一次体验富家女生活。
  constraints:
  - 李佳佳可以用富家女生活体验制造轻喜剧，但底层情绪是她终于被人接住、被人安排安全处。
  - 她仍未觉醒沈网契约记忆，保护她不能变成让她立刻获得大女主信息权限。
  introduced_chapter: 50
- name: 百日冲刺心理摸排
  category: conflict
  description: 第51章后，成人礼结束后的校园节点进入高考冲刺一百天。陆闻川借“百日冲刺心理支持/心理摸排”名义亲自接管镜面线，把“苏晚宁”病休后的公开壳体下线包装成正常学生心理流程。
  constraints:
  - 这条线应保持校园真实感，表层是高三压力、目标学校、便利贴和心理支持；底层才是镜面筛查、S-QC回收和07重新标记。
  - 陆闻川亲自上场后，危险感来自流程合法、名义温和、名单看似正常，不要立刻写成公开绑架或硬冲突。
  introduced_chapter: 51
- name: 旧部基地白天运转
  category: social
  description: 第51章起，青鲤、荒川、钟塔、旧港暂时不进入校园，而是在顾夜舟老公寓适应当前线身体状态、恢复坐标、整理上一条线地下城/样本流转/心理筛查等重要信息，等顾夜舟放学后汇报。
  constraints:
  - 旧部线要和校园线交替推进，不能让旧部替高中主角团平推问题。
  - 旧部可提供旧线经验、轻喜剧和危机预警，但仍处于削弱与适应期。
  introduced_chapter: 51
- name: 李佳佳治愈稳定初醒
  category: magic_system
  description: 第52章起，李佳佳作为沈网契约者出现低阶治愈/稳定倾向。初期表现为手心发烫，能缓解沈清辞被筛查标记触发的头痛、蜂鸣和轻微状态震荡。
  constraints:
  - 李佳佳当前仍是普通女高视角，不能立刻掌握能力原理或变成强力治疗者。
  - 能力应优先服务保护、安抚和情绪稳定，使用后可出现发热、疲惫、手抖或数学卷子写不动等轻喜剧代价。
  introduced_chapter: 52
- name: 许知衡与陆闻川阵营裂缝
  category: conflict
  description: 许知衡和陆闻川同属回收/镜面相关反派阵营，但当前线级别差半个阶梯。陆闻川掌握许知衡旧线片段投喂和流程节奏；上一条线许知衡曾有更高权限，接近策略席，因此两人有旧怨与路线分歧。
  constraints:
  - 许知衡当前不该写成陆闻川的乖顺下属，他会质疑陆闻川对沈清辞、顾夜舟和李佳佳的处理。
  - 陆闻川更擅长合法流程和临床筛查，许知衡更擅长信任诱导和记忆路径；两者路线冲突可制造反派内耗。
  introduced_chapter: 52
- name: 双二十四岁终局
  category: timeline
  description: 上一条线终局记录显示，沈清辞以S-QC身份死在二十四岁，顾夜舟作为07也死在二十四岁，两人的死亡间隔在四十六小时内。这是顾夜舟回线找她和旧部继续追随的重要情感重量。
  constraints:
  - 当前阶段先由旧部获取残片，沈清辞和顾夜舟不必立即知道完整记录。
  - 这条信息后续应伴随放学汇报、共同闪回或心理访谈刺激逐步进入男女主视野。
  introduced_chapter: 52
- name: 许知衡记忆与异能反向苏醒
  category: magic_system
  description: 第53章起，许知衡的旧线记忆完整度和信任诱导类异能觉醒速度明显上升。他可以反向利用陆闻川投喂的旧线片段和校际流程，干扰陆闻川的筛查安排。
  constraints:
  - 许知衡仍不是完整回线者，记忆增长来自投喂片段、门源力残留、当前线刺激和自身能力苏醒。
  - 他对实验室体系没有忠诚，因为上一条线曾有人试图把他的能力纳入样本评估。
  introduced_chapter: 53
- name: 旧港分支视野
  category: magic_system
  description: 旧港通讯器可显示过去或未来的残片，是预知与回溯能力的外在表现。巅峰期旧港能看见一年内多个选择通向的未来分支，当前线因削弱只能看到断裂路线、颜色结果和少量提示。
  constraints:
  - 旧港害怕蝴蝶效应，不会轻易把未来完整说出口；他更倾向于偷偷介入、延迟危险、改变小物件或发模糊提醒。
  - 分支视野不能成为全知攻略，每次提示都必须有代价、误差或未知变量。
  introduced_chapter: 53
- name: 沈父异控局高层身份
  category: social
  description: 沈父对外是商业父亲与沈家家主，真实身份为异控局高层，能调动沈家保护组、查看异常路线并与顾澜合作投放信息。当前线只让读者和主角通过通讯环、授权流程、保护组人员和异常术语窥见轮廓。
  constraints:
  - 高中阶段不让沈父直接对沈清辞摊牌，避免抢走校园主线。
  - 沈父的行动要兼具父亲保护欲与组织高层克制，不能写成万能救场机器。
  introduced_chapter: 54
- name: 顾澜半上线状态
  category: technology
  description: 顾澜当前一半挂在上一条线或更高层上线，一半锚在当前线通讯坐标，因此暂时无法亲身下场。她能与沈父合作投放信息、提醒关键节点、推动保护流程，但通讯存在噪点、延迟和断线风险。
  constraints:
  - 顾澜不能在高中阶段直接登场解决问题。
  - 每次顾澜通讯都应有代价或限制，不能变成实时全知指挥。
  introduced_chapter: 54
- name: 沈家保护组
  category: social
  description: 沈家的司机、保卫、维修和物业外壳中混有异控局保护组人员。秦越是当前线第一个显性露出的人，能以现实流程和监护人授权保护沈清辞，同时隐藏组织身份。
  constraints:
  - 保护组优先使用校安、监护人、维修、物业和流程授权等现实外壳，不要公开亮组织名。
  - 保护组能拖延、遮挡和带走证据，但不能替主角团平推敌人。
  introduced_chapter: 54
- name: 命线互锁与自愿死亡风险
  category: magic_system
  description: 沈清辞和顾夜舟从当前线相遇起命线已经绑定，一个人不死，另一个人无论如何都会被规则兜住；两人在一起时保护更强。敌方若想突破这条规则，方向不是外力杀死，而是诱导他们自愿赴死或主动放弃对方。
  constraints:
  - 命线互锁只兜住致死结果，不免疫疼痛、污染、控制、精神诱导、失忆、分离和非致命伤。
  - 当前阶段只能通过系统碎片、顾澜/沈父警告和敌方误判表现，不让主角团完整掌握操作规则。
  introduced_chapter: 54
- name: 训练场毒系外援
  category: conflict
  description: 强者至上训练场开始与陆闻川合作介入当前线。过法器后他们的异能被削弱，但毒系成员温仍能依靠药剂、粉末、污染和诱导制造风险，重点不在直接杀人，而在让目标做出危险选择。
  constraints:
  - 训练场外援不能满血碾压校园线，必须受法器削弱、流程限制和异控局保护组牵制。
  - 毒系威胁应影响感官、判断、异能稳定和共感链路，不写成简单一毒全倒。
  introduced_chapter: 54
- name: 顾夜舟控制权十分钟
  category: magic_system
  description: 第55章起，顾夜舟的07网心能力从共振和契约感知跃迁为更具体的控制权。当前可见层级包括控物、控人和触碰能力链路控制；高压下可进入约十分钟的临时碾压控制态。
  constraints:
  - 临时控制态失控风险极高，必须由沈清辞作为S-QC保持接触监护，用现实锚点和情绪拉回稳定他。
  - 控制权不能变成无限外挂；十分钟窗口结束后应有精神、身体、契约网或旧线记忆反噬。
  - 能力升级要伴随旧线闪回、契约生命点痛感或现实高危刺激，而不是无缘无故变强。
  introduced_chapter: 55
- name: 顾网网心生命点感知
  category: magic_system
  description: 顾夜舟作为上一条线顾网共生协议的网心，能在契约者生命点遭到围剿或濒危时感知到红线警报。青鲤、荒川、钟塔、旧港四个点在第55章同时闪红。
  constraints:
  - 生命点感知只能提示危险和方向，不能直接给完整战场地图。
  - 过强刺激会诱发顾夜舟失控和旧线记忆回流，需要沈清辞在场监护。
  introduced_chapter: 55
- name: 顾澜高危激发计划
  category: strategy
  description: 顾澜让旧部来到当前线时就预留了高危刺激窗口。旧部恢复慢不只是削弱代价，也是她计划中用来逼出潜力的一环；顾夜舟也需要类似刺激唤醒网心控制权。
  constraints:
  - 顾澜不是冷血坑队友，而是在世界级风险下做高压布局；她敢这么做的关键前提是沈清辞能守在顾夜舟身边。
  - 这条计划要呈现顾澜的强硬和代价，不要写成轻飘飘的玩笑。
  introduced_chapter: 55
- name: 秦越力量速度型觉醒
  category: magic_system
  description: 秦越是力量/速度型异能者，属于本书当前可见战力天花板之一。他不是重生者或回线者，而是在当前线稳定、持续、未被打断地逐步觉醒。
  constraints:
  - 秦越可以在当前阶段压住被削弱的温，但不能替主角团平推所有敌人。
  - 他的强应通过速度、力量、判断、流程和保护动作体现，而不是长篇自述。
  introduced_chapter: 55
- name: 李佳佳灰蓝毒点
  category: foreshadowing
  description: 温逃离秦越追击时，有一粒灰蓝毒粉落到李佳佳校服袖口内侧，在腕骨附近留下几乎看不见的小点。当前没有爆发，是后续伏笔。
  constraints:
  - 这枚毒点暂时只作为细节出现，不能立即让系统完整解释或让李佳佳倒下。
  - 后续回收时应与李佳佳初醒稳定能力、沈网契约者身份和温的毒系诱导相关。
  introduced_chapter: 55
- name: 陆闻川治愈异能与妹妹执念
  category: emotional_logic
  description: 陆闻川最初是医生，妹妹陆星禾死于异能污染造成的器官衰竭。他在葬礼上觉醒治愈异能，却只能修复白菊，无法起死回生，因此从此压下治愈能力，并把复活妹妹变成站上实验台的核心执念。
  constraints:
  - 陆闻川的动机可以增加复杂度，但不能洗白他对学生、镜面载体和样本造成的伤害。
  - 他误以为门后存在足以复活人的力量，读者侧可逐步知道门后实际是毁灭之力。
  introduced_chapter: 56
- name: 陆闻川镜面攻击化
  category: magic_system
  description: 陆闻川原生异能偏治愈，但因为无法救回妹妹，他长期不用这项能力，转而通过镜面、暗示、意识攻击、载体校准和临床流程，把自己硬生生改造成攻击意念型操盘者。
  constraints:
  - 他的攻击性能力应带有临床、镜面和心理暗示痕迹，不能写成普通暴力输出。
  - 他的耐心和流程洁癖来自医生背景与复活执念，推进会更慢但更难抓住把柄。
  introduced_chapter: 56
- name: 顾网远程控制干预
  category: magic_system
  description: 顾夜舟作为顾网网心，在十分钟控制态中可以通过契约线远程干预旧部所在战场，借环境、旧部能力和契约生命点完成控物、控人和能力链路切断。
  constraints:
  - 远程干预必须依托顾网契约者和现实媒介，不能变成无限距离全图控制。
  - 远程控制会放大失控风险和旧线记忆回流，仍需沈清辞接触监护。
  introduced_chapter: 56
- name: 07第四阶段陷阱
  category: conflict
  description: 强者至上训练场围剿旧部的真正目标不是直接杀死旧部，而是通过契约生命点危机逼顾夜舟在十分钟控制态内进入未知第四阶段。
  constraints:
  - 第四阶段目前只作为危险陷阱存在，不能在第56章直接安全解锁。
  - 沈清辞必须成为阻止顾夜舟越线的主动监护人，而不是事后被动安抚。
  introduced_chapter: 56
- name: 旧部三成反攻
  category: magic_system
  description: 第57章起，青鲤、荒川、钟塔、旧港在老公寓围剿中觉醒回流约三成。三成不足以满血平推，但足够在顾夜舟十分钟高控辅助下反攻被削弱的训练场成员。
  constraints:
  - 顾夜舟只能稳线、补空隙和拦致命节点，旧部必须自己完成主要反击，体现他们不是等待救援的残兵。
  - 三成觉醒后仍有伤、疲惫和控制误差，不能立刻恢复巅峰。
  introduced_chapter: 57
- name: 十分钟高控反噬
  category: magic_system
  description: 顾夜舟完成第一次十分钟高控后，系统提示当前输出约为上一条线巅峰十分之一。高控结束会带来虎口旧伤、记忆回流、网心疲劳和身体晃神。
  constraints:
  - 高控不是无损外挂。结束后必须让顾夜舟出现可见代价，并需要沈清辞扶住或监护。
  - 当前线不能随便触碰第四阶段，训练场会试图诱导，但沈清辞必须负责刹车。
  introduced_chapter: 57
- name: 沈宅临时大本营
  category: social
  description: 老公寓被训练场定位后，沈清辞决定把顾夜舟、旧部和李佳佳转移到沈宅。沈宅安全网、沈家保护组和沈父身份将进入下一阶段正面谈话。
  constraints:
  - 沈宅不是绝对安全屋，只是比老公寓更适合集中保护和谈判。
  - 沈清辞必须向沈父追问保护组、异控局、顾澜坐标和此前隐瞒，不要让成年人继续单方面安排。
  introduced_chapter: 57
- name: 灰蓝器官污染毒点
  category: conflict
  description: 温种在李佳佳袖口内侧的灰蓝毒点会贴在稳定/治愈倾向上，等她下一次主动安抚或治疗别人时深入，走器官污染路径。该路径与陆闻川妹妹陆星禾当年的污染衰竭相似。
  constraints:
  - 毒点不立即爆发，需后续通过李佳佳主动使用能力触发。
  - 陆闻川后续发现李佳佳情况时，应触发陆星禾记忆和复活执念，不要提前让主角团完整识破。
  introduced_chapter: 57
- name: 温的制毒老师
  category: conflict
  description: 温当前使用的手制旧毒来自曾教他制毒的人。该人可埋成害死陆星禾的真正凶手或关键执行者；上一条线温认识陆闻川时已是毒系巅峰，很少再用这种旧毒法。
  constraints:
  - 当前只通过温和同伴对话埋线，不直接揭示制毒老师姓名和完整身份。
  - 这条线后续应连接陆闻川妹妹死亡、训练场毒系和门后力量骗局。
  introduced_chapter: 57
- name: 沈父回线记忆
  category: timeline
  description: 第58章起，沈父承认自己也是上条线过来的人，醒得比沈清辞早。他在沈清辞询问顾启明时确认两条线开始交汇，并记得上一条线沈清辞二十四岁身体指标下坠、顾夜舟站在病房外的终局阴影。
  constraints:
  - 沈父的回线不能写成掌握全局的万能外挂。他知道足够让自己害怕和保护女儿，但仍受顾澜坐标、异控局流程和门信息缺口限制。
  - 他的核心愿望是让沈清辞普通平安长大，这会与沈清辞要求信息权发生冲突。
  introduced_chapter: 58
- name: 陆闻川数学老师壳
  category: conflict
  description: 心理医生身份因污染事件、秦越介入和校方留痕变脏后，陆闻川收掉该壳，换脸成临川一中高三数学代课老师周启明。数学课外辅导成为他观察李佳佳毒点的自然入口。
  constraints:
  - 新身份必须保持普通、合理、干净，不要让陆闻川又以心理医生方式明牌上门。
  - 数学老师身份应利用高三真实校园压力、辅导、成绩单和办公室场景推进李佳佳毒线。
  introduced_chapter: 58

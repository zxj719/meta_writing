name: 陆闻川
aliases:
- 陆医生
- 周启明
- 数学代课老师
physical_description: 白衬衫和浅灰外套几乎成了固定装束，五官端正斯文，笑起来温和，像任何一所重点高中都会欢迎进校的心理专家；真正让人发冷的是那种过于平稳的眼神，像情绪被提前处理过。
personality_traits:
- 温和
- 控制欲强
- 冷血
- 擅长伪装
- 临床思维极重
knowledge_state: 清楚07号、镜面身份壳、沈清辞识伪能力和成人礼节点的价值，也知道顾启明已经不再适合站在最前面；第32章后，他又往前推了一步，把沈清辞和顾夜舟一起送上公开领誓名单；第50章后，开始向许知衡投喂少量旧线片段，确认许知衡已失去情感争夺窗口，但仍可作为回收任务的执行位使用；第51章后，他把“苏晚宁”病休和镜面线包装成百日冲刺心理支持对象，亲自接管心理摸排流程，并将沈清辞、顾夜舟、李佳佳同时纳入新名单。第52章后，他已经进入高三七班收取第一批心理自评表，通过低频筛查标记观察S-QC、07和LJJ，并与许知衡暴露路线分歧：许知衡质疑他撤壳和碰李佳佳太急，他则以当前线信息投放者身份压住许知衡。第53章后，他试图借心理访谈把顾夜舟、沈清辞、李佳佳拆成单独样本，却被许知衡从附中端远程篡改校际心理支持系统，个体访谈被迫改成团体访谈；他同时注意到李佳佳对沈清辞有低阶安抚/稳定反应，确认LJJ不是普通同学。第54章后，他确认沈家保护组已经介入心理咨询室流程，秦越能以监护人授权和校安协查限制自己；同时训练场毒系外援温提前投放灰蓝污染，虽然能制造转场机会，也让他的干净流程失控。
  第55章后，他借灰蓝污染制造单独转场的计划被连续打断：许知衡改流程、秦越封控、顾夜舟控制权跃迁和强者至上外援温失手叠在一起。他确认沈家保护组不仅能挡流程，秦越本人还是高阶力量/速度型觉醒者；同时顾夜舟的07网心控制权已经开始回流，心理咨询室这条干净流程基本失控。
  第56章后，读者侧首次看到他的核心执念：妹妹陆星禾死于异能污染导致的器官衰竭，他作为医生没能救回她；葬礼上他的治愈异能复苏，却只能治愈白菊，无法起死回生。因此他长期不用治愈能力，转向镜面、暗示和意识攻击，追求门后他误以为能复活死人的力量。
  第57章后，读者侧知道李佳佳身上灰蓝毒点的器官污染路径与陆星禾当年相似；温有意让陆闻川后续认出这种情况，以刺激他对门后复活力量的执念。陆闻川本人暂未发现李佳佳中毒。
  第58章后，他因心理医生身份线在污染事件后留下太多脏痕迹，决定收掉该壳，换脸成临川一中高三数学代课老师周启明。他很早察觉李佳佳稳定系波动迟滞，夜里梦见妹妹陆星禾在雨中难过地看着他，因此准备用数学课外辅导观察李佳佳。
emotional_state: 情绪波动极低，仍旧处在一切尽在掌控的冷静里；即便局部失手，也只会把计划往更亮、更公开的场域平移。第53章后，他首次在公开流程内被许知衡当场拆台，但仍保持临床式冷静，准备把失控变量转入更隐蔽的下一步流程。
relationships:
- target: 顾夜舟
  type: 核心目标
  description: 07号钥匙，最重要也最难彻底回收的样本。
  knowledge: 知道顾夜舟的能力边界、失控触发点和最在意的人。
- target: 沈清辞
  type: 高价值变量
  description: 原本只是靠近07号时的异常锚点，如今已升级成必须控制和观察的第二关键点。
  knowledge: 知道她前世没死在车祸现场，也知道她的识伪能力正在醒。
- target: 林雾
  type: 可替换载体
  description: 需要时能用，坏了就换。
  knowledge: 知道她开始不稳，也知道她迟早会背叛。
- target: 陆星禾
  type: 妹妹/执念核心
  description: 因异能污染导致器官衰竭死亡，是陆闻川追求门后复活力量的最初动因。
  knowledge: 陆闻川的治愈异能在她葬礼上觉醒，却无法复活她。
current_goals:
- 回收07号，重新把顾夜舟拉回实验节奏
- 在校园公开场域完成对沈清辞能力的进一步确认
- 借成人礼与心理摸排流程推进镜面换人
- 保证真正的苏晚宁按节点进入学校
- 利用许知衡获得的旧线片段继续逼近沈清辞，避免自己过早暴露在正面冲突里
- 借百日冲刺心理摸排重新筛查沈清辞、顾夜舟和李佳佳，把镜面线从公开壳体转入合法流程
- 执行下午第三节后的三人心理访谈，验证李佳佳是否出现沈网异常
- 追查许知衡为何能越权改写校际心理支持系统，并判断他记忆完整度与异能苏醒速度是否超出投喂预期
- 继续验证李佳佳的安抚/治愈倾向，避免让三人团体访谈彻底脱离控制
- 利用污染制造换房间和拆分三人的机会
- 压住训练场外援带来的失控风险，避免异控局保护组抓到实证
- 处理心理咨询室流程失控、顾夜舟控制权暴露和秦越强行介入后的后续风险
- 重新评估训练场外援温带来的可用性与失控风险
- 以数学代课老师周启明身份接近李佳佳，借课外辅导观察她的灰蓝毒点
location: 临川一中附近临时办公室，周启明身份生成中
core_triangle:
  desire: 拿到门后的力量，复活妹妹陆星禾，并让旧项目以更干净的方式继续推进
  ability: 临床经验、极强的伪装力、对流程和人心的掌控，原生治愈异能，以及后天改造出的镜面/暗示/意识攻击能力
  obstacle: 07号越来越难控、沈清辞的识伪能力正在破局、旧样本和证人开始往外漏；他追求的门后力量真实方向并非复活，而是毁灭
motivation_type: mission
growth_stage: transformed
backstory: 青岚项目真正负责临床和阈值诱导的人之一，习惯站在顾启明等更显眼的人后面做最后拍板，也最擅长把伤害包装成专业与关怀。更早之前，他是医生，妹妹陆星禾因异能污染器官衰竭死亡后，他在葬礼上觉醒治愈异能，却发现这份能力救不了死人。此后他不用治愈，也不愿用在自己身上，而是通过镜面线、意识攻击和临床实验接近门后的源力，误以为那里存在足以复活妹妹的力量。
first_appearance: 25
last_active: 58
is_pov: false

name: 青鲤
aliases:
- 旧部青鲤
- 顾夜舟旧下属
physical_description: 二十岁出头的年轻女人，短发，眼睛很亮，左耳有一枚小小的银色鱼骨耳钉；她行动时像随时准备从人群缝里滑走，笑起来却有点没正形。当前线初登场可伪装成外卖或跑腿人员，衣服干净但鞋底沾着长途赶路的灰。
personality_traits:
- 机灵
- 忠诚
- 爱吐槽
- 观察力强
- 旧线记忆完整
- 磕CP倾向明显
knowledge_state: 她是上一条线里顾夜舟救下并收拢的旧部之一，自愿通过顾澜的时空机器带着原身来到当前线追顾夜舟。她保留完整旧线记忆，知道上一条线的顾夜舟阴郁、脸臭、不善言辞，但对旧部其实很好；也知道沈清辞是顾夜舟最不能碰的软肋。当前线能力被世界规则削弱，不能当万能援军。第49章后，她已经找到并带顾夜舟见到刚苏醒的荒川、钟塔和旧港，也知道李佳佳资料袋里的沈网标记很亮，暂时不能让李佳佳单独落单。第51章后，她开始在顾夜舟老公寓协调旧部白天适应身体、整理上一条线地下城、样本流转和心理筛查等重要信息；她也以回忆补出自己曾在旧港地下三层水箱拍卖场被顾夜舟救下，并见过顾夜舟上一条线远远保护沈清辞却无法靠近。第52章后，她与旧部看到终局记录残片，知道S-QC与07都死于二十四岁，且间隔四十六小时内，决定暂不在上课时间直接通知顾夜舟。第53章后，她收到旧港的分支预警，知道心理咨询室访谈不能分开，也知道旧港暂时隐瞒“双二十四岁”是为了避免更黑的路线；她将“访谈别分开”转发给顾夜舟，成为旧部与校园现场之间的低调联络点。
  第55章后，她与荒川、钟塔、旧港在老公寓遭强者至上训练场其他成员围剿，契约生命点被顾夜舟作为顾网网心感知为红线；她仍试图通过通讯器给顾夜舟传“别回头”，避免他在十分钟控制态里失控。
  第56章后，她在老公寓围剿中与顾夜舟重新接上线，借顾夜舟远程控水稳定水刃，也亲口告诉顾夜舟这次旧部自己也能往前走，不让他一个人扛。
  第57章后，她觉醒回流约三成，在顾夜舟稳住水线的辅助下用水刃完成反击，并参与击退训练场成员；她对沈清辞亲吻顾夜舟并把旧部带回沈宅的安排极其喜闻乐见。
  第58章后，她进入沈宅医疗室处理伤口，开始体验沈宅富家生活，对姜汤、沈宅安全网和清舟亲吻后续保持高度兴趣。
emotional_state: 刚苏醒并找到当前线顾夜舟时会震惊、欣慰又想笑：上一条线的阴郁疯批领袖现在还是穿校服的高中生，身边还有终于能牵手的沈清辞。她会本能忠诚，也会在安全缝隙里得寸进尺地磕“清舟”。
relationships:
- target: 顾夜舟
  type: 旧部领袖
  description: 上一条线被顾夜舟救过，愿意为他和回线计划付出代价。
  knowledge: 记得上一条线的顾夜舟比当前线更危险、更沉默，也知道他为了沈清辞能把整个世界拖进计算里。
- target: 沈清辞
  type: 领袖软肋/未来保护对象
  description: 上一条线里沈清辞很晚才肯让顾夜舟靠近，因此旧部对当前线的两人亲密进展会非常震惊和欣慰。
  knowledge: 知道沈清辞是认门人线索的核心，也知道她活着是顾夜舟全部计划的中心。
- target: 顾澜
  type: 回线送达者
  description: 顾澜通过时空机器把她送到当前线，可能造成定位偏差和能力削弱。
  knowledge: 知道顾澜机器与反派法器不同，但同样违反世界规则，会造成代价。
current_goals:
- 找到当前线顾夜舟
- 确认沈清辞是否仍在顾夜舟身边
- 在不暴露太多旧线资料的前提下，给顾夜舟递交旧部苏醒和敌方回线的第一批警报
- 尽量适应异能被削弱后的当前线身体状态
- 作为顾夜舟网里的契约者，协助他识别当前线已出现的沈网契约者
- 协调第一批旧部弱状态苏醒后的落脚、联络和安全问题
- 整理旧港地下三层、地下城样本流转和心理筛查相关旧线信息，等顾夜舟放学回来汇报
- 把双二十四岁终局记录纳入旧部汇报，并控制汇报时机，避免刺激当前线少年顾夜舟失控
- 继续替旧港和旧部筛选能发给顾夜舟的信息，只传足以改变危险、不会提前引爆的短提示
- 等待顾夜舟放学后再汇报旧港看到的路线图和终局记录风险
- 准备放学后旧部汇报，协助旧港筛选可以告诉顾夜舟和沈清辞的信息
location: 沈宅一楼医疗室
core_triangle:
  desire: 追上顾夜舟，延续上一条线未完成的保护与回线计划
  ability: 完整旧线记忆、灵活身手、旧部经验、被削弱后的水系/感知类异能残余
  obstacle: 当前线世界规则削弱她的异能，定位偏差让她晚到，顾夜舟当前还没恢复上一条线的领袖气场
motivation_type: mission
growth_stage: adapting
backstory: 上一条线里，她曾是地下异能者黑市或样本链的幸存者之一，被关在旧港地下三层水箱拍卖场里供人观赏、下注和研究，后来被顾夜舟砸开水箱救下。她第一个签下顾夜舟的共生协议，成为顾夜舟网里的契约者之一。顾夜舟并不爱表达，却给了她和其他人第二次活着的机会；她也亲眼见过上一条线顾夜舟在医院外、便利店阴影里远远保护沈清辞，不靠近也不解释，只让人送文件、伞、热粥和安保名单。顾夜舟死后，顾澜启用时空机器，把部分自愿者带着原身送往当前时空线；青鲤是第一批苏醒并找到临川一中的人之一。她的登场应先带轻喜剧和警报双功能：一边吐槽少年版顾夜舟，一边证明旧部线正式苏醒。
first_appearance: 47
last_active: 58
is_pov: false

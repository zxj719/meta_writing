name: 李佳佳
aliases:
- 人形弹幕机
- 瓜田前线观察员
physical_description: 高三七班同学，看起来是普通高三女生，圆脸、眼睛亮、表情管理基本等于没有；紧张时会把资料袋攥出褶，害怕时嘴还比脑子先报点。后续描写重点写“普通外表下观察力过分在线”的反差，不要把她写成神秘大佬，先让读者觉得她是个站在门口也能看见关键细节的人。
personality_traits:
- 八卦
- 活泼
- 反应快
- 善于观察
- 信息传播能力强
- 关键时刻不掉链子
knowledge_state: 明面上只知道沈清辞和顾夜舟关系越来越微妙，也知道顾夜舟不像传闻里那么难相处。作者侧隐藏设定：成人礼前，她可以陆续撞见顾夜舟做好事不留名，例如第7章值日时扶住水桶和李佳佳、后续匿名帮同学处理麻烦、替人避开设备风险等；她不一定意识到这些事有多重要，却会把“顾夜舟也没那么可怕”的小道消息悄悄传出去，解释成人礼当天同学敢找顾夜舟签名和开玩笑的氛围。第41章里，她撞见沈清辞、顾夜舟和许知衡在空教室门口气氛异常，判断为“口供没对上”，再次站到关键现场边缘。第42章里，她用关于米饭和淀粉的离谱问题成功吸引老师注意，帮助顾夜舟藏起蓝色标签纸。第43章里，她主动用实验安全承诺书少页拖住老师，并跟到三楼楼梯口给男女主报点，继续承担“普通同学里的可靠掩护节点”功能。第44章后，她向沈清辞和顾夜舟坦白自己会“串台”：她不是完整重生人员，但拥有交错旧线碎片记忆，会偶尔想起不属于当前线的沈清辞、医院走廊、旧车票、被推走的安全通道或“去叫顾夜舟”一类短句；她还想起自己可能曾在许知衡引导下递过第二瓶水。第45章后，她进一步补出第二瓶水来自冷白灯下的自动贩卖机场景，不是校内售卖，瓶盖内侧带蓝色印痕；她也知道许知衡当时用“她现在只信你”把递水包装成可信请求，而自己还听见了沈清辞喝完后那句“我刚刚，是不是还有别的事要做”。第46章后，她亲眼看见自动贩卖机吐出带蓝色印痕的塑封纸和回收票据，虽然听不懂完整设定，但已经知道S-QC、本线、原线、认门、非回线体和回收优先级都属于下一步危险关键词。第47章后，她亲眼见到沈清辞散打反擒执行者、顾夜舟牵住沈清辞后致死攻击偏移、以及青鲤称呼顾夜舟“七哥”和沈清辞“嫂子”；她仍不懂完整规则，但已知道“牵手保命”和“旧部返校”非常不普通。第48章后，读者侧和男女主侧知道她是沈网契约者，曾在毁门时为沈清辞和顾夜舟挡过关键伤害，但当前线她本人仍未觉醒。第49章后，她用安全隐患记录帮众人骗过老师，并被青鲤提醒资料袋里的印太亮；她跟随男女主参加旧部第一顿饭，知道顾夜舟旧部已经苏醒，但仍不知道自己具体签过什么协议。第50章后，她知道清舟已经私下正式转正；她也坦白父母长期在外地照顾身体不好的弟弟，自己独自在学校附近租房读书，因此接受沈清辞邀请住进沈家临时保护。第51章后，她已经迅速适应沈家保护生活，并在百日誓师便利贴上写下“平安考完，正常发挥，别被数学暗杀”；她也听到苏晚宁病休广播，意识到“身体原因”像学校版此地无银。第52章后，她决定高考前都住在沈家；在扶住沈清辞时手心发烫，并初步表现出低阶治愈/稳定能力，但本人仍以普通女高方式理解为“小笼包吃多了气血旺”。第53章后，她在心理咨询室里低功率发动治愈/稳定倾向，短暂缓解沈清辞被筛查标记刺激后的不适，也意识到自己的能力会被陆闻川这种人盯上；她仍以普通女高的方式包装紧张，靠吐槽和数学卷子给局面降温。第54章后，她认出秦越与沈家有关，意识到沈家保护体系可能比富家女普通安保夸张很多；灰蓝污染进入现场时，她再次出现掌心发热和不适反应，说明自己的稳定/治愈倾向会被外部污染牵动。
  第55章后，她知道自己在污染场里继续稳定沈清辞也可能成为敌方诱导项之一，因此不能把初醒能力当成无限续航；她亲眼看见顾夜舟控制权跃迁和秦越战斗，也知道老公寓旧部正在被围剿。她本人尚未察觉，温逃离时有一粒灰蓝毒粉落到她袖口内侧，在腕骨附近留下浅得几乎看不见的小点。
  第56章后，她跟随秦越车辆离开医务楼，亲眼见到顾夜舟远程救援旧部和控制能力升级；她袖口内侧的灰蓝毒点仍未被发现，本人只当作心理咨询室里被什么蹭了一下。
  第57章后，她跟随众人转移去沈宅，尚未意识到袖口内侧灰蓝毒点会在她下一次主动安抚或治疗别人时深入。温侧已确认这条毒走器官污染路径，与陆星禾当年的污染衰竭相似。
  第58章后，她进入沈宅保护圈，并作为富家体验卡解说员协助旧部适应姜汤、按摩椅和智能花洒；她袖口灰蓝残留检测只显示极淡蓝格，系统无报警，沈清辞仍要求她暂时不要主动使用稳定/治愈能力。
emotional_state: 对男女主地下恋充满看热闹的快乐，嘴上像个瓜田住户，行动上经常正好站在关键位置。她目前没有明确阵营宣言，但在校园生活层面已经天然偏向沈清辞和顾夜舟。第43章后，她已经能在危机里主动补位，虽然仍用“非法哨兵”“脆皮辅助”包装自己的害怕。更深层动机来自沈清辞曾在本线和交错旧线里给过她很多温暖：顺手解围、递外套、替她挡难堪、把她从危险走廊推走；沈清辞自己未必意识到这些事在李佳佳心里有多重。第44章后，她开始害怕自己也曾被利用伤害沈清辞，但仍选择把自己知道的碎片交出来。第45章里，她第一次被“自己可能站在过两个人羁绊源头旁边”这件事击中，愧疚更重了，但也更清楚自己接下来不能再只当看热闹的吃瓜群众。第53章后，她对自己被卷进世界危机的认知更清楚，但仍保留“先吐槽再害怕”的生活感；她愿意继续站在沈清辞和顾夜舟身边，只是对心理咨询室、数学卷子和反派流程都保持朴素恐惧。
relationships:
- target: 沈清辞
  type: 同班好友
  description: 经常承担吐槽、打岔、递瓜和缓冲紧张气氛的功能，但不能只写成搞笑工具人。
  knowledge: 知道沈清辞变得比以前更锋利、更会护人，也看见她和顾夜舟之间越来越不普通；她对沈清辞的信任来自一些沈清辞不记得的小事，以及偶尔闪回的交错旧线温暖。
- target: 顾夜舟
  type: 同班观察对象
  description: 一开始怕他、八卦他，后来因为亲眼见过他几次不留名的好事，慢慢把班级舆论往“不好接近但不是坏人”的方向带。
  knowledge: 知道顾夜舟并非传闻里那种纯粹危险人物；后续毕业聚会或同学聚会时，她可以把这些旧事说出来，让顾夜舟第一次知道自己早就被同学重新看见。
- target: 许知衡
  type: 短暂被影响对象
  description: 第40章分组讨论里短暂被许知衡的话术带得认真，适合用来展示许知衡信任诱导对普通同学的轻度影响。
  knowledge: 目前只觉得许知衡说话很会包装，尚未意识到那种“觉得他说得对”的放松感可能不自然。
current_goals:
- 在高三日常里活下去，顺便吃瓜
- 帮沈清辞守住一些普通校园生活的快乐和烟火气
- 后续可逐步从八卦位升级为校园信息节点
- 作为毕业聚会回收点，揭开顾夜舟成人礼前做好事不留名却被她传播出去的旧线
- 在不明白全部异常设定的情况下，继续用普通学生身份给男女主打掩护和报点
- 暂时隐藏自己交错上辈子记忆的异常，只在被逼到关键节点时透露一点点
- 弄清自己记忆里“第二瓶水”的来源，以及自己是否曾被许知衡利用
- 弄清冷白贩卖机场景对应哪条旧线，以及自己为什么会被许知衡选中递水
- 继续作为普通学生观察者，把自己听不懂但很危险的关键词记下来
- 暂时不知道自己是沈网契约者，继续以普通吃瓜同学视角参与现场
- 在不知道自己契约者身份的情况下，被动进入旧部保护视野
- 暂时住进沈家，体验富家女生活，同时避免独居时被许知衡或回收线盯上
- 在百日冲刺阶段继续以普通同学身份观察心理摸排、苏晚宁病休和清舟CP楼动向
- 高考前与沈清辞同住沈家，并在学校里隐藏自己初醒能力
- 控制刚初醒的治愈/稳定能力，不在陆闻川面前过度暴露
- 继续以普通同学身份给沈清辞补位，必要时用吐槽打断过高压的审讯节奏
- 继续用吐槽给沈清辞和顾夜舟争取反应时间
- 在不透支能力的情况下帮助沈清辞稳住污染影响
- 控制稳定能力使用时长，避免在污染或陆闻川面前自愿留下
- 放学后跟着沈清辞一起去安全地点，继续避免落单
- 留意袖口内侧那枚几乎看不见的灰蓝小点（本人暂未意识到其危险）
location: 沈宅一楼医疗室/休息区
core_triangle:
  desire: 想在高三压力里抓住有趣的人和事，也想保护自己认定的朋友
  ability: 信息敏感、传播速度快、观察细节、用玩笑降低冲突浓度，以及刚初醒的低阶治愈/稳定倾向
  obstacle: 她看起来太像普通八卦同学，前期很容易被读者和角色低估；同时她还没有明确意识到自己站在异常事件边缘，能力初醒也很弱
motivation_type: curiosity
growth_stage: adapting
backstory: 从第2章开始就在班级舆论里出现，早期负责八卦和吐槽。后续规划里，她不是单纯弹幕机，而是悄无声息站在男女主身边的校园信息节点；她曾在成人礼前看见顾夜舟多次做好事不留名，并把这些事以聊天、玩笑、小道消息的方式传给同学，让班里对顾夜舟的恐惧慢慢松动。第44章前新增底层设定：她不是重生人员，拿不到完整前世剧情，只会间歇性串到交错旧线的碎片；这些碎片里沈清辞曾多次给她温暖或把她推出危险，所以她现在天然站沈清辞。第45章后，这条线进一步落地：她不只是“可能递过第二瓶水”，还记得递水场景、蓝色印痕和许知衡的话术，并在章尾意识到自己可能站在过男女主更早的羁绊入口前。第50章补充现实背景：她父母长期在外地医院照顾身体不好的弟弟，她一个人租在学校附近读书，这让她看起来很普通，也解释她为什么能迅速接受沈家的临时保护。她的最终定位暂不急着明牌，可以向“普通人阵营里的关键见证者”“交错记忆观察者”或“后期信息整合角色”发展。
first_appearance: 2
last_active: 58
is_pov: false

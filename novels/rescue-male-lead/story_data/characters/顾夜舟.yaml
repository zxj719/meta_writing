name: 顾夜舟
aliases: []
physical_description: 瘦高，眼皮压光，瞳色深，安静时像雨后黑玻璃，情绪沉下去时下睫毛会在眼下投出很窄的影子；唇线薄而紧，嘴角经常压着不耐，偶尔一点笑意只动半寸。皮肤偏冷白，骨相利落，但后续不要总写“脸部线条/冷”，可多写他的眼睫压住灯光、虎口旧伤突然抽疼、指节捏紧纸页、嘴角把情绪按回去、低头喝牛奶时凶相短暂失效，以及看沈清辞时停顿半拍的少年感。
personality_traits:
- 寡言
- 警惕
- 偏执
- 隐忍
- 攻击性强
knowledge_state: 已确认自己是07号、顾启明和陆闻川都盯着的钥匙，也知道镜面载体、真正的苏晚宁、沈清辞的识伪能力和成人礼节点已经并进同一条线。到第37章末，他听见第三方提到母亲真名顾澜、车祸当晚的转移链、陆闻川查不到、顾启明只知道尸骨无存；他也知道沈清辞回来这件事可能属于“回线”机制，她是S-QC锚点，自己是保护对象07。第39章后，他进一步察觉沈清辞会在许知衡相关节点突然头痛、停顿并像听见什么；他也亲眼看见安排表背面的07浅痕。第40章后，他通过双向记忆回流看见上一世南门器材室雨夜，知道自己曾撬门救下沈清辞，而这段记忆后来被许知衡的身影覆盖。第41章后，他确认许知衡对自己化学竞赛履历了解过细，也识破实验楼路线图里碘液显色纸痕迹和三楼旧试剂准备室路线异常；他还发现许知衡递来的水瓶有蓝色压痕。第42章后，他从二楼垃圾桶拿到带“控”字边缘的蓝色标签纸，并因虎口疼痛和锁芯声触发碎片，听见“她会忘掉你”；他进一步怀疑沈清辞经历过另一个结局。第43章后，他通过门后无灰、水槽湿痕和蓝色残留确认旧试剂准备室近期被使用，并拿到写有S-QC、水样二次投放和“别让她喝第二瓶”的防水标签，把许知衡递来的水瓶与沈清辞遗忘风险连上。第44章后，他确认李佳佳虽有交错旧线碎片，但行为上有清晰边界感和低危险倾向；他也知道李佳佳可能曾在上一条线里被许知衡利用，递出第二瓶水。第45章后，他进一步确认第二瓶水并非校内售卖、喝完后会诱发沈清辞的记忆缺口反应；与此同时，他也通过共同闪回摸到自己更早的样本出逃记忆，知道沈清辞在校园公开事件之前就曾见过自己，而顾澜曾被人拖出来当作逼自己回去的重要筹码。第46章后，他通过蓝色塑封纸确认许知衡不是回线体，而是被投喂校准的执行位；他还闪回到上一条线后期，听见“门没坏完”“沈清辞留下信号”“把她找回来”等碎片，并看见自己曾安排旧部留守和回节点分工。第47章后，他确认与沈清辞身体接触时致死攻击会异常偏移，也见到第一名苏醒旧部青鲤；青鲤带来顾澜机器、旧部带原身跨线、异能被削弱、反派法器跨线且有人早到的警报。第48章后，他通过青鲤契约者标记完整想起自己救下青鲤、建立顾网、看见沈清辞建立沈网、李佳佳毁门挡灾和沈清辞给自己下单方协议的过程。第49章后，他知道系统是沈清辞的单人异常辅助线，会给她任务、提示和技能，但自己只能通过她写下和转述的信息确认；他也知道单方协议已开始让沈清辞共享自己的疼痛和心动。第50章后，他和沈清辞私下正式确认恋爱关系，清楚自己的心跳会通过共感影响她；他还把青鲤、荒川、钟塔和旧港带回自己从顾启明手里抢回的顾澜婚前老公寓临时安置。第51章后，他要求旧部在自己上学期间适应身体并整理旧线情报；百日誓师上，他写下“京州大学，化学”，也看到沈清辞目标为“京州大学，金融”；广播宣布苏晚宁病休后，他判断陆闻川将亲自接管镜面线和心理摸排流程。第52章后，他通过共感察觉沈清辞被心理问卷筛查标记触发不适，也知道李佳佳出现低阶治愈/稳定初醒；陆闻川已经把他、沈清辞和李佳佳一起点名进下午心理访谈。作者侧方向：他会逐步猜到沈清辞不是普通预知或情报源，而是经历过另一个结局；这个猜测要靠她的失态、预判和共同闪回累积，不要一步到位。第53章后，他亲眼见到沈清辞用便利贴同步系统提示，知道系统继续以沈清辞单人辅助线存在；在心理咨询室里，他确认陆闻川试图把三人拆成一对一访谈，也看见许知衡远程改写校际心理支持系统、把个体访谈临时改成团体访谈。章尾他收到青鲤转来的“访谈别分开”，同时看见咨询室侧门即将开启。第54章后，他见到秦越以校安协查身份介入并挡住陆闻川，判断沈父和沈家保卫体系知道的东西比表面更多；他也看见陆闻川手机上“温”的消息尾字和灰蓝污染反应，意识到陆闻川已经引入校外毒系外援。
emotional_state: 顾澜可能未死的线索让他几乎冲出去追问，但这次他被沈清辞拦住后选择忍住，接受她“我陪你查”的承诺。第39章后，他对许知衡产生明确警惕，也把沈清辞在报告厅里的身体反应纳入保护范围；他仍没有逼问系统类秘密，只把位置站在她身后半步。第40章的梦境把上一世感情源头拉回眼前：沈清辞曾在他最像怪物的时候把他当人看，所以他后来救她、护她都不是做慈善，而是从那一刻起有了偏心。作者侧新增方向：这份偏心还可以继续往更早处追，在他作为实验样本第一次出逃时就埋下种子。第41章里，他暂时没有正面爆发，而是用冷淡嘴仗和化学硬实力挡住许知衡，开始学会在当前阶段用自己能控制的方式保护沈清辞。第42章里，他没有逼问沈清辞，却用“以后先看我，确认我还在”给她现实锚点，保护欲从挡风险推进到陪她对抗遗忘。第43章里，他把“看我”变成沈清辞进入危险房间前的现实锚点，并第一次拿到明确指向她曾忘记自己的物证，保护欲被推向更具体的“阻止第二瓶水”。第44章里，他没有把李佳佳推远，因为他看见她不越界、不碰证据、愿意把自己也拖进谎里保护沈清辞；但“她可能递过水”让他的保护欲重新绷紧。第45章里，他一边顺手先替沈清辞试水，一边又被更早的窄巷记忆反刺回来，第一次明确摸到“沈清辞是自己最早的那份善意”这条源头；这让他的保护欲从防风险，更进一步变成了不想再把她弄丢第二次。
relationships:
- target: 沈清辞
  type: 地下恋女友
  description: 第50章私下正式确认关系，沈清辞把他从预备役男友转为正式男友；明面上仍不公开，私下会牵手、互相管睡觉、用共感心跳制造甜梗和尴尬。第37章后，他开始知道她不是单纯重生，而是被称为S-QC的回线锚点。作者侧长线：无论哪个时空，他都很难拒绝沈清辞，因为她是世界给他的第一份善意。
  knowledge: 知道她嘴硬、会逗人、会硬撑，也知道她在最关键的时候能用很生活化的方式把他从失控边缘拉回来；第37章后，他知道她看过一个很烂的结局，并且最先回来找的是自己。后续闪回应逐步补出：在公开校园事件之前，更年少的沈清辞就可能在他作为样本出逃时给过第一次不带条件的帮助。
- target: 乔知夏
  type: 新异常点
  description: 低存在感的摄影社女生，却在舞台和正式场里接连帮他避开了问题站位。
  knowledge: 知道她对追光、异响和外场异常都有过早反应；第37章后，他也知道第三方调查者注意到乔知夏撤得很快。
- target: 陈渡
  type: 同类警惕
  description: 漏网幸存样本之一，彼此都知道对方不是普通学生，但还没走到真正交底。
  knowledge: 知道陈渡已经不只盯着后台，也开始盯校门外那些不属于学校系统的人；第37章后，他知道第三方调查者确认陈渡没有露正脸。
- target: 陆闻川
  type: 明线施压者
  description: 以心理协助和流程安排的名义，一点点把他推回实验和筛查的正中央。
  knowledge: 知道陆闻川现在已经不满足于盯自己，也开始顺着自己身边的人一层层排查；第37章后，他确认母亲顾澜的转移链曾瞒过陆闻川。
- target: 顾澜
  type: 母亲
  description: 外界记录里车祸尸骨无存，但第37章后浮出“被转移且未进入陆闻川系统”的可能。
  knowledge: 知道她当年参与过旧礼堂设备流程，留下过“别让他站到光里”的提示，也知道她的死亡结论可能被人刻意维持。
- target: 许知衡
  type: 潜在情感对照
  description: 第39章正式见面，外表体面明亮，笑意和发言节奏很容易让周围人放松。
  knowledge: 知道沈清辞对他反应异常，也看见他递来的安排表背面出现07浅痕。第40章后，他意识到许知衡至少碰过南门器材室这段记忆，甚至可能把原本属于自己的救人位置替换成了许知衡。第41章后，他进一步确认许知衡对自己化学竞赛履历打听得过细，还试图借化学楼参观路线把自己带向封闭旧试剂准备室。第43章后，他确认许知衡对旧试剂准备室水槽异常熟悉，并在防水标签被取出后明确阻止。
- target: 李佳佳
  type: 同班观察者
  description: 起初像八卦位和人形弹幕机，实际长期站在男女主附近，后续可发展成很会收集、传播和整理信息的关键配角。
  knowledge: 顾夜舟目前不知道李佳佳曾在成人礼前陆续看见他做好事不留名，并把这些事当成“顾夜舟也没那么难相处”的小道消息传给同学。第44章后，他知道李佳佳有交错旧线碎片，也知道她可能曾被许知衡利用递过第二瓶水；但他同时确认她当前线没有恶意，且边界感很强。
- target: 青鲤
  type: 旧部
  description: 上一条线被他救下并追随他的旧部之一，第47章作为第一名苏醒旧部找到当前线顾夜舟。
  knowledge: 知道青鲤保留旧线记忆，能力被当前线削弱，并通过顾澜机器带着原身来到这里；也知道她明显对当前线“少年版顾夜舟牵着沈清辞”这件事过分兴奋。
current_goals:
- 继续稳住07号共振，别让陆闻川把自己拖回实验节奏
- 把真正的苏晚宁和镜面线源头找出来
- 盯住“周启”“宋雾”和校门外那条外场暗线，搞清楚第三方到底站哪边
- 查清B-17里原本放着什么，以及母亲顾澜当年为什么留下旧工作牌和“别让他站到光里”的线索
- 和沈清辞一起查清回线锚点、07保护对象和顾澜转移链
- 在不逼问系统来源的前提下，确认沈清辞的异常提示如何影响现实危险
- 查清许知衡为什么接近沈清辞，以及他为什么能接触到07编号
- 查清南门器材室雨夜记忆为什么会被改写，以及许知衡如何拿走“开门者”的位置
- 护住沈清辞，也护住开始露头的边缘样本
- 继续保留化学竞赛这条能力锚点，后续遇到实验、试剂、旧案化学痕迹时可以让他以硬实力破局
- 保管许知衡递来的可疑水瓶，查清瓶底蓝色压痕与顾母旧线、B-17蓝色圆戳是否同源
- 逐步拼出沈清辞回线/重生真相，但在证据足够前先观察、保护和陪她找回缺失记忆
- 查清二楼蓝色“控”字标签、三楼门锁异常和监控黑屏之间的联系
- 查清防水标签上“水样二次投放”和“别让她喝第二瓶”所指的具体水样
- 查清李佳佳交错旧线里的第二瓶水是否来自许知衡，以及她为什么会被选中递水
- 查清样本07第一次出逃发生在哪个时间点，以及顾澜当年为什么会被拖出来当筹码
- 查清本线S-QC为何被标记为最高回收对象，以及“带回原线”对应哪个旧时空或门相关场域
- 面对开始苏醒并找来的旧部时，尽量在当前高中身份和上一条线领袖身份之间稳住局面
- 弄清契约者双网、李佳佳沈网标记和自己灵魂上的单方协议烙印
- 在知道系统存在后，和沈清辞约定危险提示同步，但不把系统变成可依赖的共同外挂
- 弄清单向共感会如何影响沈清辞，避免自己的旧痛和失控情绪继续伤到她
- 管好自己夜间心跳，避免通过共感继续影响沈清辞睡眠
- 安置青鲤、荒川、钟塔和旧港，暂时把老公寓作为旧部临时基地
- 放学后听取青鲤等旧部关于地下城、样本流转和心理筛查旧线情报的汇报
- 应对下午医务楼心理访谈，同时保护沈清辞和李佳佳不被陆闻川单独切开
- 在心理咨询室里守住三人队形，优先阻止陆闻川单独切开沈清辞或李佳佳
- 处理侧门未知变量，同时判断许知衡这次背刺陆闻川究竟是临时自保还是可利用裂缝
- 守住沈清辞和李佳佳，避免三人在污染和转场要求下被分开
- 观察秦越和沈家保护组，判断他们能否暂时借力但不能完全依赖
location: 临川一中医务楼心理咨询室
core_triangle:
  desire: 不再被旧案和失控定义，护住沈清辞；如果她要活着就必须救这个倒霉世界，他也会把世界一起救下来
  ability: 07号共振、极强的忍耐力、对伪装和频率异常的敏锐感知、化学竞赛级别的学科天赋，以及对顾澜旧线的情感驱动力
  obstacle: 原生家庭创伤后遗症、陆闻川持续刺激、校内外同时存在的筛查网络、母亲旧线突然重新浮上来，沈清辞的回线锚点身份也可能成为新的靶子；许知衡的体面外壳和疑似信任诱导能力会让危险很难当众拆穿
motivation_type: emotional
growth_stage: crisis
backstory: 长期遭受家庭虐待和校园排挤，体内潜藏危险力量，稍有刺激就可能失控。他不是成绩透明人，尤其化学极强，经常参加竞赛并拿过足够被外校优秀学生代表听说的奖项；这能支撑许知衡对他说“久仰”，也给后续实验、试剂、旧案化学痕迹留破局能力。更早的源头已经不只停在校园公开羞辱那次：第45章后，他确认自己曾在被当成实验样本时趁异能失控短暂出逃，浑身是伤、状态危险，在窄巷里先遇见了更年少的沈清辞。那时候沈清辞还不懂全部真相，却没有把他当怪物，还把校服外套借给了他；这才是世界给他的第一份善意，也是他后来再怎么长歪都无法彻底拒绝她的种子。随后他因母亲安全被威胁，不得不回去，而“把顾澜带下来”这句命令说明顾澜当时已被人掌握在手里。母亲顾澜在外界记录中为车祸尸骨无存，但第37章后开始埋出她并非普通受害者，可能被某些人救走并与更高层保护体系有关；顾夜舟目前只拿到转移链和“顾启明只知道尸骨无存”的线头。上一世后期，他已经变成外界口中阴郁危险、压迫感极强的“顾家疯子”，但仍曾在医院走廊递给沈清辞关键证据文件袋，说明他对她的保护长期存在且多以沉默行动完成。第40章补出的校园源头仍然有效：沈清辞曾在他被围观拍摄时说“他是人”，还把草莓牛奶和创可贴扔给他；后来他在雨夜救出被锁在南门器材室的她，这段救命记忆疑似被许知衡覆写。新增世界方向：顾启明倒台后没给他留下真正能用的东西，上一条线里顾夜舟能苟到最后、查到更深真相并布下回线，靠的是他自己从地下异能者黑市、样本链和观赏/试验场里救出的一批强者与幸存者；他给了这些人第二次活着的机会，所以他们后续愿意站在他这边。一部分人留在原时间线待命、善后和保存资料，另一部分人以自杀或极端代价回到当前关键节点，代价可能是记忆、身体或能力折损。第50章补充：他当前线拥有的顾澜婚前老公寓不是顾启明善意遗产，而是顾启明曾试图转入空壳公司脱手的房产；顾夜舟用非法转移资产、伪造监护费用、挪用顾澜遗产和录音材料逼顾启明签返还协议，硬抢回了这个落脚点。第46章后作者侧长线进一步明确：沈清辞死后，顾夜舟从顾澜/异控局线得到“门没坏完、沈清辞太虚弱、必须把她找回来”的消息；他安排旧部留守与回节点分工后，以死亡触发回线，真正先伸手回来找她的人是他。每次顾夜舟想起前世都必须有现实触发物和身体反应作为过渡，例如虎口疼、雨声错觉、实验气味、草莓牛奶甜味或门锁声。

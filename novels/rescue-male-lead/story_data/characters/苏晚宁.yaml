name: 苏晚宁
aliases:
- 镜面身份壳
- 当前载体为林雾
physical_description: 校园里公认的那张清纯白莲脸，妆发和神态都被训练得很标准；越是精致无辜，越让人怀疑这张脸本身就是给别人穿的。
personality_traits:
- 会演
- 易碎感强
- 身份不稳定
- 容易被操控
- 危险线索入口
knowledge_state: 这张脸背后已经不再能代表单一人格，而是被陆闻川和镜面线反复利用的校园公开身份；当前载体是林雾，真正的苏晚宁仍未正式现身。第51章后，“苏晚宁”对外以身体原因办理休学，公开校园壳体暂时下线，镜面线转入陆闻川亲自接管的百日冲刺心理支持/心理摸排流程。
emotional_state: 壳体本身已经处在随时可能裂开的阶段，越靠近顾夜舟和沈清辞，越难维持“正常学生”的稳定表象。
relationships:
- target: 沈清辞
  type: 危险入口
  description: 她前世和今生都从这张脸上吃过亏，但现在也正是顺着这张脸往更深处挖。
  knowledge: 这张身份在沈清辞面前已经快彻底失效。
- target: 顾夜舟
  type: 共振触发面
  description: 07号共振会直接撕扯镜面稳定度，这张脸在他面前最容易失真。
  knowledge: 顾夜舟越靠近，壳就越难稳住。
- target: 林雾
  type: 当前载体
  description: 目前在学校里穿着这张脸活动的人。
  knowledge: 林雾已经开始背着陆闻川递线索。
current_goals:
- 以身体原因休学为表层理由，从学校公开身份层暂时退场
- 别在陆闻川把镜面线转入心理摸排前暴露壳体问题
- 作为镜面线入口，尽可能多留下可追索的痕迹
location: 对外病休状态，真实位置未知
core_triangle:
  desire: 维持伪装与可替换性，继续作为镜面计划的通行证
  ability: 标准化的清纯面孔、可复制的人设、对校园关系网的天然渗透性
  obstacle: 顾夜舟的07号共振、沈清辞的识伪能力、林雾的动摇和真正的苏晚宁即将回场
motivation_type: survival
growth_stage: crisis
backstory: “苏晚宁”在当前故事阶段已经不能简单视作一个稳定的人，而是一张被镜面计划长期借用的校园身份壳。
first_appearance: 1
last_active: 51
is_pov: false

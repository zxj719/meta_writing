name: 旧港
aliases:
- 顾夜舟旧部
physical_description: 上一条线旧部之一，常抱着断耳通讯器，像随时在监听更深处的信号；第49章当前线刚苏醒，仍抱着断耳通讯器，屏幕时亮时灭，嗓音沙哑，能收到异常回音但状态不稳。
personality_traits:
- 谨慎
- 技术敏感
- 忠诚
- 抗压
knowledge_state: 第48章仅在顾夜舟契约回流记忆中出现，是顾夜舟共生协议网里的旧部之一。第49章正式在当前线苏醒并与顾夜舟见面，知道当前线顾夜舟还未恢复上一条线领袖状态，也确认沈清辞、李佳佳与青鲤都在场。第51章后，他在老公寓尝试恢复通讯器，捕捉到“门、S-QC、镜面、心理筛查”等模糊回音，说明陆闻川的新流程可能与旧线筛查重叠。第52章后，他触发旧港地下城记忆，确认自己的名字来自那座被顾夜舟砸开的地下城；通讯器还吐出终局记录残片：S-QC与07都死于二十四岁，间隔四十六小时内。第53章后，他确认自己的通讯器内容可能来自过去，也可能来自未来，是预知与回溯能力削弱后的外在表现；巅峰时期他能像看游戏剧情树一样看见一年以内多个选择通向的结果，但他也见过提前说破未来导致死亡人数扩大，所以现在不敢贸然开口，只能用换钥匙、延迟车辆、删短信、发短提示等方式偷偷介入。
  第55章后，他通过通讯器确认老公寓进入围剿分支，青鲤、荒川、钟塔和自己四个契约生命点全红；他把“老公寓分支：围剿中”和“07网心控制态倒计时09:59”转给顾夜舟，成为顾夜舟控制权十分钟窗口的直接触发点。
  第56章后，他继续通过断耳通讯器给旧部和顾夜舟提供分支提示，确认训练场围剿目标不是旧部死亡，而是逼07进入未知第四阶段。
  第57章后，他觉醒回流约三成，用断耳通讯器旧线回音反制敌方能力，并记录训练场撤退车牌；老公寓围剿已被击退，下一步转移沈宅。
  第58章后，他进入沈宅保护圈，通讯器显示沈宅路线暂稳，并开始把沈宅地毯、花洒等普通物件也纳入路线吐槽。
emotional_state: 刚苏醒后谨慎而虚弱，仍本能用通讯器尝试确认信号和坐标，旧线追随关系明确；第52章因名字来源和双二十四岁终局记录被击中，状态短暂下沉，但仍坚持要把信息交给顾夜舟。第53章后，他面对“双二十四岁”和心理咨询室路线图压力极大，仍选择不直接告诉顾夜舟终局数字，只通过青鲤发送“访谈别分开”，把风险压在自己沉默里。
relationships:
- target: 顾夜舟
  type: 旧部
  description: 上一条线签过顾夜舟共生协议。
  knowledge: 知道顾夜舟的回线计划和旧部留守安排。
current_goals:
- 适应当前线通讯信号偏移和身体坐标不稳
- 尝试恢复与旧部、旧线留守者或异常波动之间的联络能力
- 继续监听百日冲刺心理摸排相关异常回音，判断陆闻川流程是否对应旧线回收节点
- 把双二十四岁终局记录整理给顾夜舟，但避免在学校时间直接刺激他和沈清辞
- 继续用通讯器观察心理咨询室相关分支，但避免因提前透露终局记录触发更坏路线
- 在不破坏未来走向的前提下偷偷介入危险节点，给顾夜舟和沈清辞留下可改局的几分钟
- 在不触发黑线的前提下，向顾夜舟和沈清辞说明双二十四岁终局记录的一部分
- 判断老公寓围剿线是否对应训练场旧线分支，并尽量给顾夜舟留出可控的十分钟窗口
location: 沈宅一楼休息区
core_triangle:
  desire: 延续上一条线未完成的保护计划
  ability: 旧线通讯/定位经验和契约者标记
  obstacle: 当前线刚苏醒，跨线削弱导致通讯回音混乱、身体坐标不稳
motivation_type: mission
growth_stage: initial
backstory: 上一条线中，旧港是顾夜舟网里的契约者之一。“旧港”原本是一座地下城的名字，建在废弃港口下面，海水倒灌进最底层；他年少时被关在那里监听实验室、拍卖台和训练场信号，直到顾夜舟砸开旧港最底层，把断耳通讯器丢回他怀里。从那天起，他用“旧港”当自己的名字，为了记住那座地下城曾被砸开。第48章先作为旧部名单和会议室记忆出现，后续可再正式登场。
first_appearance: 48
last_active: 58
is_pov: false

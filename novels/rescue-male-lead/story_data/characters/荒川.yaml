name: 荒川
aliases:
- 顾夜舟旧部
physical_description: 上一条线旧部之一，靠墙站时存在感很强，身上有长期战斗留下的旧伤；第49章当前线刚苏醒，脸色过白，坐着也像一堵墙，但身体坐标不稳，拿水杯会把水洒半桌，力量控制差到能掰断筷子。
personality_traits:
- 沉默
- 忠诚
- 执行力强
- 旧线记忆待回流
knowledge_state: 第48章仅在顾夜舟契约回流记忆中出现，是顾夜舟共生协议网里的旧部之一。第49章正式在当前线苏醒并与顾夜舟见面，知道当前线顾夜舟还处于高中生阶段，也确认沈清辞仍在顾夜舟身边。第51章后，他按顾夜舟要求留在老公寓适应当前线身体坐标，力量控制仍不稳定，但已能开始配合整理旧线情报。第52章后，他力量控制略有进步，可以递水杯不捏裂，但仍会弄坏餐具；同时看到双二十四岁终局记录。
  第55章后，他与青鲤、钟塔、旧港在顾夜舟老公寓遭强者至上训练场其他成员围剿，契约生命点被顾夜舟感知为红线；当前线身体仍未完全适应，但高危刺激开始逼出旧部潜力。
  第56章后，他在老公寓围剿中受伤但逐渐找回身体坐标和力量控制，能接住顾夜舟远程控场后的近身反击，开始从虚弱复健转向实战恢复。
  第57章后，他觉醒回流约三成，虽然肩伤未止但能控制近身力量落点，参与击退训练场成员；后续将随顾夜舟和旧部一起转移去沈宅。
  第58章后，他进入沈宅医疗室处理肩伤，并因担心弄脏地毯、不会使用智能花洒等细节呈现旧部富家体验卡。
emotional_state: 刚苏醒后虚弱但忠诚，对少年版顾夜舟穿校服这件事有明显冲击，仍本能把他当上一条线的领袖。
relationships:
- target: 顾夜舟
  type: 旧部
  description: 上一条线签过顾夜舟共生协议。
  knowledge: 知道顾夜舟给旧部第二次活着的机会。
current_goals:
- 适应当前线身体坐标和被削弱后的力量控制
- 与青鲤、钟塔、旧港一起重新接入顾夜舟当前线保护计划
- 在不拖顾夜舟后腿前，先恢复基础协调并协助整理地下城与样本流转信息
- 继续练习力量控制，避免当前线身体恢复不足时进入战斗
location: 沈宅一楼医疗室
core_triangle:

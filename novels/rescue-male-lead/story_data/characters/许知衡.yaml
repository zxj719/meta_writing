name: 许知衡
aliases:
- 临川附中学生代表
- 前世关键偏差对象
- 沈父合作伙伴之子
physical_description: 帅且亮眼的那一挂，初登场的眼型锚点已经确立，后续不再高频重复。描写重点改放在笑唇、干净袖口、指节、说话尾音、停顿和过分贴合场合的表情；他看人时很少压迫，反而像给对方留足台阶。危险感不要写成阴森，要藏在“每一次反应都太合适、每一句话都刚好让人放松”里。
personality_traits:
- 体面
- 善于经营形象
- 克制
- 聪明
- 让人放松警惕
- 疑似魅惑型能力
knowledge_state: 第39章以临川附中优秀学生代表身份正式进入临川一中。读者侧知道他是沈清辞前世关键偏差对象，曾在上一世被摆成“可靠选择”的位置；他的亲和力、发言节奏和让报告厅安静下来的效果，已开始落到“魅惑/信任诱导”能力上。沈清辞读心术从他身上读到“她看我的眼神不对”，暗示他察觉当前线偏离旧轨。第40章里，他主动把话题引到“第一个开门的人”，精准刺激南门器材室记忆，说明他至少知道这枚记忆钉对沈清辞的信任结构很重要。他说“久仰”顾夜舟时，明面可以指向顾夜舟化学竞赛履历，暗面则压着07编号线。第41章里，他试图用“以前”和送水重启沈清辞对父辈合作关系的熟悉感，也把顾夜舟引向旧试剂准备室，但被顾夜舟识破路线图异常。第42章里，他在二楼显色实验时观察男女主碎片重叠反应，并疑似用滴管敲击回应三楼门锁异常。第43章里，他在三楼旧试剂准备室精准提醒沈清辞不要靠近水槽，并在顾夜舟取出防水标签后明确阻止，显示他知道水槽和水样标签的重要性。第44章里，他试图用老师到场和“避免误会”把众人带离三楼，却被李佳佳指出自己过早知道现场后果；李佳佳交错记忆显示他曾可能利用她递出第二瓶水。第45章补出的旧线细节进一步说明，他不只会偷走“救人的位置”，也会利用沈清辞信任的人递出关键物品，再把记忆缺口包装成普通头疼或疲惫。第50章后，他从陆闻川处获得少量旧线片段投喂，确认自己情感争夺窗口已关闭，后续目标从恋爱竞争转为继续执行回收任务。第51章后，他完成百日誓师优秀学生分享，与附中代表明面离开临川一中；同时收到“镜面壳体公开休学，后续接管人陆闻川”的提示。第52章后，他确认自己原线曾有策略席权限，当前线权限被冻结并受陆闻川作为信息投放者控制；他与陆闻川就镜面壳体撤离、李佳佳介入和心理摸排节奏产生分歧。作者侧方向已修正：他不是重生者，也不是完整回线人员；他对旧记忆、07和当前线偏离异常敏感，来自实验者投喂、旧线记录、门源力残留、信任诱导能力和当前线布局，而不是亲历上一条线。第53章后，他的旧线记忆完整度明显上升，并想起上一条线实验室曾把主意打到过自己的信任诱导能力上，试图把他从执行位变成研究样本；因此他对陆闻川和实验室体系没有真正忠诚。他远程改写校际心理支持系统，把陆闻川安排的一对一访谈改成团体支持，算是背刺陆闻川，也是在警告陆闻川不要把他当听话的刀。
emotional_state: 表面始终体面、温和、进退有度；内里已经察觉沈清辞看他的眼神不对，也注意到她身边站着顾夜舟。作者侧要求：他不能被写成纸片渣男，也不能靠让沈清辞显得愚蠢来成立；他应当是上一世信息差、情感利用、疑似能力、证据误导和关键记忆覆写共同包装出来的错误路径。第40章后，他的危险性从“让人放松”升级为“能碰到旧记忆的门”。第41章后，他首次在顾夜舟面前被化学专业常识拆掉一层体面，但仍然维持温和外壳。第42章后，他的温和外壳下开始露出更主动的操控痕迹。第43章后，他被顾夜舟拿走防水标签逼到轻微失控边缘，仍用温和语气维持外壳，危险感来自每个反应都太合适、阻止也太及时。第44章后，他第一次被李佳佳这种普通观察者打断节奏，说明他的控场并非无缝。第50章后，他意识到自己已经失去沈清辞身边的情感位置；上一条线演到后来可能有过一点真喜欢，但力量、任务和门相关布局压过感情。第52章后，他对陆闻川的信息压制明显不满，旧线更高权限被冻结后产生被降级的不适。作者侧新增方向：他的“小偷”身份不能只偷一次救命位，而应逐步显出系统性偷位的本质。第53章后，他对沈清辞的情感争夺已经失去窗口，但对被实验室利用的厌恶更强；他会咬陆闻川，不是因为站到主角阵营，而是因为他拒绝再次成为样本。
relationships:
- target: 沈清辞
  type: 前世错误关系
  description: 上一世曾被沈清辞信任，甚至可能在明面上帮过她、救过场，让她在有限信息下判断他可靠；当前线没有重生前，他也可以通过父辈合作关系与沈清辞有过交集。
  knowledge: 第39章读心碎片显示他察觉沈清辞看他的眼神不对；第40章后，他通过“开门者”话题触发沈清辞记忆，暗示他知道上一世自己被摆进了某个救命位置。第41章里，他发现沈清辞已经开始抗拒父辈合作带来的熟悉感，并当面划出边界。作者侧已修正：当前线不要写成他完整保留前世偏差；他知道得多，是因为有人给过他资料、位置和诱导话术。
- target: 顾夜舟
  type: 潜在对照对象
  description: 他与顾夜舟形成“体面可靠表象”和“阴郁危险表象”的对照；第39章两人第一次正面打照面。
  knowledge: 已知道顾夜舟在沈清辞身边，且安排表背面出现07浅痕，暗示许知衡线可能接触过07信息。对顾夜舟说“久仰”时，明面理由要有现实锚点：顾夜舟化学竞赛成绩足够出名；暗面理由则是07号和回线相关。第41章后，他知道顾夜舟不仅冷淡警惕，还能用化学竞赛级常识当场拆穿路线图问题。
current_goals:
- 以临川附中优秀学生代表身份进入临川一中
- 暂时维持体面、可靠、无害的外部形象
- 后续用于揭开沈清辞上一世如何在信息差中被误导
- 正式出场后减少单一眼型标签重复，改用笑意、语气、停顿、干净袖口、指节动作和旁人放松警惕的反应，让“魅惑”先以阅读体验出现，而不是直接喊技能名
- 在下午第三组讨论里继续试探沈清辞和顾夜舟的当前关系
- 围绕南门器材室、黑伞和开门者记忆继续施压，确认沈清辞记忆覆写层松动到什么程度
- 继续用父辈合作关系和优秀学生身份维持“家世相配、体面可靠”的外壳
- 借化学实验楼参观路线继续逼近三楼旧试剂准备室，但要重新评估顾夜舟的化学能力和警惕性
- 继续利用旧试剂准备室门锁异常试探男女主的共同记忆碎片和当前线反应
- 阻止顾夜舟带走与S-QC水样二次投放相关的防水标签，或尽快补救标签外泄
- 重新评估李佳佳这个看似普通的观察者，因为她已经能打断自己的流程话术
- 避免第二瓶水和“她现在只信你”这条旧线细节继续被男女主顺着翻出来
- 掩盖自己并非亲历旧线、而是被投喂旧线资料和门相关术语的事实
- 重新评估化学楼参观被安全隐患理由收尾后的损失，暂时不在老师面前强行夺回节奏
- 在情感争夺窗口关闭后，继续配合陆闻川执行针对沈清辞的回收任务
- 从临川一中明面代表位退场，等待陆闻川心理摸排线推进后再以回收执行位介入
- 争取摆脱当前线只接收投喂片段的被动位置，重新拿回对沈清辞回收路径的判断权
- 利用逐渐恢复的旧线记忆和信任诱导能力，重新夺回对回收路径的判断权
- 警告陆闻川别碰李佳佳和别把自己当工具，同时继续保留靠近沈清辞与07线索的机会
location: 附中空教室，远程接入校际心理支持系统
core_triangle:
  desire: 暂未明牌；表层目标是完成联校优秀学生分享
  ability: 成绩、形象管理、情绪克制、在成人与同龄人面前取得信任的能力，疑似魅惑/信任诱导型能力，以及把别人的善意或救命记忆包装成自己筹码的能力
  obstacle: 沈清辞当前线已经不再按上一世视角理解他，顾夜舟也会本能察觉她对他的异常反应；沈清辞读心术虽然不稳定，但已经能读到他的表层偏差
motivation_type: interest
growth_stage: initial
backstory: 上一世，他被摆在沈清辞面前，像一条看似正确的路。沈清辞当年信他并不是因为愚蠢，而是因为可见证据、家族合作关系、情感支撑、身边人的话、疑似信任诱导和关键记忆都被提前折向了同一个方向。第40章新增方向：他让沈清辞相信自己的重要契机，可能正是偷走或顶替了顾夜舟在南门器材室雨夜“开门救人”的位置。第45章进一步明确：他的“小偷身份”不能只停在这一处，而要随着沈清辞记忆闪回逐步露出“系统性偷走顾夜舟位置”的本质，例如偷更早的初见、偷可信证词、偷让沈清辞放下戒心的关键节点；李佳佳递第二瓶水这件事，正是他借别人可信位置完成偷位的一次侧证。当前线中，他通过联校优秀学生分享会名单首次浮出；在沈清辞重生前的当前时间线，他也不是凭空出现的陌生人，而是可通过沈父合作伙伴之子的身份与沈清辞发生过早期交集，只是尚未发展到上一世那种错误亲密。第50章进一步明确：他不是重生者，拿到的是陆闻川投喂的少量旧线片段；上一条线他可能演着演着有过一点真实喜欢，但这份感情没有大过力量和任务。后续不可揭示为重生者或完整回线人员；更准确的方向是：他是当前线原生的执行位、被喂过旧线资料的棋子、受门源力残留污染的诱导者，也是实验者用来重演错误信任路径的漂亮外壳。

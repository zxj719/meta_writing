name: 沈父
aliases:
- 沈清辞父亲
- 沈总
physical_description: 中年商人，外表温和体面，眼角有常年熬夜留下的细纹；对外是能在饭局里把话说得滴水不漏的人，对女儿却常常先看她手腕有没有磕碰、护具有没有戴好。
personality_traits:
- 疼爱女儿
- 谨慎
- 外圆内方
- 不擅长把危险说透
- 异控局高层
knowledge_state: 明面上是沈清辞父亲，曾与许知衡父辈有合作关系，也因此给许知衡靠近沈清辞提供过体面入口。作者侧修正：他对外伪装成只在局里外层接触的人，真实身份是异控局高层，未必掌握门、回线和07号的核心真相，但他知道世界并不完全安全，所以从小让沈清辞学散打和防身，真实动机是希望女儿遇到危险时能保护自己并拖到救援。第54章后，读者侧半隐晦确认他真实身份为异控局高层，能查看心理咨询室路线C、与顾澜半在线通讯并调动秦越；他知道07和S-QC相遇后命线已经缠住，也知道训练场外援提前到场。
  第58章后，他向沈清辞承认自己也是上条线过来的人，醒得比沈清辞早，并在沈清辞询问顾启明时知道两条线开始交汇。他上一条线记得女儿二十四岁身体指标下坠和顾夜舟站在病房外的样子，因此这一线只想让女儿健康、平安、普通地长大；面对女儿带顾夜舟和旧部回沈宅，他向顾澜单方面吐槽女婿和客房问题，只收到一个呲牙笑。
emotional_state: 对沈清辞是真心疼爱，哪怕身处信息差和外层利益网，也不应写成冷漠父亲或单纯工具人。后续可以通过护具、训练馆、旧车接送、给女儿买草莓牛奶或安排保镖失败等细节补他对沈清辞的保护欲。第54章后，他的父亲保护欲与组织高层克制同时露出：他不能直接冲进学校，只能用流程和保护组替女儿争取安全。
relationships:
- target: 沈清辞
  type: 父女
  description: 疼爱女儿，小时候让她学散打不是为了控制她，而是希望她在意外里有自保能力。
  knowledge: 知道女儿性格明艳护短，也知道她不喜欢被当作瓷娃娃；不掌握她当前的系统和认门人真相。
- target: 许知衡
  type: 合作伙伴之子
  description: 许知衡通过父辈合作关系进入沈家视野，这条体面关系曾被利用成沈清辞上一条线的信任锚点之一。
  knowledge: 只知道许知衡家世和履历体面，不知道其背后可能有实验者投喂和信任诱导。
current_goals:
- 保护沈清辞
- 维持沈家在外层局势里的安全位置
- 避免女儿被许知衡父辈合作关系牵进更危险的核心层
- 继续维持商业父亲外壳，不让沈清辞过早知道异控局全貌
- 通过秦越等保护组人员阻止陆闻川在校园流程内切开三人
- 与顾澜合作投放足够信息，但避免暴露顾澜半上线位置
location: 沈宅二楼书房
core_triangle:
  desire: 让沈清辞安全长大，最好远离自己也看不清的危险核心
  ability: 商业资源、外层信息、人脉、给女儿安排训练和保护的现实能力
  obstacle: 他必须维持外层伪装，不能直接把女儿推到异控局核心视野里；家族合作关系反而可能被敌人利用来接近沈清辞
motivation_type: emotional
growth_stage: triggered
backstory: 早期剧情里多以沈清辞家世和父辈合作关系存在。第47章前新增底层设定：他真心疼爱沈清辞，所以从小安排她练散打、防身和反应训练；他不一定知道门和回线，却本能知道女儿需要在危险里多撑几分钟。这一设定用于解释沈清辞前文遇到危险时的从容与身体反应，也用于去扁平化沈家父亲形象。第54章后作者侧修正：沈父并非只在局里外层，而是异控局高层；此前外层印象是他为了保护沈清辞和维持普通家庭外壳主动做出的遮掩。
first_appearance: 14
last_active: 54
is_pov: false

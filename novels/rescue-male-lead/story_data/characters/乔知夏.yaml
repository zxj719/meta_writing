name: 乔知夏
aliases:
- 摄影社女生
- 广播站值班生
physical_description: 身形瘦高，皮肤偏白，五官清淡，站在人堆里很容易被忽略；校服外常套摄影社或广播站外套，脖子上挂着老款拍立得或单反，左耳总留着半只耳机或隔音耳罩，像是在压住别人听不见的杂音。
personality_traits:
- 安静
- 反应快
- 低存在感
- 观察细
- 说话轻
knowledge_state: 已明确感知到礼堂追光、音箱和某些高频异响会在顾夜舟靠近舞台正中、或誓词节奏进入特定段落时提前失真。到第34章末，她进一步确认异常不只来自礼堂内部，校门外也有与正式场呼应的补位监测；同时她知道陆闻川已经开始打听她和陈渡的名字。
emotional_state: 她还是紧张，也还是本能想把自己埋在人群和器材后面，但现在已经会在必要的时候直接出手了。越是这样，她越清楚自己离“被看到”只差一步，所以短期内只会更谨慎，不会主动往台前站。
relationships:
- target: 沈清辞
  type: 初步信任对象
  description: 从试光、合照到正式场提醒，她已经开始默认沈清辞是自己能递信息的人。
  knowledge: 知道沈清辞看得懂她那些轻描淡写的提醒，也知道她会护人。
- target: 顾夜舟
  type: 危险频段中心
  description: 舞台、设备和外场异常在他靠近被安排好的位置时会明显加重。
  knowledge: 说不清原理，但本能确认他最好别踩回那块被盯上的中心点。
- target: 陈渡
  type: 同线观察对象
  description: 两个低存在感的人在礼堂异常和正式场外线里都察觉到了彼此，但谁都还没有明着摊牌。
  knowledge: 知道陈渡也不是普通的后勤学生，而且他在暗处帮过一次手。
- target: 陆闻川
  type: 被观察者
  description: 她已经明显感觉到自己被这个人记住了。
  knowledge: 知道陆闻川表面温和，实际已经开始顺着摄影和广播线筛人。
current_goals:
- 继续维持低存在感，不让自己和陈渡太早暴露成重点目标
- 搞清楚追光、音箱和校门外补位监测之间的联系
- 必要时继续修正顾夜舟的危险站位，但不抢到台前去
location: 临川一中礼堂、控制台与校门内侧
core_triangle:
  desire: 以最不起眼的方式把该看的东西看完，把该记下来的异常都带出去
  ability: 对频段、噪点、设备异响有超出常人的敏锐感知，拍照时构图和捕捉时机极准
  obstacle: 她太习惯把异常当成自己的问题压下去，一旦被真正懂行的人盯上，就很难继续装普通
motivation_type: survival
growth_stage: adapting
backstory: 表面是学校摄影社和广播站的边缘成员，实际更接近一条第三方调查线埋在校园阶段的低存在感观察点。她并不打算在高中阶段主动亮身份，只想先把异常设备、外场监测和顾夜舟周围的响应链记清楚。
first_appearance: 32
last_active: 34
is_pov: false

name: 顾澜
aliases:
- 顾夜舟母亲
- 顾女士
physical_description: 目前只在旧工作牌与沈清辞短时共振里出现；白衬衫袖口挽到小臂，左手腕有淡疤，系挂绳会多绕一圈，气质干净利落，不像普通受害者。
personality_traits:
- 冷静
- 关键
- 隐忍
- 执行力强
- 保护欲强
knowledge_state: 第37章后，读者侧知道她可能没有死于车祸，而是存在未进入陆闻川系统的转移链；她当年知道主灯、站位和07号危险有关，并留下“别让他站到光里”的提示。第45章补出的更早闪回进一步说明，在顾夜舟作为样本07出逃时，曾有人说出“把顾澜带下来，他会自己回来”，证明她当时至少还活着，并且是能直接牵制顾夜舟的重要筹码。第46章里，顾夜舟旧线闪回中出现疑似顾澜/异控局线的女人，传递“门没坏完”“沈清辞太虚弱”“把她找回来”等信息，说明她后期不仅是被保护对象，也可能是掌握门与回线情报的核心人员。第47章青鲤证实，顾澜曾用类似时空穿越的机器把自愿旧部带着原身送到当前线，并留下“别松手”的口信。第54章后，她以带噪点通讯与沈父合作，提示训练场外援提前到场、命线互锁和自愿死亡风险；她暂时无法亲身下场，也不希望沈清辞看见自己的脸，以免引来陆闻川背后的更高层追踪。
emotional_state: 本人未正式出场，状态未知；现阶段只能通过旧物、旧记录和第三方谈话判断她曾主动保护顾夜舟，也可能为了让顾夜舟活下来而被迫长期缺席。第45章后，这条“长期缺席”背后又多了一层被人掌握、被拿来要挟07号的危险意味。第54章后，她仍处在无法亲手保护顾夜舟的克制里，只能把提醒压缩成最短指令交给沈父和秦越。
relationships:
- target: 顾夜舟
  type: 母子
  description: 外界以为她已在车祸中尸骨无存，实际可能被转移或保护起来。
  knowledge: 当年她已经知道07号和舞台光源、站位危险有关。
- target: 沈清辞
  type: 回线相关保护对象
  description: 尚未正面接触，但沈清辞通过旧物共振看见了她留下的旧场景。
  knowledge: 作者侧方向是她与沈清辞回线锚点存在间接关联。
- target: 陆闻川
  type: 隐藏对手
  description: 她的转移链没有进入陆闻川系统，说明她的保护线曾瞒过他。
  knowledge: 可能知道陆闻川体系的操作方式，并提前避开。
current_goals:
- 暂不现身
- 通过旧物、转移链和第三方痕迹把顾夜舟从旧案中心往外带
- 保护07号和回线锚点不被陆闻川提前回收
- 作为异控局核心线的隐藏入口，暂时只通过旧线闪回和术语残片给出方向
- 通过时空机器把自愿回溯的顾夜舟旧部带着原身送到当前线，但让这条安排先以旧部苏醒和碎片证词形式露出
- 维持半上线状态，避免暴露坐标
- 与沈父合作保护07和S-QC，不让陆闻川或训练场把他们分开
- 继续用短通讯投放关键节点信息，而非亲身下场
location: 半挂在上一条线/上线与当前线通讯锚点之间
core_triangle:
  desire: 保护顾夜舟，并让07号从旧案体系里活下来
  ability: 旧项目和设备流程知识、第三方保护线或异控局核心层资源、提前避开陆闻川系统的能力，以及上一条线后期研发/启用时空机器的能力
  obstacle: 被外界判定死亡、无法直接回到顾夜舟身边、陆闻川和顾启明仍在追索07号
motivation_type: mission
growth_stage: triggered
backstory: 外界记录为车祸尸骨无存，真实方向是被某些人救走或转移；高中阶段只能通过旧工作牌、B-17、蓝色圆戳、转移链和第三方话语慢慢露出。第45章后新增前史细节：在更早的样本出逃阶段，她就已经是能让顾夜舟被迫折返的关键牵制点，这说明她的失踪、转移和保护线都比目前显出的时间线更早、更复杂。第46章后作者侧方向更明确：她是异控局核心人员或核心线成员，上一条线后期向顾夜舟传递过门未完全损坏、沈清辞留下信号、需要找回认门人的关键信息；这条线后续仍要藏，不能让她过早正面出场。
first_appearance: 23
last_active: 54
is_pov: false

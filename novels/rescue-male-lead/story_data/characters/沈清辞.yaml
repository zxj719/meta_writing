  ability: 重生记忆、执行力、系统辅助、家庭资源
  obstacle: 顾夜舟极度戒备，苏晚宁暗中捣乱，系统任务离谱
motivation_type: mission
growth_stage: initial
backstory: 前世是恋爱脑富家女，被苏晚宁算计到家破人亡，临死前才知道顾夜舟一直在暗中护她。

  knowledge: 知道他会黑化，但不知道全部真相。
- target: 苏晚宁
  type: 宿敌
  description: 前世被害得很惨，这一世准备先手反击。
  knowledge: 知道她擅长装可怜、借刀杀人。
current_goals:
- 阻止9月7日暴走
- 接近顾夜舟建立信任
- 拆掉苏晚宁的局
location: 高三（七）班

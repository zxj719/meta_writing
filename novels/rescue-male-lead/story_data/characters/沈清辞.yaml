name: 沈清辞
aliases: []
physical_description: 富家千金长相，气质明艳，重生后说话更利落，眼神里多了压不住的锋利。
personality_traits:
- 嘴硬
- 护短
- 行动力强
- 记仇
- 吐槽欲旺盛
knowledge_state: 确认微感可以感知更深层的念头（犹豫、挣扎、想要又不敢要）而非表面想法；确认顾夜舟察觉到了她使用微感
emotional_state: 保护顾夜舟的决心进一步加强；对"回家再扔"的深意有所领悟；产生期待感；感到一丝庆幸（他没追问到底）；梦里那只手和现实中他的手形成对比，让她更坚定了改变命运的决心
relationships:
- target: 顾夜舟

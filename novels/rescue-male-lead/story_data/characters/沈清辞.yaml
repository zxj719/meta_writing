name: 沈清辞
aliases: []
physical_description: 浓颜系长相，眉眼明艳锋利，眼睛很亮，睫毛密，唇色天然偏鲜，笑起来有点攻击性；她挑眉时像把火星子弹出去，下巴一抬就像要把场子接管。校服压不住她的张扬，礼服会把她眼尾和唇边的锋芒整个推到光下。后续描写避免只重复“浓颜/明艳”，可多写她眼尾带光时如何压住害怕、嘴角一翘如何把局面抢回来、发丝扫过脸颊时别人短暂失神、指尖敲桌或拽人袖口时的护短动作。
personality_traits:
- 嘴硬
- 护短
- 行动力强
- 记仇
- 吐槽欲旺盛
knowledge_state: 已确认顾启明和陆闻川正在联手把青岚旧案往校园公开场域里搬，知道“苏晚宁”不是一个稳定的人，也知道自己逐渐觉醒的识伪与共振能力正被对方盯上。到第37章末，她从第三方谈话和蓝标压痕里得知“重生”并非单纯个人奇遇，而是被外部记录为“回线”的机制；她对应回线锚点S-QC，顾夜舟对应保护对象07，当前稳定度31%。第39章后，她知道系统存在暂时不能对顾夜舟公开，确认许知衡身上存在信任诱导/魅惑类异常，也知道许知衡线已经接触到07编号。第40章后，她进一步确认上一世南门器材室、黑伞、草莓牛奶和“开门者”记忆存在覆写痕迹；许知衡很可能顶替或偷走了顾夜舟曾救她的关键契机。第41章后，她确认当前线重生前自己与许知衡确有父辈合作饭局交集，这类体面关系曾被用作信任锚点；她也知道许知衡正试图借化学实验楼参观路线把顾夜舟引向三楼旧试剂准备室。第42章后，她通过旧试剂味、蓝色圆戳和碘液显色触发新的碎片，知道“选错门”可能会让自己少记得顾夜舟；系统显示双向碎片重叠，当前记忆稳定度升至34%。第43章后，她确认旧试剂准备室近期被使用，S-QC与水样二次投放、门锁触发后十分钟内回收有关；她还看见上一条线里顾夜舟阻止她喝水，当前记忆稳定度升至35%。第44章后，她知道李佳佳不是完整重生人员，而是有交错旧线碎片记忆；李佳佳站队自己源于自己曾无意识给过的温暖，同时李佳佳可能曾在许知衡引导下递过第二瓶水。第45章后，她进一步确认第二瓶水并非校内机器售卖、瓶盖内侧带蓝色印痕，且自己喝完后会出现“我是不是还有别的事要做”的记忆缺口反应；连廊贩卖机的冷白灯光还让她第一次看见更早的窄巷初见，意识到自己可能在顾夜舟作为样本07出逃时就见过他，而顾澜曾被拿来威胁顾夜舟回去。第46章后，她从蓝色塑封纸和黑门闪回里第一次接触“认门”概念，知道自己可能是认门人，门毁会让异能链路断裂；她还看见门源力用“救回顾夜舟”诱惑自己，章尾确认当前线的S-QC已经被标记为回收目标。第47章后，她确认有执行者能按S-QC在校内楼梯间定位自己，也第一次看见自己和顾夜舟身体接触时致死攻击会判定失败；她还通过实战重新意识到沈父当年安排散打训练的保护意义，并见到顾夜舟旧部青鲤。第48章后，她通过契约回流看见自己上一条线也建立过沈网、李佳佳曾签约并在毁门时替她挡灾，也看见自己最后给顾夜舟下过单方协议。第49章后，她首次使用短时记忆裁剪处理低阶执行者，主动向顾夜舟披露系统存在，并确认单方协议已经开始表现为顾夜舟到自己的疼痛与心动单向共感。第50章后，她私下确认顾夜舟为正式男友，并知道共感夜间仍会同步他的心跳；她也知道李佳佳父母长期在外照顾弟弟、本人独居不安全，已经把李佳佳带回沈家临时保护。第51章后，她在百日誓师便利贴上写下“京州大学，金融”，知道顾夜舟目标为“京州大学，化学”；她还从广播和系统提示确认“苏晚宁”公开壳体已以身体原因休学，镜面线执行层级上移，陆闻川很可能亲自接管百日冲刺心理摸排。第52章后，她确认陆闻川的心理问卷带低频筛查标记，并已把自己、顾夜舟和李佳佳同时列入访谈名单；她还知道李佳佳作为沈网契约者开始初步觉醒低阶治愈/稳定倾向，可以缓解自己被筛查标记触发的头痛和蜂鸣。第53章后，她知道许知衡远程改写校际心理支持系统，暂时把个体访谈改成团体访谈；也收到青鲤转来的“访谈别分开”提醒，章尾看见咨询室侧门即将开启。作者侧方向：她所谓重生更像平行时空/回线，代价是失去大量记忆并承受他人介入篡改；她记得的上一世远少于真正发生过的上一世。第54章后，她认出从侧门进入的秦越是沈家别墅里常见的“维修/安保”秦叔，开始怀疑沈家保卫人员并不只是普通保镖，而是更大保护体系的一部分；她也从系统碎片看到命线互锁已激活，知道敌方目标可能不是杀死她和顾夜舟，而是诱导自愿选择。
  第55章后，她确认灰蓝污染的危险不是外力致死，而是借转场、单独观察和自愿签署诱导三人作出分离选择；污染刺激下顾夜舟控制权跃迁，展现控物、控人和触碰能力链路控制三个阶段，系统提示十分钟控制态必须由她保持接触监护。她知道秦越是力量/速度型觉醒者且不是回线者，也听见顾澜承认旧部恢复慢和老公寓高危刺激是计划的一部分。章尾她得知老公寓遭强者至上成员围剿，四名旧部生命点全红，决定牵住顾夜舟监护他进入下一场。
  第56章后，她在秦越车上继续作为顾夜舟十分钟控制态的接触监护锚点，知道顾澜通过秦越转达“别恨太早”但暂不能直接解释；她也通过共感看见老公寓旧部围剿现场，确认顾夜舟可借顾网远程控物、控人和切断能力链路。章尾她知道训练场目标是逼顾夜舟进入未知第四阶段，并主动给他立下边界：到门口为止，救人可以，第四阶段不准碰。
  第57章后，她见证旧部三成觉醒完成反攻，也确认顾夜舟第一次十分钟高控结束后会出现虎口旧伤、记忆回流和网心疲劳。她决定把顾夜舟和旧部全员接回沈宅，并用吻让顾夜舟答应；下一步要和沈父严肃谈保护组、异控局、顾澜坐标和安置问题。
  第58章后，她在沈宅正式接管安置顾夜舟、李佳佳和旧部，并与沈父展开父女谈话。她确认沈父也是上条线过来的人，醒得比自己早，且在自己询问顾启明时就知道两条线开始交汇；她要求父亲不要再替自己单方面决定活着的方式。她也知道李佳佳袖口检测只有极淡蓝格且系统无报警，仍要求李佳佳暂时不要主动使用能力。
emotional_state: 她在顾夜舟被顾母旧线击中时，能先把人拽回安全处，再用生活化插科打诨把失控边缘压下去；第39章后，她对许知衡的警惕从前世情绪升级成当下危险判断。第40章的低频闪回让她意识到自己不是“看错人”这么简单，而是曾被摆错证据、改写记忆。第41章里，她开始把“恋爱脑”拆回家族关系、信任锚点和能力影响，不再把当年的错全归咎于自己；同时顾夜舟用化学能力当场反击许知衡，让她对当前少年的可靠感更稳。第42章里，她第一次听见“会少记得顾夜舟”的代价提示，恐惧被顾夜舟一句“确认我还在”压住，关系进入更深的互相确认阶段。第43章里，她在上楼前仍用“保命套餐”和嘴炮售后维持生活化状态，进入旧试剂室后被“第二瓶水”击中，开始意识到自己遗忘顾夜舟可能和水样投放直接相关。第44章里，她意识到自己顺手给过李佳佳的温暖在对方心里留下了很重的分量，也被“李佳佳可能递过第二瓶水”拉出新的刺痛和警惕。第45章里，她一边被顾夜舟先替自己试水这件事安抚到，一边又被“喝完第二瓶水后的空白感”正面刺中；更早的窄巷闪回让她第一次真切意识到，自己被抹掉的也许不只是一场雨夜，而是顾夜舟最早把她认出来的源头。
relationships:
- target: 顾夜舟
  type: 地下恋男友
  description: 第50章私下正式确认关系，顾夜舟从预备役男友转为正式男友；两人仍处在高中阶段克制地下恋，明面不官宣，私下会牵手、互相管睡觉、用共感心跳制造甜梗和尴尬。
  knowledge: 知道他的旧伤、父亲线、07号身份、顾母线和失控风险；第37章后，她知道他母亲顾澜可能被转移而非死亡，也知道自己作为S-QC锚点与07保护对象存在绑定关系；第38章后，她重新确认上一世后期顾夜舟曾用证据文件袋暗中护过她。作者侧新增方向：她可能还没记起更早那次样本出逃时的初见，那是被回线代价和外力篡改压住的羁绊种子。
- target: 乔知夏
  type: 新观察对象
  description: 从摄影社低存在感女生，变成了成人礼这条线里最关键的异常感知入口之一。
  knowledge: 知道她不仅能提前听见异响，还会主动用摄影和流程帮人挡风险；第37章后，她也确认第三方调查者知道乔知夏撤离很快，说明乔知夏已经被更高层视野注意到。
- target: 陈渡
  type: 试探性盟友
  description: 幸存样本线里最先露面的那个人，安静、谨慎，但已经在关键节点上主动递线。
  knowledge: 知道他对后台、校门口和陆闻川的布线方式都比普通学生熟；第37章后，她确认第三方调查者也知道陈渡没有露正脸，说明陈渡的隐藏动作仍在别人监控之内。
- target: 陆闻川
  type: 明线对手
  description: 把关心和流程包装得滴水不漏，却一直在把顾夜舟往被标记的位置上推。
  knowledge: 知道他现在不只是看顾夜舟，也开始沿着广播、摄影和后台线往旁边的人身上筛；第37章后，她知道陆闻川会查礼堂监控，但第三方已经提前处理过。
- target: 顾澜
  type: 隐藏关键人
  description: 顾夜舟母亲，外界认定车祸尸骨无存，但第37章埋出她可能被转移且未进入陆闻川系统。
  knowledge: 知道她当年留下过“别让他站到光里”的提示，也知道她的转移链至少瞒过陆闻川和顾启明两拨人。
- target: 许知衡
  type: 前世关键偏差对象
  description: 上一世被包装成可靠选择的人，第39章以联校优秀学生代表身份正式进入当前线。
  knowledge: 知道自己当年信错他并非因为愚蠢，而是因为可见证据、身边人和疑似异能影响都被摆向了同一条错路；当前已确认他存在信任诱导表现，且他对自己看他的眼神变化有所察觉。第40章后，她怀疑他曾用南门器材室事件替换顾夜舟的位置，把“救她的人”这枚信任钉子钉进上一世记忆里。第41章后，她明确当前线没有重生前，许知衡就已经以沈父合作伙伴之子的身份出现在饭局里，并用“你不用一直笑”这类刚好贴合情绪的话建立熟悉感。
- target: 沈父
  type: 父女
  description: 沈父虽只在局中外层，却真心疼爱沈清辞；散打训练是他给女儿留下的现实保护。
  knowledge: 第47章回忆确认，沈父从小让她学散打不是为了把她培养成工具，而是希望她遇到危险时能先跑，跑不了也能多撑几分钟。
current_goals:
- 查清真正的苏晚宁和镜面线源头
- 稳住自己的识伪、共振与回线锚点状态，别在关键时刻被外部机制拖走
- 顺着“周启”“宋雾”、乔知夏和陈渡这几条暗线，摸清第三方到底想做什么
- 查清B-17里原本放着什么，以及顾澜为什么会留下“别让他站到光里”的提示
- 弄清S-QC锚点、07保护对象和33%稳定度分别意味着什么
- 在系统已向顾夜舟披露后，继续避免向旧部、敌方和普通同学扩大暴露范围
- 面对已经进校的许知衡，完成和上一世错误路径的真正切割
- 查清许知衡为什么知道或能接触到07编号
- 追查南门器材室、黑伞、草莓牛奶和虎口伤这组记忆锚点，确认上一世被覆写的开门者到底如何被替换
- 重新审视自己所谓“恋爱脑”的成因，区分真实情绪、家族合作关系、许知衡信任诱导和记忆覆写分别起了什么作用
- 和顾夜舟一起查三楼旧试剂准备室、路线图碘液痕迹和许知衡递来的蓝痕水瓶
- 分辨哪些记忆属于真实上一世、哪些是回线代价造成的缺失、哪些被许知衡或更高层力量动过手
- 查清“选错门会少记得顾夜舟”这句碎片对应哪条时间线或哪次选择
- 查清“第二瓶水”具体是什么、上一条线里她是否曾因此忘记顾夜舟
- 查清李佳佳交错旧线记忆的来源，以及许知衡是否曾利用李佳佳递出第二瓶水
- 查清更早那条窄巷发生在什么时间点，以及顾澜为什么会被拖出来威胁顾夜舟回去
- 弄清“认门人”身份、门源力诱惑和本线S-QC被回收三者之间的关系
- 在不暴露系统和认门人身份的前提下，继续用散打防身能力处理低阶现实威胁
- 查清沈网契约者、李佳佳资料袋标记和自己曾给顾夜舟下过的单方协议
- 掌握短时记忆裁剪的边界和代价，避免能力失控或被敌方反向利用
- 和顾夜舟一起弄清系统、沈网、单方协议与单向共感之间的关系
- 在李佳佳被许知衡注意到后，把她暂时安置在沈家保护起来
- 适应自己和顾夜舟已经正式恋爱、且共感夜间仍在线的新状态
- 应对百日冲刺心理摸排，避免陆闻川借高三心理支持名义重新筛查自己、顾夜舟和李佳佳
- 保护李佳佳初醒能力不被陆闻川捕捉或过度使用
- 查清秦越、沈父和沈家保卫体系到底与异控局有什么关系
- 防止陆闻川借污染和转场把三人分开
- 继续安置顾夜舟、李佳佳和旧部进入沈宅保护圈
- 从沈父处拿到保护组、异控局、顾澜坐标和上条线回忆的更多信息
location: 沈宅二楼书房
core_triangle:
  desire: 救下顾夜舟，并把自己和他的结局一起改写
  ability: 重生记忆、执行力、系统辅助、家庭资源、从小练出的散打防身能力、逐渐觉醒的识伪共振，以及刚浮出水面的回线锚点/认门人身份
  obstacle: 陆闻川把局面抬进校园公开场域，真正的苏晚宁尚未现身，校内外两边的布局开始合流，顾澜旧线和第三方线同时浮出，自己作为S-QC锚点也可能被外部机制盯上；许知衡的信任诱导表现会干扰她的判断和读心术

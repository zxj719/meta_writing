growth_stage: crisis
backstory: 前世曾在信息差、证据误导、信任诱导类异能影响和疑似记忆覆写下选错许知衡这条路，最终被苏晚宁和更高层布局算计到家破人亡。所谓“恋爱脑”不能写成她天生愚蠢，而要写成白富美家族关系、合作伙伴之子的体面身份、被摆出来的救命证据、身边人的集体误导和许知衡能力共同作用的结果。上一世后期，阴郁危险的顾夜舟曾在医院走廊把装有苏晚宁转账记录、沈家项目调包时间表和“别再信他们”便签的文件袋递给她，说明他一直在暗中护她。第40章补出的校园羁绊源头仍然成立：她曾在顾夜舟被当成怪物围观时替他说“他是人”，后来顾夜舟又在南门器材室雨夜救过她；这段记忆被许知衡的形象覆盖。第45章后，这段羁绊又被前置了一层：她已经闪回到更早的窄巷，看见作为样本出逃的顾夜舟浑身是伤地蹲在垃圾桶旁，而更年少的自己没有把他当怪物，还把校服外套借给了他；只是这段更早的种子记忆依旧不完整，中间仍压着回线代价和外力篡改。当前她仍以“重生”理解自己的经历，但第37章后真相开始指向更大的平行时空/回线机制；她不是随机被送回，而是与07号、识伪共振、系统和顾澜保护线存在关键适配，且需要“站稳”才能继续承接后续信息。她回来的代价是记忆大面积缺失、混线与可被篡改，上辈子真正发生过的事远远多于她现在记得的那些。第46章后新增作者侧硬设定：沈清辞是认门人，上一条线里曾为了阻止门源力借自己闯出毁灭世界而鱼死网破毁门；门未彻底损坏，她太虚弱，只能留下信号后死去。她的崩溃来自记忆被篡改、异能波动被设局、门源力吞噬欲望和保护他人时失控伤人，不是脆弱或恋爱脑。作者侧长线真相可反转为：她以为自己回来是救顾夜舟，实际上上一世她死后，顾夜舟查到真相、依靠自己从地下样本链里救出的势力布下回线，真正先伸手回来的人可能是顾夜舟。

name: 陈渡
aliases: []
physical_description: 长相普通到很容易被人忽略，偏瘦，肤色发白，校服永远穿得规规矩矩，左手腕有几道很旧的针孔疤，站在器材室或后台角落里时像一块安静的旧木板。
personality_traits:
- 寡言
- 谨慎
- 低存在感
- 观察力强
- 求生本能极强
knowledge_state: 知道青岚旧案、样本编号和陆闻川在学校里埋线的方式，也知道真正的苏晚宁和成人礼后台之间存在联系。到第34章末，他已经确认陆闻川开始顺着后台和广播摄影线筛人，同时也确认校门外有额外观察者和补位人员，不再只是校园内部的布置。
emotional_state: 他对陆闻川依旧保持深度警惕，求生欲比谁都强。现在真正让他紧起来的，不只是自己会不会暴露，而是乔知夏这条线也开始被看见了，所以他会更克制、更少露面。
relationships:
- target: 沈清辞
  type: 试探性盟友
  description: 先递纸条救人，再决定观察她值不值得继续交底。
  knowledge: 知道她能识伪，也看得出她不是会把证人随便丢下的人。
- target: 顾夜舟
  type: 重点观察对象
  description: 知道他是07号，也知道围着他转的所有布置都不简单。
  knowledge: 明白顾夜舟比传闻里更稳，也更清楚他是所有校内外布线最后都要落到的中心点。
- target: 乔知夏
  type: 同线观察对象
  description: 在礼堂异常和外场暗线里逐渐确认对方不是普通学生。
  knowledge: 目前不打算摊牌，但已经默认她和自己一样，都不能太早站到明面上。
- target: 陆闻川
  type: 恐惧对象
  description: 让他学会低头活命的人。
  knowledge: 知道陆闻川最擅长把筛查和关心包装成流程，一旦被他正式盯住，后续只会越来越难躲。
current_goals:
- 继续隐藏自己，别让陆闻川重新把自己拎出来
- 借后台和后勤位置继续筛校门外那条暗线
- 在不暴露身份的前提下，把关键线索递给沈清辞和顾夜舟
- 观察乔知夏是不是和自己站在同一条更深的第三方调查线上
location: 临川一中后台、器材室、礼堂边线与校门口附近
core_triangle:
  desire: 先活下去，再把该送出去的线索慢慢送到能用的人手里
  ability: 超低存在感、熟悉学校后场路径、对名单和临时流程异常极敏感
  obstacle: 长期恐惧形成的自我压抑、陆闻川的注意力一旦重新落到他身上就很难脱身
motivation_type: survival
growth_stage: adapting
backstory: 表面上像当年被当作低波动废样本漏掉的边缘幸存者，实际更接近一条第三方调查线留在校园阶段的暗桩之一。他比任何人都更清楚，在高中阶段活得不起眼，比把真相说出来更重要。
first_appearance: 31
last_active: 34
is_pov: false

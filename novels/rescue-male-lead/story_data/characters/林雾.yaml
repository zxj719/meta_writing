name: 林雾
aliases:
- 当前“苏晚宁”载体
physical_description: 真正的脸清瘦苍白，眼下带着久睡不好的人才会有的淡青色；一旦脱开镜面壳，那种惊惶和疲惫会立刻从眉眼里漏出来。
personality_traits:
- 惊弓之鸟
- 谨慎
- 会演
- 求生欲强
- 观察细
knowledge_state: 知道镜面计划、陆闻川、顾启明、前世病房和沈清辞被盯上的原因，也知道真正的苏晚宁尚未正式进场；她清楚自己只是暂时穿着这张脸的人。第51章后，“苏晚宁”公开身份被安排身体原因休学，说明林雾这层公开校园壳体被陆闻川从台前撤下，后续更可能被转入心理支持或回收流程。
emotional_state: 长期处在随时会被回收、替换或灭口的高压里，对陆闻川和镜子都有明显恐惧；但在快撑不住之前，她已经决定先把关键真相递出去。
relationships:
- target: 沈清辞
  type: 临时盟友
  description: 一开始只是为了自保才递消息，到了后面已经变成必须把真相交给她的人。
  knowledge: 知道她不仅会查，也真的有能力看穿“这张脸”下面的东西。
- target: 顾夜舟
  type: 恐惧对象
  description: 07号共振会直接撕裂镜面稳定度，她既怕他，也怕被他看穿。
  knowledge: 知道顾夜舟不是普通高危样本，而是陆闻川不敢轻易毁掉的钥匙。
- target: 陆闻川
  type: 操控者
  description: 一直在决定她该顶着谁的脸活、又该替谁去送死的人。
  knowledge: 知道他最擅长把命令包装成关心，把筛查包装成治疗。
current_goals:
- 先活下来
- 把镜面线和前世病房的真相尽量多地递出去
- 在真正的苏晚宁进场前，别让自己先被回收掉
- 在公开病休后避免被陆闻川彻底回收或抹掉
location: 对外病休状态，真实位置未知
core_triangle:
  desire: 从镜面身份壳里活着脱身
  ability: 演技、顺从求生、对镜面流程和陆闻川习惯的熟悉
  obstacle: 身份不属于自己、壳体在加速失稳、任何一次站错队都可能直接丢命
motivation_type: survival
growth_stage: crisis
backstory: 她不是“苏晚宁”本人，而是被镜面线推上校园身份壳的一名载体。前世与今生，她都在陆闻川的命令里被迫学着拿别人的脸活。
first_appearance: 30
last_active: 51
is_pov: false

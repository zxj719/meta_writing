new_information_revealed:
- 系统存在暂时必须继续对顾夜舟保密
- 顾夜舟已经察觉沈清辞有异常信息源，但只停留在“她在隐瞒”的层面
- 沈清辞作为回线锚点不是随机落点，稳定度与她的选择、语言和情绪有关
- 许知衡是沈清辞前世关键偏差对象，即将以联校优秀学生代表身份进入临川一中
- 沈清辞上辈子选错许知衡不是因为愚蠢，而是因为信息差和被摆错方向的证据
- 许知衡后续可向魅惑/信任诱导型能力发展，外貌核心特征是狐狸眼
- 上一世后期的顾夜舟已经呈现阴郁、危险、压迫感强的形态，但他对沈清辞的保护是通过证据、文件和沉默行动完成的

chapter_number: 27
title: 苏晚宁那张脸，可能本来就不属于她
summary: 观察室炸开以后，沈清辞和顾夜舟一路闯进主控室，既看见顾启明对陆闻川彻底失控，也看见了镜面项目最恶心的一面。控制台里那些“共振观察”“镜面载体”“锚点筛查”的目录，把青岚真正的结构露出来了一角；而在顾夜舟共振场逼近的同时，顶着苏晚宁那张脸的女生也终于再也撑不下去，亲口承认了自己根本不是苏晚宁。
events:
- 沈清辞和顾夜舟从观察室冲向主控区，苏晚宁则拿着门禁卡和密码接应
- 两人亲耳听见顾启明对陆闻川发疯，确认顾启明并非真正的上位者
- 顾夜舟在清醒状态下压制顾启明、配合沈清辞停住删除程序
- 主控室屏幕里露出“07号共振观察”“镜面载体维护”“锚点筛查记录”等核心目录
- 顾夜舟共振场逼近后，苏晚宁脸上的伪装开始失稳
- 顶着苏晚宁脸的女生亲口承认自己不叫苏晚宁，身份线正式裂开
characters_present:
- 沈清辞
- 顾夜舟
- 顾启明
- 陆闻川
- 苏晚宁

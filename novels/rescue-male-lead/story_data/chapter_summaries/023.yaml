chapter_number: 23
title: 我爸看见那张照片的时候，像被雷劈了
summary: 沈清辞终于把旧合影拍到了父亲面前，沈父也因此承认自己当年与顾启明是同事，知道青岚研究所项目是怎么一步步走偏的。更重的一层真相随之浮上来，顾夜舟的母亲曾向沈父求助，但那次求助并没能真正把人救出来。等顾夜舟站到沈家门口，这场隔了十几年的旧账也彻底失去了继续遮掩的可能。
events:
- 沈清辞回家后正面质问沈父，拿出旧合影逼他开口
- 沈父承认自己与顾启明曾是同事，并知道青岚研究所项目是如何走偏
- 沈父承认自己最近赞助学校、清理旧资料是为了回收当年尾巴
- 沈父提到顾夜舟母亲曾找过自己求助，但事情没有被真正解决
- 顾夜舟在此时来到沈家，准备亲自问清旧事

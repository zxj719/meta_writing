chapter_number: 50
title: 男朋友上岗
summary: 旧部饭局后半段，李佳佳刷到临川一中清舟CP楼已经盖起，楼内仍把顾夜舟称为“疑似/预备役男友”。顾夜舟想要正式名分却不说，单向共感让沈清辞直接感受到他的心跳失控；沈清辞顺势宣布顾夜舟从预备役男友转为正式男友，并在众人起哄中亲了他的额头。饭后众人分流，顾夜舟带青鲤、荒川、钟塔、旧港回自己从顾启明手里硬抢回来的顾澜婚前老公寓，作为第一批旧部临时落脚点；李佳佳因得罪许知衡且独居不安全，被沈清辞带回沈家，顺便体验富家女生活。夜里共感链路仍在线，顾夜舟因额头吻和“男朋友，晚安”辗转反侧，沈清辞在自己家也被心跳影响得睡不着。第二天两人顶着同款黑眼圈在校门口见面，正式男友售后第一条变成“今晚十点前睡觉”。章尾许知衡从陆闻川处收到旧线片段投喂，确认情感争夺窗口已经关闭，但回收沈清辞的任务仍在继续。
events:
- 李佳佳在饭桌上发现“清舟CP楼”已经盖到两百多层，楼内把顾夜舟和沈清辞的合照、签名、牵手破案等当作证据讨论
- 顾夜舟对“疑似男友/预备役男友”的称呼有情绪反应，但嘴上不说
- 沈清辞通过单向共感捕捉顾夜舟心跳失控，猜到他想要正式名分
- 沈清辞宣布顾夜舟从预备役男友转为正式男友，旧部和李佳佳集体起哄
- 沈清辞亲吻顾夜舟额头，系统提示文明恋爱检测通过，顾夜舟心跳异常飙升
- 饭桌转入人员分流，顾夜舟决定把青鲤、荒川、钟塔、旧港带回自己住处
- 叙述补出顾夜舟目前老公寓来自顾澜婚前房产，曾被顾启明转入空壳公司，顾夜舟用非法转移资产和挪用顾澜遗产证据逼顾启明签返还协议
- 李佳佳坦白父母长期在外地照顾身体不好的弟弟，自己租在学校附近独居
- 沈清辞以“富家女体验卡”把李佳佳带回沈家保护，李佳佳体验沈家客房、热牛奶、浴缸和安保套餐
- 顾夜舟带旧部回老公寓，青鲤、荒川、钟塔、旧港在临时基地落脚
- 夜里顾夜舟因沈清辞额头吻和“男朋友，晚安”失眠，单向共感让沈清辞也被心跳影响无法入睡
- 第二天早上沈清辞和顾夜舟在校门口带着同款黑眼圈见面，李佳佳吐槽两人远程蹦迪
- 许知衡在校门口远处观察两人，收到陆闻川发来的旧线片段投喂与“情感争夺窗口关闭、回收任务继续”提示

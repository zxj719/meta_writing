new_information_revealed:
- 清舟CP楼已经在学生之间形成，民间舆论早已把两人的互动当作连续证据
- 顾夜舟想要正式名分但不会明说，单向共感能暴露他的强烈心跳
- 清舟私下正式确认关系，但仍保持高中阶段克制，只亲额头
- 顾夜舟有一套从顾启明手里抢回的顾澜婚前老公寓，抢回过程基于顾启明非法转移资产和挪用顾澜遗产证据
- 李佳佳父母长期照顾身体不好的弟弟，她独自在学校附近租房读书，这解释她愿意接受沈家的临时保护
- 许知衡从陆闻川处拿到的旧线片段是“投喂”，不是本人完整回线；他曾经演着演着对沈清辞有一点真情绪，但力量和任务大过感情
- 陆闻川线仍试图回收沈清辞，即使许知衡已经失去情感争夺位置

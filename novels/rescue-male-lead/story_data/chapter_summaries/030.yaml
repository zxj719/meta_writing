chapter_number: 30
title: 故事还没开始，白莲花先换了张脸
summary: 老体艺馆那场摊牌彻底把“苏晚宁”从一个校园反派拆成了一整条镜面身份线。自称林雾的女生承认，苏晚宁这张脸根本不只属于一个人，陆闻川让谁戴上，它就是谁的壳。更致命的是，她也把沈清辞前世真正的死法、顾夜舟和沈清辞各自被盯上的价值，连同“一个能开门，一个能认门”的判断一起说了出来。沈清辞第一次真正用自己的识伪共振看见脸下面的另一张脸，而门外温声敲门的陆闻川，也让所有人彻底明白，前面的风波不过只是序章。
events:
- 沈清辞按约来到老体艺馆女厕，与顶着苏晚宁身份的女生单独见面
- 对方自称林雾，解释“苏晚宁”是一张能被不同载体穿戴的镜面身份壳
- 林雾承认顾夜舟是“开门”的钥匙，而沈清辞是那种能“认门”的人
- 林雾说出沈清辞前世车祸后并未立刻死去，而是在医院里被陆闻川补上了最后一针
- 沈清辞第一次真正触发识伪共振，看见“苏晚宁”脸下面的另一张脸
- 陆闻川在门外温声敲门，系统同步刷新新的主线和隐藏任务
characters_present:
- 沈清辞
- 林雾（当前“苏晚宁”）
- 陆闻川
- 系统
state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 通过前世记忆碎片和项目目录，确认陆闻川不仅和顾夜舟能力线有关，也和自己上辈子的死亡以及未觉醒能力直接相关
  new_value: 正式确认“苏晚宁”不是固定的一个人、前世自己的死因确实与陆闻川有关，也第一次看清自己被盯上的能力方向是识伪与共振识别
- character: 沈清辞
  field: emotional_state
  old_value: 在陆闻川堂而皇之进校后，她对这场局的感受从“被阴着查”变成了“得正面陪他演下去”，戒备彻底从暗线切到明线
  new_value: 在亲眼看见镜面壳下的另一张脸、又隔门听见陆闻川温声叫自己名字后，她对这场局的判断彻底升级成“前面只是前菜，真正的故事现在才开始”
- character: 林雾（当前“苏晚宁”）
  field: emotional_state
  old_value: 在继续顶着“苏晚宁”身份活动的同时，已经开始主动递警告、主动约见沈清辞，准备把镜面线彻底掀开
  new_value: 从濒临失稳的载体和被迫线人，正式转为主动坦白镜面项目、前世病房和陆闻川布局的关键证人
new_information_revealed:
- “苏晚宁”不是固定的一个人，而是一张可供不同载体轮换的镜面身份壳
- 当前顶着苏晚宁脸的人自称林雾
- 沈清辞前世车祸后并未立刻死亡，而是在医院里被陆闻川补上了致命一针
- 顾夜舟是“开门”的钥匙，沈清辞则是能“认门”的那类人
- 沈清辞首次真正触发识伪共振，能力觉醒线被正式拉开
foreshadowing_planted:
- 找出真正的苏晚宁和镜面线最初的源头
- 让沈清辞的能力完成第一次稳定觉醒
- 陆闻川即将正式和沈清辞、顾夜舟展开明面对弈
foreshadowing_paid_off:
- 林雾此前反复提到“这张脸”和不敢照镜子
- 陆闻川“病情最怕拖”的温和口吻与前世病房记忆彻底重合
- 镜面照片里露出的那点错位被正式解释
pov_character: 沈清辞

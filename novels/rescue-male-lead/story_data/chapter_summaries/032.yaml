chapter_number: 32
title: 试礼服那天，全校先被他们晃了一下
summary: 成人礼流程公开贴出后，整个高三都被礼服、签名和合影的气氛带得热闹起来，沈清辞和顾夜舟也第一次在这种近乎正常的校园日常里，光明正大地站到了同一束灯下。两人互相在校服上写了只有对方看得懂的签名，下午又被礼堂礼服试穿和摄影社“试光”硬生生推到一起，拍下了第一张正式合照。沈清辞一身浅金白礼服明艳得压不住，顾夜舟换上黑色正装后更显冷白锋利，整场试装几乎把全班都晃停了半拍。轻松氛围里危险也没真正离开，陆闻川以心理中心协助老师的身份堂而皇之出现在校领导演讲现场，而摄影社女生乔知夏却在音箱真正啸叫前先一步捂住了左耳，露出与常人不同的异常反应。更糟的是，班主任临时通知沈清辞和顾夜舟被改成了成人礼学生领誓代表，意味着他们会被进一步推到舞台正中央。章节最后，乔知夏把两人的第一张合照递给沈清辞，低声提醒她别让顾夜舟站到中间那盏追光灯下，因为那盏灯明明没开，她却已经听见了它在响。
events:
- 成人礼流程表公开贴出，陆闻川以心理中心协助老师身份进入公开名单
- 沈清辞和顾夜舟互相在校服袖口签字，地下恋气氛在普通高三日常里进一步落地
- 高三学生集中去礼堂后场试礼服，沈清辞与顾夜舟的礼服高光第一次在众目睽睽下成形
- 摄影社女生乔知夏为两人试光拍照，拍下他们第一张正式合照
- 校领导进行成人礼动员讲话时，乔知夏在音箱啸叫前先一步出现异常反应
- 班主任宣布学生领誓代表临时改成沈清辞和顾夜舟
- 乔知夏私下提醒沈清辞，明天彩排不要让顾夜舟站在中间那盏追光灯下

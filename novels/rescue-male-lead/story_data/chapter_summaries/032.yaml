state_changes:
- character: 沈清辞
  field: emotional_state
  old_value: 高压一直没退，但她已经不再只是抱着“必须救顾夜舟”的执念往前冲；喜欢和保护欲混在一起，让她在危险里反而更不肯松手，嘴上还在贫，行动上却越来越像把顾夜舟划进了自己的范围。
  new_value: 在成人礼试装、签校服和拍下第一张正式合照之后，她第一次真切意识到自己和顾夜舟之间已经不只是并肩查线，而是会在普通校园日常里也自动靠近、自动站到同一边。
- character: 顾夜舟
  field: emotional_state
  old_value: 戒备和怒意都还很重，但他已经很难再把沈清辞推到局外；喜欢、占有欲和保护欲混在一起，让他越来越习惯在出事时第一时间往她那边赶。
  new_value: 明知道成人礼和公开舞台会让局面更危险，他还是默认和沈清辞一起换礼服、一起拍照、一起上台，这种不再回避的靠近已经从私下保护，变成了半公开的站位选择。
- character: 乔知夏
  field: knowledge_state
  old_value: ''
  new_value: 摄影社与广播站边缘成员，对礼堂设备、光源和频段异常有超出常人的感知能力，已经注意到成人礼舞台中央追光灯存在不对劲的异响。
new_information_revealed:

chapter_number: 56
title: 别回头的人
summary: 秦越以污染事件和监护人授权为由，把沈清辞、顾夜舟和李佳佳从医务楼带上沈家车辆，顾夜舟在车上追问秦越刚才通讯器里的女人是否是顾澜。秦越只确认顾夜舟已经听见了，并转达顾澜“别恨太早”的话；他说明顾澜每接一次线都会暴露坐标，暂时无法亲自解释。路上，顾夜舟在沈清辞接触监护下通过顾网看到老公寓围剿现场：青鲤、荒川、钟塔和旧港被强者至上训练场成员从楼道、窗外和天台围住，四人身体仍弱，却在高危刺激下逐步找回配合。顾夜舟远程进入十分钟控制态，先借水管和金属碎片完成控物，再用“停”压住敌人的行动，随后掐断意念冲击者的能力链路，展现阶段三能力链路干预。旧部在他的命令中重新站稳，也明确告诉他这次他们自己也会往前走，不让他一个人扛。穿插陆闻川留在心理咨询室后的记忆闪回：他的妹妹陆星禾曾因异能污染导致器官衰竭死亡，他作为医生没能救回她；葬礼上他的治愈异能觉醒，却只能让白菊复原，无法起死回生。他因此压下治愈异能，转向镜面、暗示和意识攻击，站上实验台追求门后的力量，误以为那足以复活妹妹。章尾旧港通讯器提示训练场目标不是杀旧部，而是逼07进入第四阶段；系统提示第四阶段未知，沈清辞要求顾夜舟到门口为止，不准越线，顾夜舟答应听她的。
events:
- 秦越以污染事件和监护人授权为由，带沈清辞、顾夜舟和李佳佳离开心理咨询室并上车
- 李佳佳揉腕骨，袖口内侧灰蓝毒点仍未被系统识别，暂时被当作粉笔灰或神经错觉
- 顾夜舟在车上询问秦越刚才通讯器里的女人是否是顾澜，秦越只做有限确认
- 秦越转达顾澜“别恨太早”的话，并说明顾澜每接一次线都会暴露坐标，不能直接现身解释
- 沈清辞和李佳佳用吐槽缓冲顾夜舟被亲妈做局的抓马感，沈清辞继续保持接触监护
- 顾夜舟通过顾网看见老公寓围剿现场，青鲤、荒川、钟塔和旧港遭训练场成员从多方向逼近
- 旧港继续用通讯器和分支预警给旧部争取极限反应时间，青鲤等人仍用吐槽撑住场面
- 顾夜舟远程通过契约线控制水管、金属刃和灰蓝雾，完成控物稳定
- 顾夜舟通过契约线下达命令，控住敌人的动作与能力运行，进一步展现控人和能力链路干预
- 顾夜舟说“我救你们出来，不是让你们换条线继续替我死”，强化他和旧部之间的救命因果
- 青鲤、荒川、钟塔、旧港在高危刺激下逐步恢复配合，明确他们不是等待顾夜舟捡回的残兵
- 陆闻川在心理咨询室捡起被顾夜舟控制过的钢笔，触发妹妹陆星禾死亡回忆
- 陆闻川回忆陆星禾因异能污染器官衰竭而死，自己作为医生没能救她
- 陆闻川在妹妹葬礼上觉醒治愈异能，却发现只能治愈白菊，不能复活死人，因此从此压下治愈能力
- 陆闻川为了拿到门后的复活力量，转向镜面、暗示和意识攻击，把自己改造成攻击意念型执行者
- 车子抵达老城区，旧港通讯器提示训练场目标不是旧部死亡，而是逼07进入第四阶段
- 系统提示第四阶段未知，沈清辞要求顾夜舟到门口为止，不准越线，顾夜舟答应听她的

new_information_revealed:
- 顾澜无法直接现身或长时间接线，每次通讯都会增加坐标暴露风险
- 顾澜让秦越转达“别恨太早”，说明她知道顾夜舟会因为被亲妈做局而产生强烈情绪
- 顾夜舟控制态可以通过顾网远程作用到契约者战场，借旧部能力和环境实现跨场控物与控人
- 顾夜舟和旧部之间的羁绊来自上一条线救命因果：他给他们第二次活着的机会，他们也不想让他一个人扛完
- 陆闻川最初站上实验台是为了复活妹妹陆星禾；妹妹死于异能污染导致的器官衰竭
- 陆闻川原生异能为治愈，在妹妹葬礼上复苏，但做不到起死回生，所以他长期不用，也不用在自己身上
- 陆闻川后来开辟镜面线并把自己改造成攻击意念型，是为了接近他误以为能复活死人的门后力量
- 训练场围剿旧部真正目标不是杀旧部，而是逼顾夜舟进入未知第四阶段

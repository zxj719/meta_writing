chapter_number: 11
title: 晚会名单不是抽签，是点名
summary: 学校晚会名单一贴出来，沈清辞就发现自己不是被“邀请”，而是被人提前写进了主持人名单里。她索性将计就计，一边顺着名单往下走，一边盯住苏晚宁和后台设备的动静，确认这场晚会果然是冲着自己来的。顾夜舟嘴上嫌她事多，却在礼堂附近晃了半天没走，别扭得像一条提前拉紧的警戒线。
events:
- 学校公布晚会名单，沈清辞发现自己被提前塞进主持人位置
- 苏晚宁以班主任安排为名劝她接下主持工作，沈清辞当场签字接招
- 沈清辞在排练时留意到后台设备和主持词都有人动过手脚
- 顾夜舟虽然没明说，却明显开始盯着礼堂和后台的异常动静
- 苏晚宁私下转来X的新要求：正式演出那天要让沈清辞在台上出丑

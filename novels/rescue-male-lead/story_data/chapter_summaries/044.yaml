chapter_number: 44
title: 她不越门槛
summary: 顾夜舟拿到写有“别让她喝第二瓶”的防水标签后，许知衡试图用老师即将到场和“对谁都不好”的话术施压，顾夜舟拒绝交还证物。李佳佳在门外报点并始终停在门槛外，没有伸手碰证据，顾夜舟和沈清辞因此没有对她设高防；正文补出高一冬天沈清辞曾无意识替李佳佳挡过难堪，让李佳佳天然站在沈清辞这一边。老师和管理员赶到后，李佳佳用“承诺书”和封条异常把焦点引向现场流程，并指出许知衡并不在三楼却过早判断学生会被误会，打断了许知衡把众人推下楼的节奏。她随后出现交错旧线碎片：另一条走廊里，狼狈的沈清辞递给她公交卡，让她去叫顾夜舟。章尾李佳佳向沈清辞和顾夜舟坦白自己会“串台”，不是重生也没有完整剧本，只会想起没发生过的画面；她记得沈清辞在当前线和交错旧线都帮过自己，也想起自己可能曾在许知衡引导下递给沈清辞第二瓶水。
events:
- 许知衡试图阻止顾夜舟带走防水标签，顾夜舟把标签夹进草稿本
- 李佳佳在门外报点，保持不越门槛、不伸手碰证据的边界感
- 正文补出高一冬天沈清辞曾把外套扔给被人嘲笑的李佳佳，替她化解难堪
- 管理员和老师赶到三楼，李佳佳用承诺书和封条断裂把焦点引向现场流程
- 李佳佳当众指出许知衡刚才不在三楼，却过早判断大家会被误会，打断许知衡的控场
- 李佳佳被许知衡的视线触发交错旧线碎片，看见另一条走廊里沈清辞递给她公交卡并让她去叫顾夜舟
- 系统提示李佳佳身上有低强度交错记忆残留，危险倾向低，阵营倾向为单人
- 李佳佳向沈清辞和顾夜舟坦白自己会“串台”，不是重开，也没有完整剧透本
- 李佳佳说明自己帮沈清辞，是因为记得沈清辞现在和梦里都帮过自己
- 李佳佳想起第二瓶水相关画面：自动贩卖机冷白光下，许知衡对她说“她现在只信你”，她手中水瓶瓶盖内侧有蓝色印痕
- 章尾李佳佳说自己可能曾给沈清辞递过第二瓶水

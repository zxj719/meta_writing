chapter_number: 12
title: 他救人的方式像在抓嫌犯
summary: 正式演出当天，后台果然有人把沈清辞的配套文件和大屏内容动了手脚，想让她在全校面前直接翻车。沈清辞临场稳住阵脚，顾夜舟则用一种近乎“拆台”的粗暴方式替她掐断了最危险的那一环，硬生生把她从公开社死边缘拽了回来。晚会结束后，一条关于沈父公司“正在清理旧项目资料”的提醒，也把更深的一层水面掀开了。
events:
- 正式晚会开始，沈清辞顺利完成开场主持
- 后台学生发现她对应的背景文件被人替换成会让她当众出丑的内容
- 沈清辞准备硬着头皮上台时，顾夜舟先一步出手破坏了出问题的播放链路
- 沈清辞顺势用临场反应把台面稳住，没有让对方得逞
- 晚会结束后，沈清辞收到父亲助理发来的提醒截图，注意到“旧项目资料正在清理”

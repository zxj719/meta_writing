chapter_number: 17
title: 白莲花改行当跟班
summary: 旧仓库事件后，苏晚宁彻底换了阵营，顶着全班见鬼的目光开始往沈清辞身边凑，活像一朵被雷劈歪了的白莲花。沈清辞一边拿她当线人兼乐子人，一边继续推动顾夜舟去碰正常社交。可等顾夜舟真看见苏晚宁亦步亦趋跟在沈清辞身边时，他的反应却比谁都微妙。
events:
- 苏晚宁拎着奶茶堵在教室门口，正式向沈清辞表态倒戈
- 沈清辞给她一个“试用期跟班”的位置，把她先当工具人用
- 全班围观苏晚宁突然改口改阵营，气氛一度非常诡异
- 顾夜舟看着苏晚宁围着沈清辞转，态度明显变得别扭
- 沈清辞在食堂和课间继续把顾夜舟往“正常相处”里拽
- 顾夜舟第一次把那句带着酸味的“那我算什么”摆到台面边缘

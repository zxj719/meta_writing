chapter_number: 52
title: 手心发烫的普通女高
summary: 百日冲刺心理摸排正式进入高三七班，班主任发下带低频筛查标记的心理问卷。沈清辞看见问卷右下角的蓝色方格后出现蜂鸣和头痛，李佳佳扶住她手腕时手心异常发烫，意外压下沈清辞的不适，系统提示李佳佳作为沈网契约者出现低阶治愈/稳定倾向，状态由未觉醒变成初醒。李佳佳也确定高考前都住在沈家，由沈清辞保护。陆闻川亲自到教室收第一批自评表，以百日冲刺压力访谈名义观察沈清辞、顾夜舟和李佳佳，并在名单角落标出S-QC、07、LJJ。另一边，许知衡在返回附中的车上看到自己原线策略席权限被冻结、当前线信息投放者为陆闻川，与陆闻川就镜面壳体撤离、心理摸排和李佳佳介入发生路线分歧，露出两人在反派阵营中级别与旧怨不对付。顾夜舟老公寓里，旧部继续真实复健：荒川控制水杯、钟塔感知断网重连、旧港因通讯器回音触发旧港地下城记忆，补出“旧港”这个名字来自曾被顾夜舟砸开的地下城。通讯器随后吐出终局记录残片：S-QC二十四岁死亡，07二十四岁死亡，间隔四十六小时内。章尾广播通知沈清辞、顾夜舟和李佳佳下午第三节后去医务楼三层心理咨询室参加访谈，陆闻川的初期行动正式落到三人身上。
events:
- 百日冲刺心理摸排通知在班级落地，班主任发下浅蓝色心理压力自评表
- 沈清辞发现问卷右下角带低频蓝色筛查方格，系统提示减少持续注视
- 沈清辞因筛查标记出现蜂鸣和头痛，顾夜舟通过共感察觉她身体绷紧
- 李佳佳扶住沈清辞手腕时手心发烫，热意压下沈清辞的不适
- 系统提示李佳佳作为沈网契约者出现低阶治愈/稳定倾向，状态从未觉醒进入初醒
- 沈清辞决定让李佳佳高考前继续住在沈家，完成保护和日常同住安排
- 陆闻川亲自到高三七班收第一批自评表，宣布后续一对一压力访谈
- 沈清辞在陆闻川文件夹名单角落看到S-QC、07、LJJ三个标记，确认三人被纳入筛查
- 许知衡在返程车上看到自己原线策略席权限被冻结、当前线信息投放者为陆闻川
- 许知衡与陆闻川短信争执镜面壳体撤离和心理摸排节奏，表现出两人在反派阵营内路线不合
- 顾夜舟老公寓里，荒川、钟塔、旧港继续身体和能力适应，恢复进度真实且缓慢
- 旧港因通讯器回音触发记忆，补出自己的名字来自上一条线“旧港”地下城被顾夜舟砸开的现场
- 旧港通讯器吐出终局记录残片，确认上一条线沈清辞和顾夜舟都死在二十四岁，间隔四十六小时内
- 广播通知沈清辞、顾夜舟、李佳佳下午第三节课后到医务楼三层心理咨询室参加访谈

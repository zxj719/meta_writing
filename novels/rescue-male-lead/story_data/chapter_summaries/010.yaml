chapter_number: 10
title: 你的手很暖
summary: 因为前一晚的手背接触而心神不宁的沈清辞，被系统逼着完成一次牵手任务。她把顾夜舟拐到夜里的操场，磕磕绊绊把“我不会半路撒手”说出口，最后主动握住了他的手。顾夜舟没有躲，甚至轻轻回握，而苏晚宁随后转来的截图，也把学校晚会这场新冲突正式抬上台面。
events:
- 系统刷新牵手十秒以上的离谱日常任务
- 沈清辞一整天都在找合适机会，最后在晚自习后把顾夜舟叫去操场
- 沈清辞在操场上用笨拙但真诚的话回应了顾夜舟关于“管到这儿”的追问
- 沈清辞主动牵住顾夜舟的手，两人并排行走超过十秒
- 顾夜舟没有躲开，反而轻轻回握，系统判定第一次牵手成就达成
- 苏晚宁把X发来的新指令截图转给沈清辞：下周学校晚会要让她当众出丑

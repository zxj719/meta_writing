chapter_number: 25
title: 好心医生递来的纸巾最吓人
summary: 沈清辞甩开家里和顾夜舟想把她隔开的安排，独自赴约去青岚旧址，在那里第一次正面对上顾启明。对方已经不再装父亲，只把顾夜舟当成需要回收的观察对象，也把沈清辞当成能把07号重新逼回轨道的引线。等她被拖进监控室，看见雨里独自赶来的顾夜舟时，整条局才真正从旧账升级成了正面对弈。
events:
- 沈清辞绕开家里和顾夜舟的安排，独自前往青岚旧址
- 她在旧楼里与顾启明第一次正面交锋，确认对方把顾夜舟当成长期观察对象
- 顾启明明确表示自己想借沈清辞逼顾夜舟做出更剧烈反应
- 沈清辞在旧楼里反抗失败，被人用药迷晕并绑进监控室
- 顾启明看着监控确认顾夜舟正单独赶来，局势彻底升级

  new_value: 她曾被关在旧港地下水箱供富人观赏和研究，顾夜舟砸开水箱救下她；她随后第一个签下顾夜舟共生协议，成为顾夜舟网里的契约者。
- character: 李佳佳
  field: knowledge_state

  new_value: 他通过青鲤契约者标记完整想起自己上一条线救下青鲤、建立共生协议网、让旧部自愿签约的过程；他还看见沈清辞最后给自己下过单方协议，把下一线生命锚点转交给自己。
- character: 青鲤
  field: backstory

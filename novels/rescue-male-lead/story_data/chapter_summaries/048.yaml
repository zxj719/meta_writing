  new_value: 她本人仍不知道自己上一条线签过沈清辞的共生协议，也看不见资料袋内侧浮出的契约者标记；读者侧与男女主侧知道她是沈网契约者，且在毁门时替两人挡过多次关键灾祸。
- character: 沈清辞
  field: knowledge_state

  new_value: 她通过与顾夜舟同步的契约回流碎片，短暂看见自己上一条线建立沈网、让李佳佳签约、以及最后给顾夜舟下单方协议的画面，但尚未完整理解系统与沈网之间的关系。
new_information_revealed:
- 可信阵营被称为契约者，上一条线里顾夜舟和沈清辞分别以自己为中心建立过共生协议网
- 共生协议由自愿者签署，背叛、泄密或主动伤害网内目标会反噬签约者本人，协议他方不受伤害
- 当前线遇到契约者会触发顾夜舟或沈清辞的记忆回流、标记共振和快速信任
- 青鲤曾被顾夜舟从旧港地下水箱救出，是顾夜舟网里的第一批契约者
- 李佳佳是沈清辞网里的契约者，上一条线毁门时为沈清辞和顾夜舟挡过很多关键伤害，但当前线她本人尚未觉醒
- 沈清辞最后给顾夜舟下过单方协议，把下一线生命锚点转交给他，顾夜舟灵魂上存在未完全觉醒的烙印

chapter_number: 48
title: 契约者
summary: 顾夜舟在当前线叫出“青鲤”后，契约者标记触发完整旧线记忆回流。他回忆上一条线在旧港地下黑市砸开水箱救出青鲤，随后在地下会议室建立自己的共生协议网；青鲤第一个签约，成为他的契约者之一。记忆进一步推到门前最后一夜，沈清辞也建立了自己的网，李佳佳在沈网里签约，并在毁门时抱着资料袋替沈清辞挡下蓝色水样针、广播线断裂和回收金属片等多次灾祸。顾夜舟还看见沈清辞最后给自己下单方协议，把下一线生命锚点转交给他。现实里，青鲤和李佳佳用吐槽缓冲气氛，顾夜舟和沈清辞则在李佳佳资料袋内侧看见“沈网契约者：李佳佳，状态：未觉醒”，但李佳佳本人暂时看不见。
events:
- 顾夜舟叫出青鲤名字后，胸口旧线契约标记发烫，触发契约者记忆回流
- 顾夜舟回忆上一条线旧港地下三层，青鲤被关在水箱里供富人下注观赏和研究
- 顾夜舟命人砸开水箱，救下青鲤，并以“想活就跟上”把她带离地下黑市
- 旧线地下会议室里，顾夜舟向荒川、钟塔、旧港、青鲤等人说明共生协议，背叛和主动伤害网内目标会反噬签约者本人
- 青鲤第一个签下顾夜舟的共生协议，成为契约者，也补足她与顾夜舟前世交集
- 顾夜舟回忆沈清辞在门前最后一夜也建立过自己的契约网
- 李佳佳在沈清辞那边签下协议，用插科打诨方式要求免数学，显示她上一条线也曾站在沈清辞身边
- 毁门时，李佳佳抱着资料袋替沈清辞挡下蓝色水样针、修复广播线、撞开回收金属片，帮两人争取最后时间
- 顾夜舟看见沈清辞最后给自己下单方协议，把下一线生命锚点转交给顾夜舟
- 现实里顾夜舟胸口灵魂烙印短暂发烫，他告诉沈清辞“别松手”
- 青鲤和李佳佳用“CP超话管理员”等吐槽把楼梯间气氛短暂拉回轻喜剧
- 顾夜舟和沈清辞同时看见李佳佳资料袋内侧浮出“沈网契约者：李佳佳，状态：未觉醒”，李佳佳本人仍看不见

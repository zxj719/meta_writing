state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 第40章后，她进一步确认上一世南门器材室、黑伞、草莓牛奶和“开门者”记忆存在覆写痕迹；许知衡很可能顶替或偷走了顾夜舟曾救她的关键契机。
  new_value: 她确认当前线重生前自己与许知衡确有家族饭局和父辈合作交集，也意识到这种体面关系曾被用作信任锚点；她还知道许知衡正试图用化学实验楼参观路线把顾夜舟引向三楼旧试剂准备室。
- character: 顾夜舟
  field: knowledge_state
  old_value: 第40章后，他通过双向记忆回流看见上一世南门器材室雨夜，知道自己曾撬门救下沈清辞，而这段记忆后来被许知衡的身影覆盖。
  new_value: 他确认许知衡对自己化学竞赛履历了解过细，不只是普通“久仰”；他还凭碘液痕迹、显色纸常识和封闭路线判断化学楼参观图不干净，并发现许知衡留下的水瓶有与顾母旧线相似的蓝色压痕。
- character: 许知衡
  field: knowledge_state
  old_value: 第40章里，他主动把话题引到“第一个开门的人”，精准刺激南门器材室记忆，说明他至少知道这枚记忆钉对沈清辞的信任结构很重要。
  new_value: 他试图用“以前”、送水和父辈合作关系重启沈清辞对自己的熟悉感，也把顾夜舟引向化学实验楼旧试剂准备室；但顾夜舟当场识破路线图异常。
- character: 李佳佳
  field: knowledge_state
  old_value: 明面上只知道沈清辞和顾夜舟关系越来越微妙，也知道顾夜舟不像传闻里那么难相处。
  new_value: 她撞见沈清辞、顾夜舟和许知衡在空教室门口的异常气氛，虽然仍按八卦方式理解，但已经再次站到关键现场边缘。
new_information_revealed:
- 许知衡与沈清辞当前线重生前已有父辈合作关系下的饭局交集，不是凭空出现的陌生人
- 顾夜舟省化学竞赛一等奖、红榜第一的明面履历足够支撑许知衡“久仰”
- 许知衡或其背后的人能拿到带有碘液显色痕迹的实验楼路线图，并把参观路线指向封闭两年的三楼旧试剂准备室
- 许知衡递来的水瓶瓶底有极浅蓝色压痕，可能与顾母旧工作牌、B-17和第三方蓝色圆戳线相连

chapter_number: 41
title: 他不只会冷脸
summary: 许知衡站到空教室门外，以关心沈清辞为名继续试探两人，并借“以前”这个词勾出沈清辞与许家父辈合作关系下的早期交集。沈清辞当面划清边界，顾夜舟则用省化学竞赛红榜和实验路线图里的碘液痕迹反击许知衡的“久仰”与化学楼参观安排。章尾，顾夜舟发现许知衡递来的水瓶瓶底有极浅蓝色压痕，疑似与顾母旧工作牌和B-17线相连。
events:
- 许知衡在空教室门外敲门，以老师关心和送水为理由出现
- 沈清辞和顾夜舟稳住刚刚的双向记忆回流，没有在许知衡面前暴露系统或完整记忆线
- 许知衡提到“以前”头疼习惯，触发沈清辞回想沈家与许家合作饭局，以及重生前当前线两人并非陌生人的关系
- 系统提示父辈合作关系与低强度信任锚点残留，沈清辞当面划清“合作伙伴之子不等于亲戚”的边界
- 许知衡用顾夜舟省化学竞赛一等奖、红榜第一解释“久仰”，顾夜舟反问红榜三个月前已撤，逼出许知衡提前打听自己的嫌疑
- 许知衡递出化学实验楼参观路线图，试图把顾夜舟引向三楼旧试剂准备室
- 顾夜舟凭纸角碘液痕迹和显色纸常识，指出路线图来路不干净，旧试剂准备室也不应出现在参观路线里
- 沈清辞决定和顾夜舟一起去实验楼，不让许知衡单独把顾夜舟引走
- 李佳佳赶来通知集合，撞见三人气氛异常并吐槽“口供没对上”
- 顾夜舟发现许知衡留下的水瓶瓶底有极浅蓝色压痕，联想到顾母旧工作牌和B-17抽屉里的蓝色圆戳痕迹

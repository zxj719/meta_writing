chapter_number: 42
title: 这门不该开
summary: 沈清辞、顾夜舟、许知衡和联校队伍进入化学实验楼，顾夜舟发现三楼旧试剂准备室的封闭提示是当天新贴的，进一步确认参观路线异常。旧试剂味、碘液显色和蓝色标签纸连续触发沈清辞与顾夜舟的双向碎片：沈清辞听见“每选错一扇门，你就会少记得我一点”，顾夜舟听见“她会忘掉你”。章尾实验楼管理员赶来，说三楼封闭区门锁响了、监控黑了一分钟，许知衡疑似用滴管敲击回应暗号，三楼方向传来门开的声音。
events:
- 联校队伍进入化学实验楼，门口安全守则上的学生涂鸦提供轻松缓冲
- 顾夜舟发现三楼旧试剂准备室封闭提示胶带很新，判断它是当天才贴的
- 沈清辞闻到旧试剂和潮湿纸张气味，出现现实触发后的短暂闪回，看见三楼走廊、湿纸、蓝色圆戳和“别选这扇门”的声音
- 顾夜舟及时扶住沈清辞，第一次用“你看见了？”而非“不舒服吗”逼近她的回线真相
- 许知衡在楼梯平台继续以温和语气试探，顾夜舟用“替她挡麻烦”当面回击
- 二楼显色实验前，顾夜舟从垃圾桶里找到半张带“控”字边缘的蓝色标签纸
- 李佳佳用关于米饭和淀粉的离谱问题吸引老师注意，帮助顾夜舟藏起标签纸
- 碘液显色变成蓝紫色时，沈清辞听见“每选错一扇门，你就会少记得我一点”
- 顾夜舟右手虎口疼痛并听见锁芯声，短暂看见上一条线里自己站在三楼旧试剂准备室门前，门缝渗出蓝光，有人说“她会忘掉你”
- 两人交换各自听见的碎片，系统提示双向碎片重叠，记忆稳定度升至34%
- 顾夜舟没有说破回线，只让沈清辞以后听见类似话先看他，确认他还在
- 实验楼管理员赶到，说三楼封闭区门锁响了且监控黑了一分钟
- 许知衡用滴管轻敲两下，三楼方向随即传来门开的声音

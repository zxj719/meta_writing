  field: knowledge_state
  old_value: 第41章后，她确认当前线重生前自己与许知衡确有父辈合作饭局交集，这类体面关系曾被用作信任锚点；她也知道许知衡正试图借化学实验楼参观路线把顾夜舟引向三楼旧试剂准备室。
  new_value: 她通过旧试剂味、蓝色圆戳和碘液显色触发新的记忆碎片，知道“选错门”可能会让自己少记得顾夜舟；她也确认二楼出现带“控”字残片的蓝色标签纸，三楼封闭区门锁与监控同时异常。
- character: 顾夜舟
  field: knowledge_state
  old_value: 第41章后，他确认许知衡对自己化学竞赛履历了解过细，也识破实验楼路线图里碘液显色纸痕迹和三楼旧试剂准备室路线异常；他还发现许知衡递来的水瓶有蓝色压痕。
  new_value: 他从二楼垃圾桶里拿到带“控”字边缘的蓝色标签纸，确认蓝色圆戳线已经进入实验楼；他还通过虎口疼痛和锁芯声触发短暂闪回，听见“她会忘掉你”，从而进一步怀疑沈清辞经历过另一个结局。
- character: 许知衡
  field: knowledge_state
  old_value: 第41章里，他试图用“以前”和送水重启沈清辞对父辈合作关系的熟悉感，也把顾夜舟引向旧试剂准备室，但被顾夜舟识破路线图异常。
  new_value: 他继续观察沈清辞和顾夜舟的双向碎片反应，并疑似用玻璃滴管敲击回应三楼封闭区门锁异常，显示他与旧试剂准备室门内外的异常存在更直接联系。
- character: 李佳佳
  field: knowledge_state
  old_value: 第41章里，她撞见沈清辞、顾夜舟和许知衡在空教室门口气氛异常，判断为“口供没对上”，再次站到关键现场边缘。
  new_value: 她虽然仍以搞笑方式参与，但已经能在沈清辞指令下立刻配合，利用离谱问题转移老师注意力，成为可靠的信息与掩护节点。
new_information_revealed:
- 三楼旧试剂准备室的封闭提示可能是当天新贴，封闭状态本身有问题
- 二楼实验室出现带“控”字边缘的蓝色标签纸，与B-17、蓝色圆戳、水瓶压痕同源可能性上升
- 沈清辞的记忆代价与“选错门会少记得顾夜舟”有关
- 顾夜舟已开始明确把沈清辞的失态、预判和共同碎片串联到回线猜测上
- 许知衡可能不只是知道旧线，而是能与旧试剂准备室门锁异常产生同步动作

chapter_number: 21
title: 他爸不仅活着，还想给他布置人生作业
summary: 旧楼里的第二批档案把“顾启明就是X”这件事彻底从猜测推成了事实，顾夜舟甚至在观察记录里看见了自己被当成样本的痕迹。两人刚带着关键资料撤出旧楼，就收到了顾启明发来的消息，对方直接以“爸爸”的身份向顾夜舟摊牌。这个疯子不仅活着，还主动宣布下一轮见面由他定地方。

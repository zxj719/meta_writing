chapter_number: 57
title: 三成也够反打
summary: 老公寓围剿继续，青鲤、荒川、钟塔和旧港觉醒回流约三成，却坚持要在顾夜舟赶到前把训练场围剿者打出去，理由是大家都被削弱过，没必要怕谁。沈清辞说服顾夜舟给旧部两分钟，不把他们当易碎品；顾夜舟在沈清辞监护下只铺路不全盘接管，远程稳住青鲤水刃、停住致命攻击瞬间、压住敌方能力链路，让旧部自己完成反攻。青鲤、荒川、钟塔、旧港各自恢复一部分能力配合，击退训练场成员并记录撤退车牌；顾夜舟完成第一次十分钟高控，系统提示当前输出约为旧线巅峰十分之一，随后出现虎口旧伤、记忆回流和网心疲劳反噬。沈清辞决定把顾夜舟和旧部一起接回沈宅，理由是老公寓已被定位，三成觉醒够反打但不够抗连环阴招。顾夜舟和旧部都不好意思接受，沈清辞用一个落在顾夜舟唇角的吻让他闭嘴答应，旧部喜闻乐见。另一边，温在撤离车上确认围剿试探失败，但李佳佳身上的灰蓝毒点已种下；他向同伴透露这不是普通毒，而是走器官污染路径，会贴在稳定系能力上，等李佳佳下一次主动安抚别人时往里开，其路径像当年陆闻川妹妹那种。温还提到教他制毒的人喜欢这种慢法子，暗示那个人与害死陆星禾的污染有关。章尾沈清辞准备带众人回沈宅，并和沈父就保护组、异控局、顾澜坐标等问题进行严肃谈话。
events:
- 老公寓围剿继续，旧港检测到旧部觉醒回流约三成
- 青鲤、荒川、钟塔、旧港要求在顾夜舟赶到前自己把敌方打出去，否则太丢人
- 沈清辞劝顾夜舟给旧部两分钟，不要把他们当易碎品
- 顾夜舟在沈清辞接触监护下维持高控状态，只替旧部稳住关键环境和攻击空隙，不全盘接管战场
- 青鲤借顾夜舟稳住的水线完成水刃反击，割断敌方控制扣
- 荒川逐渐找回身体坐标和力量控制，接上近身反击
- 钟塔感知恢复，准确报点并打断敌方意念冲击
- 旧港用断耳通讯器爆发旧线回音，反制试图让他失声的敌方能力
- 训练场成员意识到旧部三成觉醒也足够反打，开始撤离
- 顾夜舟判断让敌方带伤回去比死在这里有用，沈清辞及时把他从上一条线冷酷判断里拉回
- 旧部完成反攻并记录撤退车牌，敌方被击退
- 顾夜舟第一次十分钟高控结束，系统提示当前输出约为旧线巅峰十分之一，并出现反噬预警
- 沈清辞和秦越扶住高控结束后的顾夜舟，旧部试图装作自己没事但战损明显
- 沈清辞决定把顾夜舟和旧部全部接回沈宅保护
- 顾夜舟和旧部试图拒绝，沈清辞用一个吻让顾夜舟答应，旧部集体磕到
- 温在撤离车上确认试探失败，但李佳佳灰蓝毒点已种下
- 温透露李佳佳所中毒走器官污染路径，会贴在稳定系能力上，下一次主动安抚别人时往里开
- 温同伴指出这一路径像当年陆闻川妹妹的情况，温暗示教他制毒的人喜欢这种慢法子
- 沈清辞准备回沈宅后与沈父严肃谈话，涉及保护组、异控局和顾澜坐标

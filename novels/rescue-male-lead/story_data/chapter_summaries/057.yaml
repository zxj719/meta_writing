new_information_revealed:
- 旧部当前觉醒回流约三成，但三成已经足够在顾夜舟辅助下反攻被削弱的训练场成员
- 顾夜舟第一次十分钟高控只相当于上一条线巅峰十分之一
- 高控结束会带来记忆回流、虎口旧伤和网心疲劳等反噬
- 沈清辞可以用亲密动作和明确安排让顾夜舟从高压控制逻辑里退出来，旧部对此喜闻乐见
- 沈宅将成为下一阶段旧部、李佳佳和顾夜舟的临时保护点
- 李佳佳所中灰蓝毒点会贴在稳定系能力上，等她下一次主动安抚别人时深入
- 李佳佳毒点的器官污染路径与陆闻川妹妹陆星禾当年的情况相似
- 温的制毒老师疑似与当年害死陆星禾的异能污染有关

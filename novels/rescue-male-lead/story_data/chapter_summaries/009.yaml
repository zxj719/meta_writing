chapter_number: 9
title: 他脑子里全是草莓牛奶
summary: 收到威胁后，沈清辞没有慌着对顾夜舟摊牌，而是把注意力重新放回他本身。她借读心术和日常观察，隐约摸到顾夜舟家里还有更深的伤痕，于是用早饭、笔记和几句护场把距离继续往前推。晚自习后，顾夜舟第一次认真问她“你知道这是什么意思吗”，又在递笔记时轻轻碰了她的手背。
events:
- 沈清辞保留X的威胁短信，没有立刻告诉顾夜舟
- 沈清辞带着常温草莓牛奶和早餐来学校，发现顾夜舟手背有新伤
- 沈清辞用读心术读到顾夜舟关于早餐和伤口的表层念头，并闪过一段家庭创伤碎片
- 数学课上沈清辞帮顾夜舟从讲台卷子堆里翻出作业，替他挡了一次无谓的点名
- 午饭和晚自习间隙，沈清辞继续用日常照顾和笔记拉近关系
- 晚自习后顾夜舟第一次认真追问她“管到这儿是什么意思”
- 顾夜舟递还笔记时轻碰沈清辞手背，关系进一步升温

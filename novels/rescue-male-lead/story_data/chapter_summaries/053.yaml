new_information_revealed:
- 许知衡上一条线并非完全站在实验室利益上，他也曾被实验室体系盯上作为高价值能力样本
- 许知衡的记忆完整度和异能觉醒速度正在上升，他可以主动篡改/回写部分流程数据
- 陆闻川和许知衡的阵营裂缝进入行动层面，不再停留在短信争执
- 旧港通讯器显示内容可来自过去或未来，是预知与回溯能力的外在表现
- 旧港巅峰时能看见一年内多个选择分支，但因死亡分支过多和蝴蝶效应创伤，不敢贸然说出未来
- 旧港认为“团体访谈加外部干扰”只是黄线，并且咨询室侧门会出现未知变量

chapter_number: 53
title: 心理咨询室半日游
summary: 下午心理访谈开始，沈清辞、顾夜舟、李佳佳按广播前往医务楼心理咨询室。陆闻川布置了带低频蓝色标记的温和咨询场，试图按个体访谈流程把三人拆开；沈清辞以高三时间宝贵为由要求团体访谈，顾夜舟用系统提示的“保持队形”配合，李佳佳继续以普通女高嘴炮拖节奏。陆闻川准备强行推进个体访谈时，临川附中端的校际心理支持系统突然回写数据，把三人的异常档案改成普通高三压力档案，并把建议形式改成团体支持，陆闻川被迫改流程。切到许知衡视角，他在附中空教室里想起更多上一条线记忆，确认自己曾有策略席权限，且实验室体系曾试图把他的信任诱导能力纳入样本评估；他因此对陆闻川和实验室没有忠诚，主动越权改写流程，警告陆闻川不要碰李佳佳和逼醒沈清辞。咨询室里陆闻川继续团体访谈，试图观察李佳佳的安抚能力，李佳佳低功率稳定沈清辞，但系统提示持续使用会疲惫。陆闻川被教务系统冲突叫出门。后半段转到旧港，他的通讯器显出类似游戏路线的分支界面：顾夜舟单独访谈、李佳佳单独访谈均为红线，团体访谈加外部干扰为黄线，旧港提前说明终局记录为黑线。旧港回忆自己巅峰期能看见一年内多个选择通向的未来，却因曾经提前提醒导致更多人死亡而害怕蝴蝶效应，只敢让青鲤转发“访谈别分开”。章尾顾夜舟收到青鲤消息，咨询室侧门突然转动，未知变量接近。
events:
- 沈清辞、顾夜舟、李佳佳进入医务楼心理咨询室，陆闻川准备按个体访谈拆开三人
- 系统提示“保持三人队形”，沈清辞把提示写给顾夜舟
- 陆闻川的平板被临川附中端数据回写，三人的异常档案被改写成普通高三压力档案，访谈形式变成团体支持
- 陆闻川发现回写人是XZH，被迫暂时接受团体访谈
- 许知衡在附中空教室回忆上一条线里自己曾被实验室评估为可采样对象，确认自己对实验室体系和陆闻川没有忠诚
- 许知衡与陆闻川短信交锋，明示自己不会任由陆闻川碰李佳佳或把自己当执行工具
- 陆闻川在团体访谈中试探三人的睡眠、压力和李佳佳的头痛/安抚相关反应
- 李佳佳低功率使用治愈/稳定能力压住沈清辞的蜂鸣，系统提示持续过久会疲惫
- 陆闻川因教务系统数据冲突暂时离开心理咨询室
- 旧港通讯器显示心理咨询室分支路线，说明其能力能看到过去或未来的路线残片
- 旧港回忆巅峰期可看见一年内选择分支，但因曾经提前提醒导致更多人死亡而不敢直接说未来
- 旧港让青鲤只给顾夜舟发“访谈别分开”，暂不告知双二十四岁终局记录
- 章尾咨询室侧门门把手转动，旧港所见“未知变量”接近

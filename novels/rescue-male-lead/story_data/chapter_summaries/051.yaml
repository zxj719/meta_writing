new_information_revealed:
- 顾夜舟上一条线救青鲤时直接掀翻旧港地下三层拍卖场，印证他旧部势力来自亲手救下的幸存者
- 顾夜舟上一条线曾长期在沈清辞不知情时远程保护她，解释旧部为何唏嘘当前线的正式名分
- 旧部白天不会进入校园，而是在老公寓适应当前线身体状态、整理上一条线情报
- 当前校园时间推进到高考冲刺一百天，成人礼之后紧接百日誓师
- 清舟目标学校同为京州大学，分别是金融和化学，形成后续大学线的情感与剧情锚点
- “苏晚宁”对外宣称身体原因休学，镜面壳体从公开校园场退到幕后
- 陆闻川不再只通过许知衡和流程间接推进，而是亲自以百日冲刺心理摸排接管镜面与筛查线

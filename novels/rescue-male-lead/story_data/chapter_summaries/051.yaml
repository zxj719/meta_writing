chapter_number: 51
title: 一百天和一张便利贴
summary: 本章以青鲤视角闪回上一条线：她曾在旧港地下三层的异能者拍卖水箱里被顾夜舟救下，见过他雷霆手段和只让幸存者“先活”的菩萨心肠，也见过他上一条线在医院外远远保护沈清辞却不敢靠近。当前线早晨，顾夜舟安排青鲤、荒川、钟塔、旧港留在老公寓适应身体、整理上一条线地下城和样本流转情报，旧部则调侃他这一线已经拥有正式名分。学校时间推进到高考冲刺一百天，成人礼刚过便进入百日誓师，班主任让全班写心仪大学和鼓励语贴在桌角；沈清辞写“京州大学，金融”，顾夜舟写“京州大学，化学”，两人的未来目标第一次被放到同一座城市。广播宣布苏晚宁因身体原因休学，系统提示镜面线公开壳体下线、执行层级上移。操场百日誓师上，许知衡和附中代表完成发言准备离校，沈清辞和顾夜舟以轻松嘴仗送客。章末切到顾夜舟老公寓，旧部整理地下城、强者至上派和心理筛查相关旧线信息；医务楼里陆闻川亲自把“苏晚宁”病休和镜面线包装成百日冲刺心理支持对象，正式接管百日冲刺心理摸排名单，沈清辞、顾夜舟、李佳佳三人被点名进入新流程。
events:
- 青鲤回忆上一条线自己被关在旧港地下三层水箱拍卖场，顾夜舟砸毁拍卖场救下她和其他幸存者
- 闪回补出上一条线顾夜舟远远保护沈清辞，送文件、伞、热粥和安保名单，却因沈清辞不想见他而不靠近
- 当前线早晨，顾夜舟在老公寓要求青鲤、荒川、钟塔、旧港白天不出门，先适应身体坐标并整理上一条线重要情报
- 旧部调侃当前线顾夜舟已经拥有正式名分，比上一条线远程送文件强得多
- 临川一中进入高考冲刺一百天，班主任让全班写目标大学和鼓励语贴在桌角
- 李佳佳已经适应沈家临时保护生活，并用富家女体验继续制造轻松氛围
- 沈清辞写下“京州大学，金融”，顾夜舟写下“京州大学，化学”，两人共同目标城市形成新的情感锚点
- 广播宣布苏晚宁因身体原因休学，沈清辞和顾夜舟判断镜面壳体被藏起，陆闻川会亲自接手
- 系统提示镜面线公开壳体下线、危险执行层级上移
- 许知衡和其他附中代表完成百日誓师分享后准备离校，许知衡收到镜面壳体公开休学、后续由陆闻川接管的提示
- 旧部在老公寓整理地下城、样本流转、强者至上派训练场和心理筛查相关旧线信息，旧港通讯器捕捉到门、S-QC、镜面、心理筛查等模糊回音
- 陆闻川在医务楼心理咨询室把“苏晚宁”病休文件与镜面线改写成百日冲刺心理支持对象，亲自接管心理摸排流程

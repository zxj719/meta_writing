chapter_number: 6
title: 回头再说
summary: 沈清辞使用读心术触碰顾夜舟，感受到他内心深处"她为什么总挡在我前面，这样会被牵连"的念头，系统提示好感度+2。她没有正面回答他的追问，反而抛出一句模糊的试探，但对话被教务处的紧急传唤打断。顾夜舟临走前留下"回头再说"的承诺，沈清辞独自消化这份复杂的情绪，最终走向天台。

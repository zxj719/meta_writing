chapter_number: 6
title: 走廊对峙
summary: 沈清辞在走廊被顾夜舟质问是否能看穿他，她放弃使用读心术而选择坦诚，直言顾夜舟“不想伤害任何人”击中其心理防线。她暗示自己是“先回来”的，承诺这一次不会再让他独自走向毁灭。

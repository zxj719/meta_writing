chapter_number: 6
title: 习惯就好
summary: 沈清辞与顾夜舟下楼同行，她注意到他袖口的草莓牛奶印渍，两人穿过议论的人群时顾夜舟说"习惯就好"。沈清辞帮戴眼镜男生扶作业本时用了微感，被顾夜舟察觉并试探。最后顾夜舟坦白牛奶没扔，要"回家再扔"，好感度提升至20。
events:
- 沈清辞注意到顾夜舟袖口上的草莓牛奶印渍，他不在意地继续走
- 两个低年级女生议论顾夜舟"昨天被围堵"的事，说他"眼神阴得吓人"
- 顾夜舟说"习惯就好"，沈清辞追问是习惯被议论还是习惯被用那种眼神看
- 沈清辞指出顾夜舟袖子脏了，建议他擦一下
- 顾夜舟只蹭了两下袖口就说"又不是什么大事"，还说沈清辞观察仔细
- 戴眼镜男生撞到沈清辞，她用微感确认对方不是故意的
- 顾夜舟察觉沈清辞碰到男生时"眼神变了"，追问她用了什么
- 沈清辞用"直觉"搪塞，顾夜舟评价她"直觉总是特别准"
- 顾夜舟主动坦白昨天那盒牛奶没扔，要"回家再扔"
- 系统提示好感度+2，当前20/100；任务"让他主动说点什么"完成

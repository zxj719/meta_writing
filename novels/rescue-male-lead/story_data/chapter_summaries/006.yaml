chapter_number: 6
title: 那盒牛奶我没扔
summary: 沈清辞没有正面回应顾夜舟“你是不是能看穿我”的试探，而是借他袖口上的草莓牛奶印渍把话题带开。顾夜舟主动承认昨天那盒牛奶没扔，沈清辞因此更确定他在认真接住自己的善意。后半章里她借系统刷出的日常任务，坐到他身边递上新的牛奶，两人的距离第一次在日常场景里自然缩短。
events:
- 顾夜舟试探沈清辞是不是总能“看穿”自己，沈清辞用袖口上的草莓牛奶印渍把话题岔开
- 沈清辞故意提起草莓牛奶盒，指出顾夜舟根本没把自己的痕迹藏起来
- 顾夜舟在走廊里主动说出“那盒牛奶我没扔”
- 系统发布二十四小时内完成身体接触对话的日常任务
- 沈清辞拿着新的草莓牛奶坐到顾夜舟旁边，借聊苏晚宁的事把相处时间拖够
- 沈清辞替他插好吸管、拍了拍他肩膀，顾夜舟没有躲，还当场把牛奶喝了
- 沈清辞回想上一世时，不再把自己简单归因为愚蠢，而是隐约意识到自己曾被许知衡那条线牵引并忽略了顾夜舟
characters_present:

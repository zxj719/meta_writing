chapter_number: 36
title: 成人礼感想八百字，谁家旧案塞在牛皮纸袋里
summary: 顾夜舟认出旧工作牌属于母亲后，沈清辞先把他从失控边缘拉回成人礼散场后的普通校园秩序里。班主任突然要求全班写八百字成人礼感想，让高三（七）班重新回到吵闹又真实的日常，沈清辞和顾夜舟也在写感想、传纸条和系统吐槽之间暂时稳住情绪。沈清辞触碰旧工作牌时出现短暂共振，看见顾母当年在旧礼堂设备柜前被人称作“顾女士”，并听见“别让他站到光里”的提示。放学前后，两人顺着工作牌背面的“礼堂三楼、放映间、B-17”去了旧放映间，却发现B-17抽屉已经被人提前清空，只留下半枚带“控”字边缘的蓝色圆戳贴纸。章节结尾，门外出现两个不明人士的低声交谈，确认B-17已被拿走，也确认他们已经看见沈清辞和顾夜舟，却暂时不准备动手。
events:
- 顾夜舟认出旧工作牌属于母亲，沈清辞先把证物收住，避免他在成人礼现场情绪失控
- 班主任要求全班写八百字成人礼感想，高三（七）班从成人礼高光切回普通校园日常
- 沈清辞和顾夜舟一边写感想一边传纸条，约定写完后一起去礼堂三楼放映间
- 沈清辞触碰旧工作牌时出现短暂共振，看见顾母当年在旧礼堂设备柜前被称作“顾女士”
- 共振画面里出现“别让他站到光里”的旧提示，说明顾母当年已经意识到舞台光源和目标站位之间的危险
- 两人放学前潜入礼堂三楼旧放映间，找到B-17抽屉，但里面的东西已经被提前取走
- 抽屉里残留半枚带“控”字边缘的蓝色圆戳贴纸，进一步加深第三方组织痕迹
- 门外两个不明人士低声确认B-17已经被拿走，并说“那两个学生”已经被看见，但先别动他们

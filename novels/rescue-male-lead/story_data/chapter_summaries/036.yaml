state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 到第35章末，她不仅判断出“周启”“宋雾”这条线未必属于陆闻川，也拿到了顾母旧设备组工作牌这件实体物证，意识到顾夜舟母亲与当前成人礼舞台线之间可能早就有更深的连接。
  new_value: 她通过旧工作牌触发短暂共振，确认顾母当年被称作“顾女士”，并且早就知道某种舞台光源和站位会带来危险；她还确认B-17已经被第三方提前取走，现场残留的“控”字圆戳不是学校体系痕迹。
- character: 顾夜舟
  field: emotional_state
  old_value: 他已经能在所有人的视线里和沈清辞并肩站着，也会在她累了、被围得喘不过气时主动把人带走。可旧工作牌一出现，他心里那条和母亲有关的旧伤被再次扯开，表面越冷，底下那股压着的情绪就越沉。
  new_value: 他因为母亲旧物再次被戳中旧伤，但没有像过去那样立刻独自冲出去，而是在沈清辞的干预下先坐回教室、写完成人礼感想，再和她一起查放映间。
new_information_revealed:
- 顾夜舟母亲当年被人称作“顾女士”，并参与过旧礼堂设备组或类似设备流程
- 顾母当年曾留下“别让他站到光里”的关键信息，和当前成人礼追光站位局形成呼应
- B-17对应的东西已经被第三方提前拿走，第三方看见了沈清辞和顾夜舟，但暂时选择不动他们
- 现场残留的蓝色圆戳只剩“控”字边缘，暗示更干净、更克制的第三方组织痕迹正在浮出

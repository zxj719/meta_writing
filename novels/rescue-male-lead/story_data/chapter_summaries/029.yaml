chapter_number: 29
title: 这位陆医生，笑得像提前写好病历
summary: 陆闻川没有继续躲在旧楼和档案后面，而是以心理干预专家的身份堂而皇之地走进了校园。越是站在阳光底下，他那种温柔无害就越让人发毛。顾夜舟靠本能察觉到他体内那种“表面太整齐”的异常，而顶着苏晚宁身份的女生则在恐惧中继续向沈清辞递出求救和示警，最终用一张快撑不住的镜面照片，把真正的摊牌约到了中午。
events:
- 学校论坛和通知都在讨论新来的心理干预专家，陆闻川正式进校
- 顾夜舟在日常状态下持续陪在沈清辞身边，并对陆闻川表现出强烈警惕
- 顶着苏晚宁身份的女生继续在学校活动，却私下给沈清辞塞纸条约她中午见面
- 陆闻川借走廊短暂交谈试探沈清辞最近是否总做梦，并主动邀她去心理室
- 顾夜舟意识到陆闻川知道沈清辞太多不该被他知道的事
- 陌生号码发来镜面反光照片，证明“苏晚宁”的脸已经不稳定到连照片都快兜不住

chapter_number: 55
title: 十分钟控制权
summary: 心理咨询室灰蓝污染继续推进，陆闻川试图借空气指标异常把沈清辞、顾夜舟和李佳佳转入单独观察室，但系统读出污染诱导项为转场、单独、观察和自愿签署。沈清辞用“男朋友权限冻结”把顾夜舟从污染勾起的旧观察室记忆里拉回来，秦越则用监护人授权、校方流程和现场封控持续打断陆闻川。污染逼近时，顾夜舟的控制权异常跃迁，先控住金属、液体和悬浮颗粒，再用一句“停”定住伪装校工，随后进一步触碰到控制能力链路的阶段；系统提示临时控制态可持续十分钟，但失控风险很高，必须由沈清辞保持接触监护。与此同时，顾夜舟作为顾网网心感知到青鲤、荒川、钟塔和旧港四个契约生命点同时闪红，老公寓遭到强者至上训练场其他成员围剿。温趁污染派伪装校工刺向李佳佳，却撞上秦越这个力量/速度型觉醒者，被秦越重创后靠战场经验堪堪逃走；临走前一粒灰蓝毒粉落到李佳佳袖口内侧，成为后续伏笔。顾澜通过秦越通讯器承认旧部恢复慢也是计划的一部分，高危环境更容易激发潜力，清辞在顾夜舟身边她才敢坑儿子。章尾旧港通讯器显示老公寓围剿中、四个生命点全红、07网心控制态倒计时09:59，沈清辞握住顾夜舟的手，准备监护他进入下一场。
events:
- 灰蓝污染继续压入心理咨询室，陆闻川借空气异常提出转入隔壁观察室做单独体征记录
- 系统读出污染诱导关键词为转场、单独、观察和自愿签署，警告不要在污染场内作出分离承诺
- 沈清辞通过共感察觉顾夜舟被污染勾起旧观察室记忆，用言语和接触把他拉回现实
- 秦越用封缝胶、检测器、电子授权和监护人流程压住陆闻川转场要求，陆闻川被多次打断后气笑
- 顾夜舟在登记表写下拒绝单独转场，三人共同撤离和监护人在场的要求
- 系统提示李佳佳自愿留下协助安抚属于高风险诱导项，沈清辞制止李佳佳继续过度使用初醒稳定能力
- 顾夜舟控制权异常跃迁，先控住咨询室内金属、液体、悬浮颗粒和灰蓝雾，展现控物阶段
- 伪装校工以氧气袋为名进入咨询室，顾夜舟用“停”强行定住其身体，展现控人阶段
- 系统提示顾夜舟进入控制能力链路阶段，临时控制态预计持续十分钟，失控风险高，需要S-QC保持接触监护
- 顾夜舟作为顾网网心感知老公寓旧部生命点遭威胁，青鲤、荒川、钟塔、旧港四点同时闪红
- 伪装校工弹出细针试图刺向李佳佳，被顾夜舟停住并被秦越以速度和力量压制
- 秦越被系统判定为力量/速度型觉醒者，且未检测到回线残留，说明他不是重生者而是当前线实打实觉醒的强战力
- 温在医务楼侧廊现身，因事先不知道秦越到场被秦越重创，但凭上一条线战场经验和毒粉脱身
- 温逃离时一粒灰蓝粉末落到李佳佳袖口内侧，在她腕骨附近留下几乎看不见的小点
- 顾夜舟触发旧港地下三层闪回，想起上一条线自己曾控制物、身体、能力和扣扳机的念头
- 顾澜通过秦越通讯器承认老公寓口子是计划的一部分，用高危环境激发旧部和07潜力
- 旧港通讯器经青鲤转发，显示老公寓围剿中、契约生命点四红、07网心控制态倒计时09:59

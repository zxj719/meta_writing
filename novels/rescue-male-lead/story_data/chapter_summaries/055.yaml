new_information_revealed:
- 顾夜舟控制权的具体层级可从控物推进到控人，再推进到控制能力链路，当前只能短暂开启且失控风险极高
- S-QC与顾夜舟接触可作为控制态监护锚点，沈清辞在场是顾澜敢推进高危刺激的关键条件
- 顾夜舟作为顾网网心能感知契约者生命点，旧部受围剿会直接刺激他的能力回归
- 秦越不是回线者，而是当前线未被打断过、实打实逐步觉醒的力量/速度型强战力
- 温来自强者至上训练场，虽然当前线异能被法器削弱太多，但作为上一条线战场老人仍能在秦越手下逃走
- 旧部恢复慢并不只是削弱代价，也是顾澜计划里的激发条件，高危环境会推动旧部和07一起醒
- 李佳佳袖口内侧被灰蓝毒粉落点污染，当前无人真正注意到，后续可作为下下伏笔章回收
- 强者至上训练场其他成员已开始围剿顾夜舟旧部，老公寓线从复健汇报升级为即时战场

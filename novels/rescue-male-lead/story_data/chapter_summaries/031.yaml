chapter_number: 31
title: 躲陆闻川躲到后台，差点被当成早恋
summary: 老体艺馆女厕门外的陆闻川几乎要把沈清辞和林雾逼到无路可退，关键时刻，一张写着“西窗，三十秒，别出声”的纸条把两人从坏掉的西窗引了出去。带路的人是高三二班那个几乎没人记得住脸的器材室值日生陈渡，他腕上的旧针孔疤和对陆闻川的熟悉，直接把“幸存样本”这条暗线送到了两人面前。陈渡把她们带进成人礼后台，顾夜舟也顺着沈清辞书包定位追了过来，两人躲在礼服架后差点被老师当成偷偷早恋的小情侣抓现行。更要命的是，陈渡递出的成人礼流程表上，陆闻川已经把自己写进了学校彩排和摸排联动里，而“苏晚宁”的名字也出现在礼服试装志愿者名单上——真正的换脸戏，恐怕要在成人礼那天正式开场。
events:
- 陆闻川堵在老体艺馆女厕门外，试图把沈清辞带去医务室
- 沈清辞和林雾收到匿名纸条提示，从西窗翻出女厕脱身
- 器材室值日生陈渡现身带路，把她们引进老礼堂后台
- 陈渡以腕上的旧针孔疤和只言片语证明自己是被忽略掉的幸存样本
- 顾夜舟顺着沈清辞书包定位赶到后台，与她一起躲进礼服架后
- 两人躲避搜查时差点被老师误认成后台偷偷早恋的高三情侣
- 陈渡拿出成人礼彩排联动表，指出陆闻川已经把自己嵌进学校流程
- 流程表上的“苏晚宁”志愿者名字证明真正的换人节点很可能就在成人礼

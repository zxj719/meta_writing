state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 第39章后，她确认许知衡身上存在信任诱导/魅惑类异常，读心术只能从他身上读出不完整碎片“她看我的眼神不对”；她也知道许知衡线已经接触到07编号。
  new_value: 她进一步知道自己上一世关于南门器材室的关键记忆存在覆写痕迹；许知衡可能偷走或顶替了顾夜舟曾救她的“开门”契机，黑伞、草莓牛奶、虎口伤和“别怕，门开了”成为可追查的记忆锚点。
- character: 顾夜舟
  field: knowledge_state
  old_value: 第39章后，他知道沈清辞对许知衡反应异常，也看见许知衡递来的安排表背面出现07浅痕；目前还不知道他与沈清辞上一世的具体关系。
  new_value: 他通过梦境看见上一世羁绊源头：沈清辞曾在他被围观羞辱时说“他是人”，又给他草莓牛奶和创可贴；他也记起自己曾在雨夜撬开器材室门救过沈清辞，并意识到这段记忆可能被许知衡覆盖。
- character: 许知衡
  field: knowledge_state
  old_value: 第39章读心碎片显示他察觉沈清辞看他的眼神不对；当前线暂不明确他是否知道沈清辞已经回线，也不明确他是否保留前世偏差。
  new_value: 他在讨论中精准抛出“开门的人”这一记忆关键词，说明他至少知道南门器材室事件对沈清辞的重要性；章尾主动来到空教室门外，继续压迫这段刚松动的记忆。
new_information_revealed:
- 上一世顾夜舟保护沈清辞并非无缘无故，最早的情感源头之一是沈清辞曾在他被当成怪物围观时，把他重新拉回“人”的位置
- 草莓牛奶并非当前线才出现的轻松梗，它在上一世也曾作为沈清辞和顾夜舟之间的救命记忆锚点存在
- 许知衡让沈清辞相信自己的关键契机，可能是从顾夜舟那里偷走或篡改来的“开门救人”记忆
- 沈清辞的记忆被覆写不是全覆盖，而是保留了手、伞、雨声、虎口伤等低频残留
- 顾夜舟也能被回线机制影响，出现与沈清辞同源的双向记忆回流

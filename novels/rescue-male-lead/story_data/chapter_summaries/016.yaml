chapter_number: 16
title: 你先看着我
summary: 临时稳定技能解锁后，沈清辞几乎是凭本能抓住顾夜舟，一遍遍把他从失控边缘往回拽。那一刻她顾不上系统，也顾不上自己会不会被波及，只能用最笨也最直接的话让他把视线重新落回自己身上。等风暴终于压下去，顾夜舟和苏晚宁都被迫承认了一件事：沈清辞已经成了这条线里最不能被抽走的人。

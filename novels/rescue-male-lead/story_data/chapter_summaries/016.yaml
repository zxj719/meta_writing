- 沈清辞近距离抓住顾夜舟，用重复而清晰的话把他往现实里拉
- 顾夜舟在她的声音和触碰里一点点稳下来，没有真的彻底失控
- 现场危机过去后，苏晚宁也被这次阵仗吓清醒，明确表示不想再替X做事
- 顾夜舟第一次在真正意义上接受了沈清辞救了自己这一事实

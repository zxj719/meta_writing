chapter_number: 19
title: 你别再管我了
summary: 门禁卡照片一出来，顾夜舟立刻变了脸，直接让沈清辞删掉照片、停下调查，第一次把她推到了自己划出来的线外。沈清辞不肯退，两人也因此迎来了第一次真正意义上的正面争吵。等顾夜舟一个人离开后，苏晚宁又急匆匆把消息递过来，提醒沈清辞他去了旧仓库区。
events:
- 顾夜舟看完带有“顾启明项目组”的照片后要求沈清辞删掉线索
- 沈清辞拒绝停手，和顾夜舟爆发第一次正面争吵
- 顾夜舟明确表示这不是她该碰的事，试图把她推到局外
- 沈清辞反过来点破他一出事就把自己往外推的毛病
- 顾夜舟最终独自离开，奔着旧仓库区去了
- 苏晚宁把这一消息转给沈清辞，让她赶紧去追
characters_present:
- 沈清辞
- 顾夜舟
- 苏晚宁
state_changes:
- character: 顾夜舟
  field: knowledge_state
  old_value: 确认沈清辞不是嘴上说陪着，而是真的能在自己最危险的时候伸手拉住自己；她已经成了失控时唯一能让他回神的人
  new_value: 更清楚沈清辞不会轻易退，但也因此更想把她从顾启明和旧项目这条线里硬推开
- character: 顾夜舟
  field: emotional_state
  old_value: 刚被拉回来的稳定感被“顾启明项目组”这几个字重新击穿，情绪从绷紧直接走向防御和排斥
  new_value: 对父亲和旧档案的应激彻底压过了温情部分；他用最伤人的方式把恐惧和保护欲一起甩了出来
- character: 沈清辞
  field: emotional_state
  old_value: 心疼和后怕直接盖过了之前那点暧昧试探；她第一次明确意识到，自己如果退一步，顾夜舟可能真会掉下去
  new_value: 被顾夜舟推开后火气和委屈一起上来，但真正让她站住不退的，还是那股“不能让他一个人去扛”的执念
new_information_revealed:
- 顾夜舟对顾启明和旧项目的反应比沈清辞预估得更激烈
- 他其实知道得比之前表现出来的更多

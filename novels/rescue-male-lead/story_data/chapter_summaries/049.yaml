chapter_number: 49
title: 参观到此结束
summary: 沈清辞在楼梯间第一次试用新觉醒的短时记忆裁剪能力，剪掉伪装维修工执行者最近十五分钟的危险记忆，替换成“水管检修、地滑摔倒、学生问路”的合理现场。随后她、顾夜舟和李佳佳借维修工证词、实验楼安全隐患记录、顾夜舟的化学安全判断以及李佳佳的现场发挥，把赶来的班主任和化学组老师忽悠过去，成功收束化学楼参观；许知衡短暂试探，被沈清辞和顾夜舟用嘴仗压回去。参观结束后，青鲤通知顾夜舟旧部荒川、钟塔、旧港刚刚苏醒，身体坐标不稳。众人前往学校后街砂锅粥店吃饭，旧部第一次在当前线完整坐到一桌，用酸梅汤敬上一条线鱼死网破的胜利。席间沈清辞主动向顾夜舟披露“系统”存在，但她自己也不清楚系统来源；顾夜舟不能直接接收系统，只通过她写下的提示和行为验证接受这条异常辅助线。契约记忆恢复后，沈清辞与顾夜舟之间的单方协议开始生效，表现为沈清辞对顾夜舟的单向共感：他的疼痛和心动都会同步到她身上，且当前能量不足无法屏蔽。
events:
- 青鲤提醒老师正在靠近，众人必须立刻处理楼梯间现场
- 沈清辞第一次使用短时记忆裁剪，剪掉伪装维修工执行者十五分钟内关于攻击、青鲤和顾夜舟的记忆
- 被裁剪记忆的维修工认为自己在水管检修时摔倒，并成为“西侧楼梯地滑、三楼暂停参观”的现场证人
- 青鲤把另一名执行者和明显痕迹临时处理掉，避免老师撞见真正战斗现场
- 班主任与化学组老师赶到，李佳佳用安全隐患记录和现场发挥先行解释
- 沈清辞用“怕外校同学误踩”把擅自离队包装成安全协助
- 顾夜舟用次氯酸钠气味、扶手螺丝和三楼旧试剂准备室安全风险转移老师注意力
- 许知衡短暂现身并以“路线图旧版未更新”圆场，沈清辞和顾夜舟当场用嘴仗压住他的试探
- 班主任正式暂停三楼西侧参观，化学楼参观以安全教育收尾
- 沈清辞第一次感觉到不属于自己的胸口跳动，系统提示单向共感链路加载
- 青鲤通过旧通讯残片通知顾夜舟，荒川、钟塔和旧港已经苏醒但身体坐标很差
- 沈清辞、顾夜舟、李佳佳随青鲤前往学校后街砂锅粥店见刚苏醒的旧部
- 荒川、钟塔、旧港以虚弱且不熟悉当前身体的状态登场，旧部与少年版顾夜舟形成轻喜剧反差
- 沈清辞主动向顾夜舟披露系统存在，并把系统提示写给他看
- 顾夜舟接受系统是沈清辞的异常辅助线，但只要求她以后遇到危险提示告诉自己
- 单方协议开始生效，沈清辞确认自己会共享顾夜舟的疼痛和心动
- 众人用酸梅汤敬上一条线鱼死网破的胜利，当前线第一顿旧部完整饭局成立

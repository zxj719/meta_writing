chapter_number: 24
title: 原来两家从十几年前就开始互坑
summary: 顾夜舟和沈父终于坐到了一张桌上，沈父把顾母当年求助、项目被强制停掉以及自己没能帮到底的旧事都摊开了。一个旧铁盒和一封没寄出的信，把顾夜舟母亲留下的情绪也递到了他手里。还没等三人喘口气，苏晚宁就传来新消息，顾启明已经准备改用沈清辞当筹码。
events:
- 沈父向顾夜舟说明顾母曾求助和项目封存经过
- 沈父拿出顾母留下的旧铁盒和信件交给顾夜舟
- 顾夜舟从信里确认母亲确实试图带自己逃离顾启明
- 沈清辞、顾夜舟和沈父围绕第二天是否赴约产生分歧
- 苏晚宁打来电话，透露顾启明想单独约出沈清辞，把她当成新的筹码

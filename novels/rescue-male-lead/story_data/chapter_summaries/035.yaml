state_changes:
- character: 沈清辞
  field: emotional_state
  old_value: 她越来越习惯和顾夜舟一起站在最亮的地方，也越来越清楚这种“站在一起”会让他们同时暴露在风险正中央。可比起后退，她现在更像是会一边嘴硬一边把人往自己这边拽，先站住，再想办法拆局。
  new_value: 成人礼散场后的普通高三热闹让她第一次更踏实地确认，顾夜舟已经会在日常里主动把她划进自己的范围；但顾母旧工作牌的出现，又让她意识到这场局可能比她想的埋得更早。
- character: 顾夜舟
  field: knowledge_state
  old_value: 已确认自己是07号、顾启明和陆闻川都盯着的钥匙，也知道镜面载体、真正的苏晚宁、沈清辞的识伪能力和成人礼节点已经并进同一条线。到第34章末，他进一步确认原本针对自己的响应链并不只在礼堂内部，校门外也有补位人员和额外观察者待命。
  new_value: 在判断出“周启”“宋雾”这条线未必属于陆闻川之后，他又从成人礼纪念封套里翻出母亲当年留下的旧设备组工作牌，首次拿到顾母曾与同类公开场域和设备流程发生过联系的实体物证。
new_information_revealed:
- 乔知夏和陈渡在成人礼散场后迅速从人群里消失，更像是在完成节点后及时撤离
- 名单里额外出现的“周启”“宋雾”未必是陆闻川的人，现场可能还有另一股不愿正式露面的第三方
- 顾夜舟母亲曾以成人礼设备组身份出现在类似公开场域里，顾母旧线和当前舞台线存在更早的连接

chapter_number: 35
title: 散场以后，她把全校门面从人堆里偷走了
summary: 成人礼正式结束后，礼堂门口彻底变成高三限定的大型拍照和签名现场。沈清辞和顾夜舟被全班围着起哄、拍照、在校服上写话，两人的地下恋气氛在普通高三生活里又往前走了一步；顾夜舟甚至主动把穿着礼服、站了一上午的沈清辞从人堆里带走，陪她躲去自动贩卖机边透气。两人在短暂喘口气的间隙重新复盘了乔知夏、陈渡和“周启”“宋雾”这几条线，确认第三方仍在暗处，却暂时不打算露脸。章节结尾，学校发给领誓代表的纪念封套里，意外掉出一枚很多年前的旧工作牌，顾夜舟一眼认出那是他母亲的东西，说明这场成人礼和顾母当年的痕迹可能早就连在了一起。
events:
- 成人礼散场后，礼堂门口进入拍照、签名、互写祝福的高三日常阶段
- 沈清辞和顾夜舟被同学围着合影、起哄，并在彼此校服上留下只给对方看的字
- 顾夜舟主动把沈清辞从礼堂门口的人堆里带走，去侧楼后面的自动贩卖机边透气
- 两人在短暂独处里重新梳理乔知夏、陈渡和校外“周启”“宋雾”这几条线，判断第三方仍在暗处观察
- 宣传部给领誓代表发纪念封套，顾夜舟却从自己的封套里翻出一枚属于很多年前成人礼设备组的旧工作牌
- 顾夜舟认出旧工作牌属于自己的母亲，成人礼线和顾母旧线第一次被实体物证连到一起

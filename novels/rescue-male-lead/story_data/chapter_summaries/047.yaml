state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 她从蓝色塑封纸和闪回里第一次接触“认门”概念，知道自己可能是认门人，且上一条线里曾站在黑门前；她听见门毁会让异能链路断掉，也知道有人确认本线S-QC并想把当前线的自己带回原线。
  new_value: 她知道敌方已经能在校内楼梯间直接按S-QC定位自己；她也通过实战确认自己从小练散打的身体记忆仍可对付低阶执行者，并第一次看见“认门人与钥匙接触时致死判定失败”的现象。
- character: 顾夜舟
  field: knowledge_state
  old_value: 他通过塑封纸知道许知衡并非回线体，而是被投喂校准的执行位；他还短暂闪回到上一条线后期，听见“门没坏完”“她留下信号了”“把她找回来”等碎片，并看见自己曾安排旧部留守和回节点分工。
  new_value: 他确认旧部青鲤已经苏醒并找到当前线自己，知道顾澜机器确实送来了部分自愿旧部，也知道反派疑似通过异能法器跨线且有人比青鲤更早到达。
- character: 青鲤
  field: first_appearance
  old_value: ''
  new_value: 作为顾夜舟上一条线旧部登场，带着原身和较完整旧线记忆来到当前线，但水系/感知类能力被世界规则削弱。
- character: 沈父
  field: backstory
  old_value: ''
  new_value: 通过沈清辞散打馆回忆补出他虽然只在局里外层，却真心疼爱女儿，从小安排她练防身，希望她遇到危险时能保护自己。
new_information_revealed:
- 沈清辞从小练过散打，沈父出于保护女儿的动机安排过防身训练
- 认门人沈清辞和钥匙顾夜舟有身体接触时，致死攻击会失败或偏移
- 顾澜曾用类似时空穿越的机器把顾夜舟旧部送到当前线，旧部可以带原身和完整记忆过来
- 跨线会触犯世界规则，因此我方旧部能力被削弱，反派跨线者同样会被削弱
- 反派可能使用由时空之力锻造的异能法器跨线，且有人比青鲤更早到达
- 顾夜舟旧部对当前线少年顾夜舟和沈清辞的亲密关系会产生轻喜剧式震惊和磕CP倾向

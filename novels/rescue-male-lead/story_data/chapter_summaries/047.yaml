chapter_number: 47
title: 老大怎么穿校服
summary: 沈清辞、顾夜舟和李佳佳离开自动贩卖机连廊时，在西侧楼梯间遭遇伪装成维修工的执行者，目标明确指向S-QC。沈清辞用从小练出的散打反擒针管执行者，短暂回忆沈父当年给她系护具、希望她能自保的温柔动机，补出她现实防身能力来源。另一名执行者用蓝光金属片攻击沈清辞要害，因她正与顾夜舟接触，系统提示“致死伤害判定失败：认门人与钥匙接触中”。青鲤以跑腿外卖伪装登场，用被削弱的水系残余能力制服执行者，称呼顾夜舟“七哥”，并透露自己是顾澜机器送来的旧部，保留旧线记忆但能力被世界规则削弱。章尾青鲤带来顾澜口信“别松手”，执行者则说出“认门人和钥匙在一起，难怪杀不掉”。
events:
- 三人准备离开连廊，顾夜舟继续牵住沈清辞，系统提示宿主与钥匙持续接触
- 西侧楼梯间出现两个伪装成维修工的执行者，其中一人低声确认目标为女、高三、S-QC
- 沈清辞先把李佳佳推到墙边，随后用散打反擒提针管的执行者，表现出早有训练的现实防身能力
- 沈清辞回忆小时候沈父在散打馆给她系护具，告诉她真遇到危险要先跑，跑不了就打膝盖、手腕和喉咙
- 第二名执行者用带蓝光的金属片攻击沈清辞要害，顾夜舟把她拉到身侧，因两人有身体接触，致死伤害偏移失败
- 系统提示“致死伤害判定失败”“原因：认门人与钥匙接触中”，首次显性展示接触保护规则
- 青鲤以跑腿外卖伪装出现，用被削弱的水系残余能力压住逃跑执行者，并吐槽自己像情绪稳定的加湿器
- 青鲤认出顾夜舟并叫“七哥”，震惊于当前线少年顾夜舟穿校服牵着沈清辞
- 青鲤称呼沈清辞为嫂子，暴露旧部对“清舟”关系的磕CP倾向
- 青鲤说明顾澜机器把自愿旧部送到当前线，但定位有偏差，荒川等人还在找身体坐标；她能力被削弱，反派则疑似通过异能法器跨线且有人早到
- 青鲤带来顾澜口信“别松手”
- 章尾被制住的执行者从两人牵手和攻击失败中判断出认门人与钥匙在一起时杀不掉

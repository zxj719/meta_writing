chapter_number: 20
title: 吵完也得一起走
summary: 沈清辞还是追去了旧仓库区，在一顿不算体面的继续吵架之后，逼着顾夜舟把“顾启明是我爸”这句话亲口说了出来。两个人没有因为这场争吵散掉，反而一起走进了那栋废楼，把查真相这件事第一次变成了并肩行动。楼里的旧合影和“X组负责人留档”备注，则把顾启明和X的关系彻底挑到了明面上。
events:
- 沈清辞追到旧仓库区，堵住想一个人进废楼的顾夜舟
- 两人围绕“该不该把她推开”继续爆发争执
- 顾夜舟第一次承认顾启明是自己的父亲
- 沈清辞没有退，逼着他带自己一起进去查
- 两人在废楼里翻到07批封存档案和旧合影
- 照片和备注显示顾启明与X组存在直接关系

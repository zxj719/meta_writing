chapter_number: 14
title: 我爸越不让我看，我越得看
summary: 沈清辞先把苏晚宁拎出来继续逼供，确认“清岚科技正在替学校那边收尾旧资料”这条消息不是空穴来风，随后干脆请假去了父亲公司。她在档案室里翻到了和青岚研究所、QH-SX-07、顾启明以及“07批观察对象”有关的封存记录，终于把校园线后面那只更大的手摸出了轮廓。还没等她消化完，苏晚宁又传来新消息：X的人约她去旧实验楼取资料。

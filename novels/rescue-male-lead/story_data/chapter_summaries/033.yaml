chapter_number: 33
title: 彩排一开始，先乱的是全校的心跳
summary: 成人礼正式开始前的全流程彩排，把礼堂后台彻底搅成了高三限定的大型兵荒马乱现场。沈清辞和顾夜舟作为领誓代表再次穿上礼服与正装，在全校围观下把“闪耀”这件事做得过于彻底；与此同时，乔知夏的镜头明显增多，她不再只是试光时路过的摄影社女生，而是直接在站位安排和追光异常上出手，借“拍摄效果”把顾夜舟从舞台正中稍微挪开。真正的危险还是在誓词环节咬了上来，顾夜舟读誓词时，原本不该启动的追光灯自行亮了一瞬，乔知夏和陈渡几乎同时做出反应，把事故压了回去。章节结尾，乔知夏把刚洗出的拍立得递给沈清辞，照片里本该空着的追光落点上多出一道模糊人影，意味着顾夜舟在成人礼正式场上的站位，可能早就被人提前“绑”好了。
events:
- 成人礼全流程彩排开启，后台和礼堂陷入高三限定的混乱与热闹
- 沈清辞与顾夜舟再次以礼服和正装出场，成为成人礼彩排里最扎眼的一对领誓代表
- 乔知夏明确提示舞台中央金胶带和追光落点有问题，并借拍摄理由把顾夜舟站位往旁边挪开
- 陆闻川继续在校领导和流程安排之间施加影响，试图把顾夜舟压回舞台正中
- 领誓彩排时，沈清辞和顾夜舟在全校注视下完成誓词，台下反应明显被两人的气场带停
- 原本不该启动的追光灯在顾夜舟读誓词时自行亮了一瞬，乔知夏与陈渡同时出手把异常压了回去
- 乔知夏把拍立得交给沈清辞，照片显示舞台正中央的追光落点里出现了不该存在的人形边影
characters_present:

state_changes:
- character: 沈清辞
  field: emotional_state
  old_value: 在成人礼试装、签校服和拍下第一张正式合照之后，她第一次真切意识到自己和顾夜舟之间已经不只是并肩查线，而是会在普通校园日常里也自动靠近、自动站到同一边。
  new_value: 彩排把两人的关系又往公开场域里推了一步，她一边享受和顾夜舟并肩发光的感觉，一边也更清楚地意识到成人礼舞台正在被人拿来当针对顾夜舟的新陷阱。
- character: 顾夜舟
  field: emotional_state
  old_value: 明知道成人礼和公开舞台会让局面更危险，他还是默认和沈清辞一起换礼服、一起拍照、一起上台，这种不再回避的靠近已经从私下保护，变成了半公开的站位选择。
  new_value: 他已经能在全校视线和成人礼流程里公开站到沈清辞身边，却也真切感受到舞台中央那盏追光对自己有异常反应，危险感被拉到了台前。
- character: 乔知夏
  field: emotional_state
  old_value: 表面镇定，内里对某些高频异响和强光源有本能性紧张；在成人礼现场露出反应后，已经开始意识到自己可能被人注意到了。
  new_value: 她不再只是被动承受异常，而是第一次主动介入站位和设备流程，选择冒着暴露风险去提醒沈清辞并帮顾夜舟避开舞台正中。
new_information_revealed:
- 舞台正中央的追光落点和顾夜舟的领誓站位很可能是被提前绑定过的
- 乔知夏不仅能提前听见异常，还会主动利用摄影和拍摄流程替人挪开风险
- 陈渡与乔知夏在礼堂异常爆发时几乎同步反应，说明两人都对这类公开场域里的异常装置有感知

chapter_number: 7
title: 今天必须说人话
summary: 系统把“帮助顾夜舟摆脱孤立”提成下一阶段主线后，又丢给沈清辞一个离谱日常任务，要求顾夜舟对第三人说出一句完整的人话。借着班里重新分配值日搭档的机会，沈清辞一路连哄带激，终于逼出顾夜舟在李佳佳快滑倒时本能开口提醒。值日结束后，顾夜舟甚至主动提了句“别买冰的”，让两人的日常距离再次缩短，而苏晚宁也在章尾正式来堵人。
events:
- 系统刷新下一阶段主线，要求沈清辞帮助顾夜舟建立正常社交关系
- 班里因为卫生检查重新分配值日，沈清辞和顾夜舟被分到一组
- 沈清辞尝试提前教顾夜舟几句“正常社交台词”，结果被嫌弃
- 李佳佳打滑时顾夜舟本能出手扶住水桶，并开口提醒她别踩湿地
- 系统判定离谱日常任务完成，顾夜舟的正常社交进度正式推进
- 沈清辞拿草莓牛奶奖励顾夜舟，顾夜舟第一次对她提出“别买冰的”这种日常需求
- 苏晚宁在教学楼下拦住沈清辞，提出要和她谈谈

chapter_number: 46
title: 认门的人
summary: 连廊自动贩卖机旁，沈清辞和顾夜舟从窄巷闪回里回到现实，系统提示羁绊碎片同步、记忆稳定度升至36%。顾夜舟从取货口挑出带蓝色印痕的塑封纸，残缺记录露出“S-QC / 本线”“认门”“XZH：非回线体 / 投喂校准”等关键词，纠正许知衡不是回线者，而是被投喂旧线信息的执行位。沈清辞被“认门”触发，看见上一条线里自己站在黑门前，门内源力以“救回顾夜舟”为诱饵试图吞噬她；顾夜舟则闪回到上一条线后期，得知沈清辞留下信号、门没有彻底损坏，自己安排旧部后准备回节点找她。章尾自动贩卖机再次吐出票据，确认“本线S-QC已确认，回收优先级最高，建议带回原线”。
events:
- 沈清辞从窄巷闪回里缓过来，李佳佳用遗书和作文模板缓冲紧张气氛
- 系统提示羁绊碎片同步完成，当前记忆稳定度升至36%，并提醒沈清辞远离未知冷白光源、可疑水源、奇怪门缝和过分体面的男同学
- 沈清辞发现自动贩卖机取货口卡着浅蓝透明塑封纸，顾夜舟用草稿纸隔开取出
- 塑封纸残缺文字显示“S-QC / 本线”“门识别”“认门状态待确认”“XZH：非回线体 / 投喂校准”
- 沈清辞被“认门”触发闪回，看见上一条线里自己站在黑门前，门内源力用“救回顾夜舟”引诱她打开门
- 闪回里有人喊“认门人如果毁门，链路会断，所有能力都会掉”，补出门与异能链路的关系
- 上一条线里的顾夜舟满身是血站在沈清辞身后，用“看我”把她从门源力诱惑里拉住
- 沈清辞回到现实后告诉顾夜舟和李佳佳，自己看见有人叫她认门人，并说门毁会让异能链路断掉
- 顾夜舟被同一关键词触发，闪回到上一条线后期，看见自己安排旧部留守和回节点分工，并听见顾澜线传来“门没坏完”“沈清辞太虚弱”“把她找回来”等信息
- 顾夜舟醒来后没有立刻解释全部，只把塑封纸夹进草稿本并要求先离开
- 自动贩卖机再次吐出票据，显示“本线S-QC已确认”“回收优先级：最高。建议带回原线”

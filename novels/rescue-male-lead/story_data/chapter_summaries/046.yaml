state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 第45章后，她确认第二瓶水并非校内机器售卖、瓶盖内侧带蓝色印痕，且自己喝完后会出现“我是不是还有别的事要做”的记忆缺口反应；连廊贩卖机的冷白灯光还让她第一次看见更早的窄巷初见。
  new_value: 她从蓝色塑封纸和闪回里第一次接触“认门”概念，知道自己可能是认门人，且上一条线里曾站在黑门前；她听见门毁会让异能链路断掉，也知道有人确认本线S-QC并想把当前线的自己带回原线。
- character: 顾夜舟
  field: knowledge_state
  old_value: 第45章后，他进一步确认第二瓶水的细节与蓝色印痕有关，也通过共同闪回摸到自己更早的样本出逃记忆，知道沈清辞在校园公开事件之前就曾见过自己，且顾澜是当年逼他回去的重要筹码。
  new_value: 他通过塑封纸知道许知衡并非回线体，而是被投喂校准的执行位；他还短暂闪回到上一条线后期，听见“门没坏完”“她留下信号了”“把她找回来”等碎片，并看见自己曾安排旧部留守和回节点分工。
- character: 李佳佳
  field: knowledge_state
  old_value: 第45章后，她更清楚地想起第二瓶水来自冷白灯下的自动贩卖机场景，不是校内售卖，且许知衡用“她现在只信你”诱导自己递水；她也意识到自己可能撞见了男女主比已知剧情更早的羁绊源头。
  new_value: 她亲眼看见自动贩卖机吐出蓝色塑封纸和回收票据，虽然听不懂完整设定，但知道S-QC、本线、原线、认门和回收优先级已经成为下一步危险关键词。
new_information_revealed:
- 许知衡不是重生者或完整回线人员，他的精准踩点来自“非回线体 / 投喂校准”一类外部安排
- 沈清辞可能是“认门的人”，能识别或接触门
- 门内源力会诱惑沈清辞，并可能通过她闯入现实；门毁会导致异能链路断裂
- 上一条线里沈清辞曾给异控局/顾澜线留下信号，门没有完全坏掉，顾夜舟因此安排旧部并准备回到当前节点找她
- 当前线的沈清辞已经被标记为本线S-QC，实验者或更高层势力想把她带回原线

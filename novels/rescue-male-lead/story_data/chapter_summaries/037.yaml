chapter_number: 37
title: 门外的人没进来，可他们把名字留下了
summary: 沈清辞和顾夜舟藏在礼堂三楼旧放映间的设备柜后，听见门外两个第三方调查者确认B-17已被回收、蓝标漏片被他们接触，并提到“短时回线”“回线锚点”“顾澜转移链”等关键信息。顾夜舟第一次听见母亲顾澜可能并未死于车祸，而是被某条转移链救走，并且陆闻川和顾启明都没有掌握完整真相；沈清辞也确认自己的重生并非单纯个人奇遇，而与“回线锚点”和07号保护对象有关。两人随后在蓝色贴纸背面读出压痕“回线锚点：S-Q / 保护对象：07 / 状态：待稳定”，进一步坐实沈清辞与回溯机制的关联。章节后半段，班主任抓到两人违规进入礼堂三楼，用“成人礼精神的历史源头”二次八百字惩罚把紧张气氛拉回校园日常，章尾系统面板正式更新“回线锚点：S-QC，保护对象：07，当前稳定度31%”。
events:
- 沈清辞和顾夜舟躲在旧放映间设备柜后，听见门外第三方人员讨论B-17已被回收
- 门外人确认蓝标漏片被沈清辞和顾夜舟接触，沈清辞触发的是“短时回线”
- 第三方人员提到顾夜舟母亲顾澜的转移链未进入陆闻川系统，顾启明也只知道尸骨无存
- 门外人说沈清辞目前只把自身异常当成重生，并称她为“回线锚点”
- 沈清辞和顾夜舟在蓝色贴纸背面读出“回线锚点：S-Q / 保护对象：07 / 状态：待稳定”的压痕
- 沈清辞向顾夜舟承认自己知道一点前世结局，但暂时还不能完整解释
- 班主任在礼堂三楼抓到两人，并罚他们第二天再交一篇《成人礼精神的历史源头》
- 章尾系统面板更新，确认沈清辞是回线锚点S-QC，顾夜舟是保护对象07，稳定度为31%

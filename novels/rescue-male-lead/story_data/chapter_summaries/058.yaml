chapter_number: 58
title: 沈宅保命套餐升级版
summary: 沈宅接收顾夜舟、李佳佳和旧部后，富家体验卡正式升级成临时异能者团建基地。旧部被周姨和保护组带去医疗室，青鲤、钟塔、荒川、旧港对沈宅的姜汤、按摩椅、智能花洒和地毯产生一连串生活化反应，李佳佳继续用吐槽缓冲场面。沈清辞注意到李佳佳袖口内侧灰蓝粉尘检测只跳出极淡蓝格，系统没有报警，反而让她更不安，于是提醒李佳佳暂时不要主动使用能力。随后沈清辞在二楼书房与沈父谈话，直问秦越、沈家保护组、顾澜和沈父是否也是上条线过来的人。沈父承认自己在沈清辞前面询问顾启明时醒得更早，也在那时知道两条线开始交汇；他上一条线记得女儿二十四岁身体指标下坠和顾夜舟站在病房外的样子，因此这一线只想让沈清辞健康、平安、普通地长大。沈清辞指出自己已经站进局里，要求父亲不要再替她单方面决定“活着”的方式。谈话中沈父给顾澜发消息，单方面吐槽女儿把疑似女婿和一整个旧部打包带回沈宅，顾澜因坐标暴露限制只回了一个呲牙笑，缓和了父女之间的紧绷。章尾切到陆闻川：污染事件后，心理医生身份线变脏，他出于流程洁癖决定收掉这层壳，换脸成临川一中高三数学代课老师“周启明”。他很早发现李佳佳状态不对，夜里梦见妹妹陆星禾在雨中难过地看着自己，于是借“数学课外辅导”这个对李佳佳极自然的理由，准备观察她的毒点情况。
events:
- 沈宅接收顾夜舟、李佳佳和旧部，保护组、周姨和老郑提前待命
- 李佳佳把沈宅定义为异能者团建基地，旧部开始富家体验卡环节
- 周姨安排旧部进医疗室处理伤口，荒川担心弄脏地毯，旧港通讯器吐槽地毯生存率
- 沈清辞强行要求顾夜舟检查身体，不许他嘴硬
- 沈清辞让李佳佳也检查袖口灰蓝粉尘，检测片只跳出极淡蓝格，系统没有报警
- 沈清辞和顾夜舟仍对李佳佳袖口残留不放心，秦越将样本封存
- 沈清辞提醒李佳佳暂时不要主动使用稳定/治愈能力
- 沈清辞在二楼书房与沈父谈话，直接追问秦越、保护组、顾澜和沈父是否来自上条线
- 沈父承认自己醒得比沈清辞早，并在沈清辞询问顾启明时知道两条线开始交汇
- 沈父说出自己上一条线记得沈清辞二十四岁身体指标下坠和顾夜舟站在病房外，因此这一线只想让女儿普通平安长大
- 沈清辞要求沈父不要再把活着这件事替她单方面决定完
- 沈父向顾澜发消息吐槽沈清辞把疑似女婿和顾夜舟旧部带回沈宅，顾澜因坐标暴露限制只回了一个呲牙笑
- 沈父终于答应开始说出更多真相
- 旧部体验沈宅医疗室、姜汤、按摩椅和智能花洒，李佳佳继续担任富家生活翻译
- 陆闻川收掉心理医生身份，换脸成高三数学代课老师“周启明”
- 陆闻川发现李佳佳稳定系波动里出现迟滞，很早意识到她状态不对
- 陆闻川夜里梦到妹妹陆星禾在雨中难过地看着他
- 陆闻川以数学课外辅导为名，将李佳佳圈为明天下午观察对象

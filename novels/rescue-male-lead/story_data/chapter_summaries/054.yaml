chapter_number: 54
title: 沈家保镖不太像保镖
summary: 章节开篇半隐晦展示沈父在京州加密会议室内与处于半上线状态的顾澜通讯，确认顾澜暂时无法亲身下场，但正在与沈父合作投放信息和调整保护流程；两人提到07与S-QC从相遇起命线互锁，敌方真正危险方向是诱导自愿死亡。心理咨询室侧门打开，沈家保卫人员秦越以校安协查/后勤维修身份进入，用监护人授权和设备协查流程挡住陆闻川继续拆分访谈，也让沈清辞和顾夜舟开始怀疑沈家保卫体系并不普通。陆闻川维持团体访谈并试图以“隐瞒信息”的问题刺探沈清辞，同时医务楼外出现强者至上训练场来的毒系外援“温”，其通过灰蓝粉末污染心理咨询室空气。系统提示外部污染接入和命线互锁已激活，秦越挡住陆闻川转场要求，章尾通风口传来嗒声，心理咨询室线进入最后收束冲突。
events:
- 沈父在加密会议室内查看心理咨询室三路线C黄线，与顾澜半在线通讯，确认训练场外援提前到场
- 顾澜说明07和S-QC同线相遇后命线已缠住，敌方若要突破规则会转向诱导自愿死亡
- 沈父命令秦越按学校保卫流程进入心理咨询室，并要求不要叫沈清辞小姐
- 秦越从心理咨询室侧门进入，伪装成校安协查/后勤维修人员，沈清辞认出他是沈家别墅常见的秦叔
- 秦越用检测器压住茶几下的蓝色方格，并以监护人授权要求访谈只能按公开团体流程进行，不转场、不采样
- 沈清辞和顾夜舟通过秦越的称呼、手茧、流程权限和系统提示，意识到沈家保卫人员很可能不是普通保镖
- 陆闻川继续团体访谈，借强烈不安全感和熟人隐瞒信息问题试探沈清辞，沈清辞用“别拿未成年人当实验材料”反击
- 医务楼外黑色商务车内出现训练场毒系外援温，他与陆闻川短信联系，表示不致命，只让他们做选择
- 灰蓝色污染进入心理咨询室，秦越检测器变色，李佳佳和沈清辞出现不适，顾夜舟察觉危险并按住沈清辞手腕
- 系统弹出外部污染和命线互锁碎片，提示敌方目标不是杀死，而是诱导自愿选择
- 顾澜的噪点通讯提醒秦越别让他们分开，陆闻川提出换房间继续访谈，秦越挡门拒绝
- 章尾通风口传来嗒声，提示训练场毒线已经进入咨询室现场

state_changes:
- character: 沈清辞
  field: knowledge_state
  old_value: 已确认顾启明和陆闻川正在联手把青岚旧案往校园公开场域里搬，知道“苏晚宁”不是一个稳定的人，也知道自己逐渐觉醒的识伪与共振能力正被对方盯上。到第33章末，她进一步确认成人礼舞台中央的追光与顾夜舟站位很可能被提前做过手脚，乔知夏也不只是单纯对噪音敏感。
  new_value: 她确认成人礼这场布置不止在礼堂里，校门外同样有人待命补位；同时也确认陆闻川已经开始正式留意乔知夏和陈渡，准备把他们也纳入视野。
- character: 顾夜舟
  field: emotional_state
  old_value: 仍然戒备，仍然不喜欢被人围观，可他已经不会本能地躲开和沈清辞并肩站在光下这件事。彩排那一瞬追光自己亮起时，他第一次明显感觉到危险和“公开站到她身边”这件事被绑到了一起，却还是没想过退。
  new_value: 他在正式场里更加习惯和沈清辞一起站到所有人的视线中心，却也更清楚地意识到自己一旦踩进某个站位，校内外两边都会同时动起来。
- character: 乔知夏
  field: knowledge_state
  old_value: 已经明确感知到礼堂追光、音箱和某些高频异响会在顾夜舟靠近舞台正中、或誓词节奏进入特定段落时提前失真。她暂时还说不清原理，但到第33章末，她已经能判断这不是单纯设备故障，而像是有人把站位和某种“响应”提前绑在了一起。
  new_value: 她进一步确认异常并不只来自礼堂内部，校门外也有与舞台节奏呼应的补位监测；同时她知道陆闻川已经开始记她和陈渡的名字。
- character: 陈渡
  field: knowledge_state
  old_value: 知道青岚旧案、样本编号和陆闻川在学校里埋线的方式，也知道真正的苏晚宁和成人礼后台之间存在联系；第32章后，他进一步确认乔知夏这种存在感很低的校园边缘角色也可能不在普通人范围内。
  new_value: 他确认陆闻川已经开始顺着后台和广播摄影线筛人，同时也确认校门外有额外观察者和补位人员，不再只是校园内部的布置。
new_information_revealed:
- 陆闻川已经开始主动记住并打听乔知夏和陈渡，不再只是无意注意到他们
- 校门外存在不属于学校系统的临时观察者或外场设备补位人员
- 顾夜舟和沈清辞在正式场上偏开的半步，很可能直接打断了原本安排好的响应链条

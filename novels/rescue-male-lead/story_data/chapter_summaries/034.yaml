chapter_number: 34
title: 成人礼那天，他们站在光里，暗处的人开始记名字
summary: 成人礼正式场当天，沈清辞和顾夜舟继续以领誓代表的身份站到全校和家长视线中央，把“闪耀”这件事做得更加彻底。与此同时，乔知夏和陈渡都明确感受到陆闻川已经开始盯上他们，乔知夏甚至提前提醒沈清辞，危险不止在礼堂里，校门外还有补位的人在等；两人最终在台上临时偏开半步，避开了原本疑似绑定顾夜舟的舞台正中。章节结尾，校门外那辆可疑面包车消失，只留下耳麦胶套，而顾夜舟从流程单里发现“外场设备巡查”被临时塞进了两个不属于学校系统的陌生名字，说明成人礼这场局已经从校园内线悄悄扩到了校外。
events:
- 成人礼正式场开启，校门口挤满家长、花束和高三学生，整体氛围比彩排更公开也更热闹
- 沈清辞与顾夜舟继续以礼服和正装出场，成为集体照与领誓环节最醒目的中心人物
- 乔知夏增加现场镜头，提醒两人签名墙和舞台站位都有问题，并直觉判断校外还有补位的人
- 陈渡低声告知沈清辞，校门外多了几拨不在学校名单里的陌生人
- 陆闻川在正式场上明确开始记住乔知夏与陈渡，借流程与老师口径打听他们的身份
- 领誓正式开始时，沈清辞按乔知夏给的提示带着顾夜舟偏开半步，避开原定舞台中心
- 礼堂外传来疑似设备碰撞的异响，校门外观察者暴露出存在痕迹
- 散场后可疑面包车消失，只留下耳麦胶套，顾夜舟则从流程单里发现两名临时外场设备巡查人员的陌生名字

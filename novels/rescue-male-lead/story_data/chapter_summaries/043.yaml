chapter_number: 43
title: 门后没有灰
summary: 三楼旧试剂准备室门锁异常后，老师组织学生撤离，沈清辞、顾夜舟借李佳佳制造的资料袋掩护从西侧安全通道上楼。顾夜舟发现安全通道扶手有极浅蓝粉，旧试剂准备室封条被平整割开，门后扇形区域没有积灰，判断这间封闭两年的房间近期被反复使用。沈清辞被旧试剂味触发短暂碎片，看见上一条线里更阴郁的顾夜舟按住她手里的水，提醒她“别喝”“先看我，别跟他走”。两人在水槽边发现湿痕和蓝色残留，许知衡赶到并精准提醒沈清辞不要靠近水槽，暴露他对房间关键点的过度熟悉。章尾顾夜舟从水槽下方夹出防水标签，标签写有“S-QC / 水样二次投放 / 门锁触发后十分钟内回收”，夹层手写字则写着“她忘过你一次。别让她喝第二瓶。”
events:
- 三楼旧试剂准备室门锁异常后，老师和管理员组织学生撤离并点名
- 许知衡主动表示可以陪管理员查看三楼，被顾夜舟以“学生靠近会破坏现场”挡回
- 李佳佳用“实验安全承诺书少页”的方式拖住老师，帮沈清辞和顾夜舟从后排侧门离开
- 顾夜舟在西侧安全通道扶手内侧发现极浅蓝粉，判断像被手套蹭过
- 两人到达三楼旧试剂准备室，发现封条断口平整、门把手有新划痕、门后扇形区域无灰
- 沈清辞因旧试剂味触发短暂碎片，看见上一条线里更阴郁的顾夜舟按住她手里的水，提醒她别喝、先看他、别跟许知衡走
- 系统提示碎片捕获关键词为“水样 / 门锁 / 二次投放”，当前记忆稳定度升至35%
- 顾夜舟检查旧水槽，发现水槽在三楼水闸应关闭的情况下仍有湿痕和蓝色残留
- 许知衡赶到旧试剂准备室门口，并精准提醒沈清辞不要靠近水槽
- 顾夜舟从水槽下方夹出防水标签，确认S-QC、水样二次投放和门锁触发后十分钟内回收三条信息
- 防水标签夹层露出手写字：“她忘过你一次。别让她喝第二瓶。”

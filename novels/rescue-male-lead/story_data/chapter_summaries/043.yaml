new_information_revealed:
- 三楼旧试剂准备室的封闭状态是假象，门后无灰、水槽湿痕和蓝色残留说明近期有人反复使用
- 安全通道扶手上有极浅蓝粉，可能来自蹭过扶手的手套，与水瓶压痕和蓝色标签线同源
- S-QC曾与“水样二次投放”有关，门锁触发后十分钟内需要回收某种水样或证据
- 沈清辞上一条线里可能喝过或差点喝过第二瓶水，并因此“忘过顾夜舟一次”
- 许知衡对旧试剂准备室水槽过度熟悉，不再只是旁观或试探

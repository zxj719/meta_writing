chapter_number: 45
title: 她现在只信你
summary: 李佳佳坦白自己可能递过第二瓶水后，顾夜舟和沈清辞没有立刻怀疑她，而是明确说出他们信她的理由：她一直好奇却不越界、害怕却不抛下人、愿意报点却不替别人做决定。三人转去连廊自动贩卖机旁复盘细节，李佳佳补出第二瓶水并非校内机器售卖、瓶盖内侧有蓝色印痕，而且许知衡当时用“她现在只信你”把递水这件事包装成了可信请求。顾夜舟当场先替沈清辞试喝水，松一口气的轻松互动后，李佳佳进一步想起沈清辞喝完水后曾发愣并问“我刚刚，是不是还有别的事要做”。自动贩卖机的冷白灯光随即触发沈清辞与顾夜舟的共同闪回：更早的窄巷里，年纪更小的沈清辞曾遇见样本07状态下出逃的顾夜舟，没有把他当怪物，还把外套借给他；而更远处的声音提到“样本07跑了”和“把顾澜带下来”。章尾李佳佳意识到，这也许不是男女主又一次认出彼此，而是他们真正意义上的第一次。
events:
- 李佳佳坦白自己可能曾递出第二瓶水后情绪失控，沈清辞先按住她让她继续“录口供”
- 顾夜舟追问递水地点与递水人，李佳佳确认地点像冷白灯下的自动贩卖机旁，递水人是许知衡
- 李佳佳补出关键话术：“她现在只信你”，说明许知衡利用了她在沈清辞那里的可信位置
- 李佳佳确认第二瓶水不是学校机器里的牌子，且瓶盖内侧带蓝色印痕
- 顾夜舟和沈清辞明确说明他们不防李佳佳，是因为她始终不越门槛、不碰证据、不替人做决定
- 三人转到连廊自动贩卖机旁复盘，顾夜舟先试喝再把水递给沈清辞
- 李佳佳想起旧线里沈清辞喝完水后曾发愣，并问“我刚刚，是不是还有别的事要做”
- 自动贩卖机冷白灯光触发沈清辞闪回，看见更早的窄巷、样本07状态下出逃的顾夜舟，以及自己年少时对他说“你别怕，我不喊人”
- 闪回里还出现追捕者声音：“样本07跑了”“把顾澜带下来，他会自己回来”
- 顾夜舟也被同一场景触发记忆，想起更早的沈清辞把校服外套借给自己
- 章尾李佳佳意识到，眼前这一次可能是男女主真正意义上的第一次认出彼此

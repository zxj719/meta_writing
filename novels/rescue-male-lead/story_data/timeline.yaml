  description: 灰蓝污染继续压入心理咨询室，陆闻川试图借空气异常把三人转入单独观察室；沈清辞通过共感和言语把被旧观察室记忆勾住的顾夜舟拉回，秦越用封缝、检测器和监护人流程持续打断陆闻川。污染刺激下，顾夜舟控制权异常跃迁，依次显出控物、控人和触碰能力链路控制三个阶段，系统提示临时控制态可持续十分钟但失控风险高，必须由沈清辞接触监护。温派伪装校工刺向李佳佳并亲自现身，却因不知秦越到场而踢到铁板，被秦越重创后靠战场经验逃离，同时在李佳佳袖口埋下灰蓝毒点。顾澜承认旧部恢复慢和老公寓高危刺激是计划一环；章尾旧港通讯器显示老公寓遭围剿，四名旧部生命点全红，07网心控制态倒计时开始。

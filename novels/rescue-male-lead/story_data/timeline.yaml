- chapter: 56
  description: 秦越以污染事件和监护人授权为由带沈清辞、顾夜舟、李佳佳离开心理咨询室，顾夜舟在车上追问通讯器里的顾澜，秦越只有限确认并转达“别恨太早”。顾夜舟在沈清辞接触监护下通过顾网远程接入老公寓围剿现场，借青鲤水系、现场金属和契约线完成控物、控人和能力链路干预，救下被围剿的青鲤、荒川、钟塔和旧港，并通过“我救你们出来，不是让你们换条线继续替我死”强化旧部羁绊。陆闻川留在心理咨询室，因顾夜舟控制痕迹触发妹妹陆星禾死亡记忆：她死于异能污染器官衰竭，他的治愈异能在葬礼上觉醒却无法复活她，于是他压下治愈能力、转向镜面和意识攻击，追求门后复活力量。章尾旧港通讯器提示训练场真正目标是逼07进入未知第四阶段，沈清辞要求顾夜舟到门口为止，不准越线。

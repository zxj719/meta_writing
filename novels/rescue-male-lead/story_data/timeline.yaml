- chapter: 57
  description: 老公寓围剿继续，旧部觉醒回流约三成后坚持在顾夜舟赶到前自己反攻，沈清辞劝顾夜舟不要把旧部当易碎品。顾夜舟在十分钟高控中只稳关键环境和攻击空隙，青鲤、荒川、钟塔、旧港各自找回部分能力并击退训练场成员。高控结束后，系统提示当前输出约为旧线巅峰十分之一，顾夜舟出现虎口旧伤、记忆回流和网心疲劳。沈清辞决定把顾夜舟和旧部一起接回沈宅，并用一个吻让顾夜舟答应，旧部集体喜闻乐见。温撤离途中确认老公寓试探失败但李佳佳灰蓝毒点已种下，毒点走器官污染路径、会借稳定系能力主动使用时往里开，其路径与陆星禾当年类似，并暗示教温制毒的人可能与害死陆星禾的污染有关。章尾沈清辞准备回沈宅后和沈父严肃谈话。

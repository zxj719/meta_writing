- chapter: 53
  description: 沈清辞、顾夜舟和李佳佳进入医务楼心理咨询室，陆闻川试图按个体访谈拆开三人；许知衡通过临川附中端校际心理支持系统回写数据，把三人的异常档案改成普通高三压力档案，迫使陆闻川改成团体访谈。许知衡在附中空教室想起实验室曾试图把自己的信任诱导能力纳入样本评估，明确自己对陆闻川和实验室没有忠诚，并短信警告陆闻川不要碰李佳佳。咨询室内李佳佳低功率稳定沈清辞，陆闻川被教务系统冲突叫出门。旧港通讯器随后显出心理咨询室分支路线，说明其预知/回溯能力可看见未来分支；旧港因蝴蝶效应创伤不敢直说双二十四岁记录，只让青鲤转发“访谈别分开”。章尾咨询室侧门转动，未知变量接近。

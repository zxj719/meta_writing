- chapter: 58
  description: 沈宅接收顾夜舟、李佳佳和旧部后，旧部在医疗室体验姜汤、按摩椅、智能花洒等富家生活，李佳佳继续用吐槽缓冲场面。沈清辞注意到李佳佳袖口灰蓝残留检测只跳极淡蓝格且系统无报警，要求她暂时不要主动使用稳定能力。随后沈清辞与沈父在书房谈话，沈父承认自己也是上条线过来的人，醒得比沈清辞早，并在沈清辞询问顾启明时知道两条线开始交汇；他上一条线记得沈清辞二十四岁身体指标下坠和顾夜舟病房外的样子，因此这一线只想让女儿健康平安普通地活着。沈清辞要求父亲不要再替她单方面决定活着的方式。沈父向顾澜单方面吐槽女儿把疑似女婿和顾夜舟旧部带回沈宅，顾澜因坐标风险只回呲牙笑。章尾陆闻川收掉心理医生身份，换脸成高三数学代课老师周启明，因早早察觉李佳佳稳定系波动迟滞并梦见妹妹陆星禾，决定用数学课外辅导观察李佳佳。

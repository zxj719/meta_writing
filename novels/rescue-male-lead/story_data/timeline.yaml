- chapter: 50
  description: 清舟CP楼在学生间已经形成，顾夜舟想要正式名分却不说，沈清辞通过单向共感捕捉到他的心跳并宣布他从预备役男友转为正式男友，还亲了他额头；饭后顾夜舟带青鲤、荒川、钟塔和旧港回自己从顾启明手里抢回的顾澜婚前老公寓，沈清辞则把独居且得罪许知衡的李佳佳带回沈家保护。夜里共感链路导致两人同时失眠，第二天带着同款黑眼圈在校门口见面；许知衡从陆闻川处收到旧线片段投喂，确认情感争夺窗口关闭但回收任务继续。

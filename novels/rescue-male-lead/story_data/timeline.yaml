- chapter: 51
  description: 青鲤闪回上一条线被顾夜舟从旧港地下三层水箱拍卖场救下，也想起顾夜舟曾远远保护沈清辞却无法靠近；当前线顾夜舟安排旧部在老公寓适应身体并整理旧线情报，学校则进入高考冲刺一百天，班主任让学生写目标大学便利贴。沈清辞和顾夜舟分别写下京州大学金融、京州大学化学，形成未来同城锚点；广播宣布苏晚宁因身体原因休学，许知衡和附中代表完成发言准备离校，陆闻川则在医务楼亲自接管百日冲刺心理摸排，把镜面线从公开校园场转入心理支持流程。

  hook_type: reversal
  description: “苏晚宁”被拆成镜面身份壳，真正的故事被推迟到更大的舞台
  position: end
- chapter: 31
  hook_type: suspense
  description: 成人礼即将同时迎来礼服高光、第一张合照、校领导演讲与更大样本线入口，陆闻川却只是最先露面的那只螳螂
  position: end
- chapter: 32
  hook_type: suspense
  description: 乔知夏提前听见本不该响起的追光异响，沈清辞和顾夜舟却被一并推上成人礼舞台中央
  position: end
- chapter: 33
  hook_type: suspense
  description: 乔知夏拍到追光落点里的模糊人影，证明成人礼正式场的舞台中心很可能早就盯上了顾夜舟
  position: end
- chapter: 34
  hook_type: suspense
  description: 流程单里多出的两名外场设备巡查和校门外消失的套牌车，说明下一步的局已经不只在学校里
  position: end
- chapter: 35
  hook_type: suspense
  description: 顾夜舟在成人礼纪念封套里翻出母亲留下的旧设备组工作牌，说明这场舞台上的局和顾母过去可能早就连在了一起
  position: end
- chapter: 36
  hook_type: suspense
  description: 门外不明人士确认B-17已经被拿走，也确认沈清辞和顾夜舟已经被看见，但暂时不准备动他们
  position: end
- chapter: 37
  hook_type: suspense
  description: 系统确认沈清辞是回线锚点S-QC，顾夜舟是保护对象07，当前稳定度只有31%
  position: end
- chapter: 38
  hook_type: emotional
  description: 前世关键偏差对象许知衡即将以联校优秀学生代表身份进入临川一中，沈清辞必须在顾夜舟察觉异常前稳住锚点
  position: end
- chapter: 39
  hook_type: suspense
  description: 下午分组讨论把沈清辞、顾夜舟和许知衡分到同一组，安排表背面的07浅痕暗示许知衡知道顾夜舟编号
  position: end
- chapter: 40
  hook_type: suspense
  description: 顾夜舟和沈清辞刚对上南门器材室雨夜的双向记忆，许知衡就站到空教室门外，像是掐着记忆覆写层松动的时间赶来
  position: end
- chapter: 41
  hook_type: suspense
  description: 许知衡递来的水瓶瓶底出现与顾母旧工作牌、B-17线相似的蓝色压痕，三楼旧试剂准备室成为下一扇被画好的门
  position: end
- chapter: 42
  hook_type: suspense
  description: 实验楼管理员报告三楼封闭区门锁响起且监控黑屏，许知衡敲击滴管后，旧试剂准备室方向传来门开的声音
  position: end
- chapter: 43
  hook_type: reversal
  description: 顾夜舟拿到防水标签，发现沈清辞曾“忘过他一次”，且不能再喝第二瓶水
  position: end
- chapter: 44
  hook_type: reversal
  description: 李佳佳坦白自己会串到交错旧线，并想起自己可能曾给沈清辞递过第二瓶水
  position: end
- chapter: 45
  hook_type: emotional
  description: 李佳佳意识到眼前这次共同闪回，也许不是男女主又一次认出彼此，而是他们真正意义上的第一次
  position: end
- chapter: 46
  hook_type: reversal
  description: 自动贩卖机吐出票据，确认当前线沈清辞已经被标记为本线S-QC，且回收优先级最高，敌方目标从“让她忘记”升级为“把她带回原线”
  position: end
- chapter: 47
  hook_type: suspense
  description: 执行者从攻击失败中判断出认门人与钥匙在一起时杀不掉，说明敌方已经开始识别这条保护规则
  position: end
- chapter: 48
  hook_type: reversal
  description: 李佳佳资料袋内侧在男女主眼里显出“沈网契约者：李佳佳，状态：未觉醒”，说明她上一条线的挡灾身份即将回到当前线
  position: end
- chapter: 49
  hook_type: emotional
  description: 沈清辞确认单向共感无法屏蔽，第一次真正感受到顾夜舟安静看她时被压在胸腔里的心跳
  position: end
- chapter: 50
  hook_type: suspense
  description: 许知衡收到陆闻川投喂的旧线片段，情感争夺窗口关闭，但针对沈清辞的回收任务继续
  position: end
- chapter: 51
  hook_type: suspense
  description: 陆闻川以百日冲刺心理摸排名义亲自接管镜面线，沈清辞、顾夜舟和李佳佳同时进入新的筛查名单
  position: end
- chapter: 52
  hook_type: conflict
  description: 广播点名沈清辞、顾夜舟、李佳佳下午第三节后参加医务楼心理访谈，陆闻川的合法流程开始正面压到三人身上
  position: end
- chapter: 53
  hook_type: suspense
  description: 旧港看到心理咨询室侧门即将开启，未知变量接近，咨询室局面将从团体访谈继续升级
  position: end
- chapter: 54
  hook_type: conflict
  description: 训练场毒系污染进入通风口，秦越挡住陆闻川转场，心理咨询室场景必须在下一章现场收束

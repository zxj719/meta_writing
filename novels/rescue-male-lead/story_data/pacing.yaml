- chapter: 34
  beat_type: medium
  description: 成人礼正式场继续把男女主推到最亮的位置，同时把威胁范围从礼堂内部扩展到校门外的暗线观察者
  delivered: true
- chapter: 35
  beat_type: medium
  description: 成人礼散场后的签名、合影和偷溜透气把高三地下恋落到更日常的甜度上，同时用顾母旧工作牌把舞台线和上一代痕迹连到了一起
  delivered: true
- chapter: 36
  beat_type: medium
  description: 成人礼感想和班级日常稳住节奏后，顾母旧工作牌触发短暂共振，并把男女主带到B-17已被提前取走的旧放映间
  delivered: true
- chapter: 37
  beat_type: major
  description: 第三方人员在门外谈话里抬出顾澜转移链、回线锚点和07号保护对象，让顾母未死线与沈清辞回溯机制同时进入明线边缘
  delivered: true
- chapter: 38
  beat_type: medium
  description: 八百字惩罚和成人礼照片墙把节奏拉回高三日常，同时用系统保密提示、32%稳定度、许知衡名单和上一世后期顾夜舟递证据的回忆，把回线原因、前世错误关系线和男女主前世羁绊继续往前推
  delivered: true
- chapter: 39
  beat_type: medium
  description: 许知衡正式亮相，亲和外壳和信任诱导气质进入明场；沈清辞读心术在他身上失真，安排表背面的07浅痕把许知衡线和顾夜舟编号直接连上

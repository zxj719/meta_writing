- chapter: 44
  beat_type: medium
  description: 李佳佳从自然掩护位升级为交错记忆观察者，补足她站沈清辞的情感原因，并把第二瓶水推进到“可信同学可能曾递出”的新风险
  delivered: true
- chapter: 45
  beat_type: medium
  description: 第二瓶水的递送细节和喝后失忆反应正式落地，自动贩卖机冷光又把男女主的羁绊前置到更早的样本出逃夜
  delivered: true
- chapter: 47
  beat_type: medium
  description: 楼梯间短战斗用沈清辞散打补现实能力坑，接触保护规则首次显性触发，青鲤作为旧部苏醒登场并把紧张主线转出轻喜剧反差
  delivered: true
- chapter: 48
  beat_type: major
  description: 顾夜舟视角上一条线专题回顾，补出青鲤救援、契约者双网、李佳佳毁门挡灾和沈清辞单方协议，把旧部线从登场推进到核心机制
  delivered: true
- chapter: 49
  beat_type: medium
  description: 化学楼参观被短时记忆裁剪和安全隐患理由顺利收尾，旧部第一顿完整饭局落地，沈清辞向顾夜舟披露系统存在，单方协议开始表现为疼痛与心动单向共感
  delivered: true
- chapter: 50
  beat_type: medium
  description: 清舟私下正式确认关系，旧部和李佳佳分别获得临时落脚保护点，许知衡从陆闻川处获得旧线片段但情感争夺窗口关闭
  delivered: true
- chapter: 51
  beat_type: medium
  description: 青鲤视角补出顾夜舟上一条线救旧部与远程护沈清辞的情感源头，当前校园线进入百日誓师，清舟目标大学同城落点成立，镜面线转为陆闻川亲自接管的心理摸排流程
  delivered: true
- chapter: 52
  beat_type: major
  description: 陆闻川心理摸排正式落地并锁定S-QC、07和LJJ，李佳佳初步觉醒治愈/稳定能力，许知衡与陆闻川阵营裂缝显露，旧港回忆带出名字来源和双二十四岁终局记录
  delivered: true
- chapter: 53
  beat_type: major
  description: 医务楼心理访谈从单方筛查变成三方暗战，许知衡越权改写流程背刺陆闻川，旧港通讯器显出分支路线并以“访谈别分开”偷偷介入
  delivered: true
- chapter: 54
  beat_type: major
  description: 异控局保护线、顾澜半在线、命线互锁和训练场毒系外援同时压入心理咨询室现场
  delivered: true
